services:
  - type: web
    name: medicomm
    runtime: node
    plan: starter
    healthCheckPath: /health/ready
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ORIGINS
        value: https://medullaprep.com,https://www.medullaprep.com
      - key: SUPABASE_UPLOAD_BUCKET
        value: medicomm-uploads
      - key: TRUST_PROXY
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: VIVA_QUESTION_MODEL
        value: gemini-3.5-flash-lite
      - key: CLINICAL_CASE_MODEL
        value: gemini-3.5-flash-lite
      - key: CLINICAL_CASE_EVALUATION_MODEL
        value: gemini-3.5-flash
