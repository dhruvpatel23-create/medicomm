services:
  - type: web
    name: medicomm
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VIVA_QUESTION_MODEL
        value: gemini-3.5-flash-lite
      - key: CLINICAL_CASE_MODEL
        value: gemini-3.5-flash-lite
      - key: CLINICAL_CASE_EVALUATION_MODEL
        value: gemini-3.5-flash
