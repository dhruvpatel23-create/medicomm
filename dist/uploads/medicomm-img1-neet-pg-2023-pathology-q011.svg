<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="depositGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af"/><stop offset="70%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-360" y="-24" width="720" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">GLOMERULAR BASEMENT MEMBRANE: SILVER STAIN</text>
  </g>
  <g transform="translate(480, 360)">
    <!-- Capillary Lumen -->
    <path d="M -340,160 C -180,240 180,240 340,160 L 340,240 L -340,240 Z" fill="#1e293b" opacity="0.6"/>
    <text x="0" y="210" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="20" font-weight="900" fill="#94a3b8" letter-spacing="2">CAPILLARY LUMEN</text>

    <!-- Basement Membrane Core -->
    <path d="M -360,110 C -180,150 180,150 360,110 L 360,70 C 180,110 -180,110 -360,70 Z" fill="#0f172a" stroke="#020617" stroke-width="3"/>

    <!-- Domes -->
    <ellipse cx="-200" cy="30" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>
    <ellipse cx="-120" cy="20" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>
    <ellipse cx="-40" cy="15" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>
    <ellipse cx="40" cy="15" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>
    <ellipse cx="120" cy="20" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>
    <ellipse cx="200" cy="30" rx="22" ry="24" fill="url(#depositGrad)" stroke="#be123c" stroke-width="2"/>

    <!-- Spikes -->
    <path d="
      M -245,80 L -240,-5 L -233,80
      M -165,75 L -160,-15 L -153,75
      M -85,72 L -80,-20 L -73,72
      M -5,70 L 0,-22 L 7,70
      M 75,72 L 80,-20 L 87,72
      M 155,75 L 160,-15 L 167,75
      M 235,80 L 240,-5 L 247,80
    " fill="#020617" stroke="#334155" stroke-width="2.5"/>

    <text x="0" y="-80" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#cbd5e1" letter-spacing="1">EFFACED PODOCYTE LAYER</text>
  </g>
  
  <g transform="translate(240, 180)">
    <rect x="-120" y="-26" width="240" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Basement Spike</text>
    <path d="M 108,0 L 245,150" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="245" cy="150" r="6" fill="#fde047"/>
  </g>
  
  <g transform="translate(720, 180)">
    <rect x="-135" y="-26" width="270" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Subepithelial Dome</text>
    <path d="M -123,0 L -190,185" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-190" cy="185" r="6" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>