<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 80)">
    <!-- High-Resolution Axial Temporal Bone CT (Bone Window) -->
    <ellipse cx="350" cy="360" rx="330" ry="300" fill="#0f172a" stroke="#475569" stroke-width="4"/>

    <!-- Internal Auditory Canal (IAC) -->
    <rect x="230" y="200" width="70" height="25" rx="5" fill="#000000" stroke="#64748b" stroke-width="2"/>
    <text x="265" y="190" fill="#64748b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IAC</text>

    <!-- Middle Ear Cavity (Tympanum & Ossicles) -->
    <rect x="110" y="280" width="80" height="100" rx="10" fill="#000000" stroke="#64748b" stroke-width="2.5"/>

    <!-- Carotid Canal Anteriorly -->
    <circle cx="220" cy="380" r="30" fill="#000000" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="220" y="385" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Carotid</text>

    <!-- JUGULAR FORAMEN REGION: Irregular Permeative Moth-Eaten Bony Erosion -->
    <path d="M 300 370 C 370 340, 440 380, 410 470 C 370 510, 290 480, 275 420 Z" 
          fill="#4c0519" stroke="#f43f5e" stroke-width="4"/>
          
    <!-- Moth-eaten Permeative Bony Margins (Irregular Bony Spicules) -->
    <g stroke="#f43f5e" stroke-width="3" fill="none">
      <line x1="300" y1="370" x2="285" y2="355"/><line x1="340" y1="355" x2="345" y2="340"/>
      <line x1="400" y1="375" x2="420" y2="360"/><line x1="410" y1="440" x2="430" y2="450"/>
      <line x1="385" y1="490" x2="400" y2="510"/><line x1="315" y1="475" x2="300" y2="495"/>
    </g>

    <!-- Tumor Extension into Hypotympanum -->
    <path d="M 275 385 C 235 355, 210 350, 190 350" stroke="#f43f5e" stroke-width="12" stroke-dasharray="4,4" fill="none"/>

    <!-- Gold Arrow pointing to the Permeative Bone Defect -->
    <g transform="translate(510, 440)">
      <line x1="80" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>