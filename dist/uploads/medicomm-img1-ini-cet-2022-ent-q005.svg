<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(280, 80)">
    <!-- Transnasal Endoscopic View of Superior Nasal Cavity -->
    <circle cx="320" cy="370" r="320" fill="#020617" stroke="#475569" stroke-width="6"/>

    <!-- Nasal Septum (Medial Border) -->
    <path d="M 140 80 L 160 660" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>

    <!-- Superior Turbinate (Concha Superior) -->
    <path d="M 250 180 C 300 200, 330 280, 280 320 C 250 300, 240 240, 250 180 Z" 
          fill="#334155" stroke="#64748b" stroke-width="3.5"/>

    <!-- Middle Turbinate below (Partially Visualized) -->
    <path d="M 260 380 C 350 400, 420 500, 340 560" stroke="#475569" stroke-width="12" fill="none"/>

    <!-- POSTEROSUPERIOR RECESS CLEFT (Deep Cleft Located Postero-Superior to Superior Concha) -->
    <path d="M 290 190 C 370 200, 420 280, 360 340 C 310 320, 310 230, 290 190 Z" 
          fill="#4c0519" stroke="#be123c" stroke-width="3"/>

    <!-- Sphenoid Sinus Natural Ostium (Small Round/Oval Aperture inside Recess) -->
    <ellipse cx="345" cy="265" rx="14" ry="20" fill="#000000" stroke="#f59e0b" stroke-width="3"/>

    <!-- Precise Gold Pointer to the Marked Ostium / Recess -->
    <g transform="translate(480, 220)">
      <line x1="80" y1="-25" x2="15" y2="25" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>