<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Field Vignette -->
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="70%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>

    <!-- Orphan Annie Nucleus Gradient (Optically Clear, Ground-Glass, Marginated Chromatin) -->
    <radialGradient id="orphanAnnieNuc" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f5f3ff"/>
      <stop offset="85%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <!-- Psammoma Body Gradient (Concentric Laminated Calcified Spherule) -->
    <radialGradient id="psammomaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="25%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#4f46e5"/>
      <stop offset="85%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-310" y="-20" width="620" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">PAPILLARY THYROID CARCINOMA HISTOPATHOLOGY</text>
  </g>

  <!-- Circular Microscopy Field (Center: 480, 310, r: 230) -->
  <g transform="translate(480, 310)" filter="url(#shadowBox)">
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#fieldGrad)"/>

    <g clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Papillary Architecture (Branching fronds with fibrovascular cores) -->
      <!-- Central Dominant Papillary Frond Stalk -->
      <path d="M 0,230 Q 10,80 -30,0 Q -80,-90 -160,-120 Q -90,-180 0,-150 Q 80,-120 140,-170 Q 180,-70 110,-10 Q 50,70 40,230 Z" 
            fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>

      <!-- Fibrovascular core inside papilla (pink collagen + congested capillary) -->
      <path d="M 15,230 Q 20,80 -15,0 Q -50,-60 -120,-100 Q -60,-150 0,-120 Q 60,-90 100,-130 Q 130,-50 80,0 Q 30,70 25,230 Z" 
            fill="#f9a8d4" opacity="0.6"/>
      
      <!-- Capillaries with red blood cells running in stalk -->
      <g stroke="#e11d48" stroke-width="3" fill="none" opacity="0.8">
        <path d="M 20,230 Q 18,90 -5,10 Q -40,-40 -100,-80"/>
        <path d="M 0,10 Q 40,-40 80,-90"/>
      </g>
      <!-- Capillary RBCs inside fibrovascular core -->
      <circle cx="-10" cy="60" r="4.5" fill="#ef4444"/>
      <circle cx="5" cy="110" r="4" fill="#ef4444"/>
      <circle cx="12" cy="160" r="4.5" fill="#ef4444"/>
      <circle cx="-50" cy="-50" r="4" fill="#ef4444"/>
      <circle cx="45" cy="-55" r="4.5" fill="#ef4444"/>

      <!-- Laminated Psammoma Body (Left Lower Core: -70, 70) -->
      <g transform="translate(-70, 70)">
        <circle cx="0" cy="0" r="28" fill="url(#psammomaGrad)" stroke="#1e1b4b" stroke-width="1.5"/>
        <!-- Concentric Laminations -->
        <circle cx="0" cy="0" r="22" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#312e81" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="11" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#1e1b4b" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
      </g>

      <!-- Smaller Second Psammoma Body (Right: 110, 80) -->
      <g transform="translate(110, 80)">
        <circle cx="0" cy="0" r="18" fill="url(#psammomaGrad)" stroke="#1e1b4b" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#818cf8" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#1e1b4b" stroke-width="1"/>
      </g>

      <!-- Neoplastic Epithelial Cells with ORPHAN ANNIE EYE NUCLEI Lining Papillae -->
      <!-- Macro Group of Orphan Annie Nuclei (Prominent Display) -->
      <!-- 1. Central Papillary Tip Cells -->
      <g stroke="#4c1d95" stroke-width="1.8">
        <!-- Top frond Annie Eyes -->
        <ellipse cx="-40" cy="-160" rx="14" ry="19" transform="rotate(-15 -40 -160)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-10" cy="-175" rx="13" ry="18" transform="rotate(5 -10 -175)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="25" cy="-165" rx="14" ry="20" transform="rotate(20 25 -165)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="60" cy="-145" rx="13" ry="17" transform="rotate(-10 60 -145)" fill="url(#orphanAnnieNuc)"/>

        <!-- Left branch Annie Eyes -->
        <ellipse cx="-110" cy="-135" rx="15" ry="19" transform="rotate(-40 -110 -135)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-140" cy="-105" rx="14" ry="18" transform="rotate(-30 -140 -105)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-80" cy="-110" rx="13" ry="17" transform="rotate(10 -80 -110)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-60" cy="-75" rx="14" ry="19" transform="rotate(25 -60 -75)" fill="url(#orphanAnnieNuc)"/>
        
        <!-- Right branch Annie Eyes -->
        <ellipse cx="100" cy="-130" rx="14" ry="18" transform="rotate(35 100 -130)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="135" cy="-90" rx="15" ry="19" transform="rotate(15 135 -90)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="90" cy="-70" rx="13" ry="17" transform="rotate(-20 90 -70)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="75" cy="-35" rx="14" ry="18" transform="rotate(10 75 -35)" fill="url(#orphanAnnieNuc)"/>

        <!-- Central Stalk Lining Annie Eyes -->
        <ellipse cx="-45" cy="-20" rx="14" ry="20" transform="rotate(-10 -45 -20)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-50" cy="20" rx="13" ry="18" transform="rotate(5 -50 20)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-40" cy="60" rx="14" ry="19" transform="rotate(-15 -40 60)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-30" cy="110" rx="13" ry="18" transform="rotate(10 -30 110)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="-20" cy="160" rx="14" ry="19" transform="rotate(-5 -20 160)" fill="url(#orphanAnnieNuc)"/>

        <ellipse cx="40" cy="-5" rx="13" ry="19" transform="rotate(15 40 -5)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="45" cy="35" rx="14" ry="18" transform="rotate(-10 45 35)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="40" cy="80" rx="13" ry="19" transform="rotate(20 40 80)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="50" cy="125" rx="14" ry="18" transform="rotate(-15 50 125)" fill="url(#orphanAnnieNuc)"/>
        <ellipse cx="45" cy="170" rx="13" ry="18" transform="rotate(5 45 170)" fill="url(#orphanAnnieNuc)"/>
      </g>

      <!-- Nuclear Grooves ("Coffee-Bean" longitudinal slit across nuclei) -->
      <g stroke="#3b0764" stroke-width="2" stroke-linecap="round">
        <line x1="-42" y1="-172" x2="-38" y2="-148"/>
        <line x1="22" y1="-178" x2="28" y2="-152"/>
        <line x1="-115" y1="-145" x2="-105" y2="-125"/>
        <line x1="132" y1="-102" x2="138" y2="-78"/>
        <line x1="-45" y1="-30" x2="-45" y2="-10"/>
        <line x1="43" y1="25" x2="47" y2="45"/>
      </g>

      <!-- Nuclear Pseudoinclusion (Eosinophilic pink bubble inside clear nucleus) -->
      <circle cx="-10" cy="-175" r="5" fill="#f472b6" stroke="#db2777" stroke-width="1"/>
      <circle cx="90" cy="-70" r="4.5" fill="#f472b6" stroke="#db2777" stroke-width="1"/>
    </g>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: Orphan Annie Eye Nuclei -->
  <g transform="translate(170, 150)">
    <circle cx="0" cy="0" r="16" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="20" y1="5" x2="260" y2="10" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#c084fc">ORPHAN ANNIE EYE NUCLEI</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Optically clear, ground-glass, vesicular</text>
  </g>

  <!-- Callout 2: Psammoma Body -->
  <g transform="translate(170, 390)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2</text>
    <line x1="20" y1="-5" x2="225" y2="-10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">PSAMMOMA BODY</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Concentric laminated calcification</text>
  </g>

  <!-- Callout 3: Fibrovascular Core & Nuclear Grooves -->
  <g transform="translate(790, 240)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">3</text>
    <line x1="-20" y1="5" x2="-220" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="25" y="-5" text-anchor="start" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">NUCLEAR GROOVES &amp; INCLUSIONS</text>
    <text x="25" y="15" text-anchor="start" font-family="sans-serif" font-size="12" fill="#cbd5e1">"Coffee-bean" grooves &amp; pseudoinclusions</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">PATHOGNOMONIC NUCLEAR TRIAD</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Ground Glass:</tspan> Orphan Annie eyes (finely dispersed chromatin).</text>
    <text x="20" y="66" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Membrane Folds:</tspan> Longitudinal grooves (coffee bean).</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Invaginations:</tspan> True intranuclear cytoplasmic pseudoinclusions.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">EPIDEMIOLOGY &amp; GENETICS</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Prevalence:</tspan> Most common thyroid malignancy (&gt;85% of cases).</text>
    <text x="20" y="66" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#4ade80">Gene Mutations:</tspan> BRAF V600E (most common) &amp; RET/PTC fusions.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Spread:</tspan> Lymphatic spread to cervical lymph nodes (excellent 10-yr OS).</text>
  </g>

  <!-- Medulla Watermark -->
  
</svg>
