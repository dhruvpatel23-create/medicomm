<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="85%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <radialGradient id="pearlGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/><stop offset="70%" stop-color="#e11d48"/><stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  
  <g transform="translate(480, 48)">
    <rect x="-370" y="-24" width="740" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">ESOPHAGEAL BIOPSY: SQUAMOUS CELL HISTOPATHOLOGY</text>
  </g>
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="280" fill="url(#fieldGrad)" stroke="#334155" stroke-width="8"/>
    <clipPath id="c2"><circle cx="0" cy="0" r="276"/></clipPath>
    <g clip-path="url(#c2)">
      <!-- Malignant Squamous Cell Nest -->
      <path d="M -220,-160 C -80,-240 120,-200 220,-120 C 260,0 200,160 120,200 C -20,240 -160,200 -220,120 C -260,20 -260,-80 -220,-160 Z" fill="#fda4af" stroke="#e11d48" stroke-width="3"/>
      
      <!-- Concentric Keratin Pearl (Pathognomonic) -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="65" fill="url(#pearlGrad)" stroke="#881337" stroke-width="3"/>
        <path d="M -45,-15 C -30,-45 30,-45 45,-15 C 50,15 25,45 -10,45 C -40,40 -50,10 -45,-15" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>
        <path d="M -25,-5 C -15,-25 15,-25 25,-5 C 30,15 10,25 -5,25 C -20,20 -25,10 -25,-5" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.85"/>
        <circle cx="0" cy="0" r="8" fill="#ffe4e6"/>
      </g>

      <!-- Surrounding Pleomorphic Malignant Cells with Intercellular Bridges -->
      <g fill="#4c1d95">
        <circle cx="-140" cy="-60" r="14"/><circle cx="-160" cy="40" r="15"/>
        <circle cx="150" cy="-40" r="15"/><circle cx="130" cy="60" r="14"/>
        <circle cx="-60" cy="-140" r="15"/><circle cx="60" cy="-130" r="14"/>
        <circle cx="-50" cy="130" r="14"/><circle cx="50" cy="140" r="15"/>
      </g>
    </g>
  </g>
  
  <g transform="translate(740, 270)">
    <rect x="-145" y="-26" width="290" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Keratin Pearl Nest</text>
    <path d="M -133,0 L -200,60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-200" cy="60" r="6" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>