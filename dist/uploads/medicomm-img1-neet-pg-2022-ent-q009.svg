<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(100, 100)">
    <!-- Dual Panel: Left Endoscopy, Right Axial CT -->
    
    <!-- Left: Transnasal Endoscopic View -->
    <g transform="translate(50, 40)">
      <circle cx="200" cy="300" r="220" fill="#020617" stroke="#475569" stroke-width="5"/>
      
      <!-- Hypervascular Red-Purple Lobulated Choanal Mass -->
      <g transform="translate(200, 300)">
        <ellipse cx="0" cy="0" rx="130" ry="120" fill="#7f1d1d" stroke="#b91c1c" stroke-width="4"/>
        <ellipse cx="-30" cy="-20" rx="80" ry="70" fill="#991b1b"/>
        <ellipse cx="35" cy="30" rx="75" ry="60" fill="#dc2626" opacity="0.85"/>
        
        <!-- Tortuous Surface Vessel Networks -->
        <path d="M -70 -40 Q -30 0 20 -30 Q 60 -10 90 20" stroke="#fca5a5" stroke-width="4" fill="none"/>
        <path d="M -40 30 Q 0 60 60 40" stroke="#fca5a5" stroke-width="3.5" fill="none"/>
        <path d="M 0 -60 Q 30 -30 40 30" stroke="#fca5a5" stroke-width="3" fill="none"/>
      </g>
      <text x="200" y="560" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Transnasal Endoscopy</text>
    </g>

    <!-- Right: Axial CECT (Holman-Miller Antral Sign) -->
    <g transform="translate(550, 40)">
      <ellipse cx="200" cy="300" rx="220" ry="200" fill="#0f172a" stroke="#475569" stroke-width="4"/>

      <!-- Normal Right Maxillary Sinus -->
      <rect x="40" y="210" width="110" height="120" rx="10" fill="#000000" stroke="#64748b" stroke-width="2.5"/>

      <!-- Left Maxillary Sinus with Anterior Bowing of Posterior Wall -->
      <path d="M 230 210 L 340 210 L 340 310 C 290 270, 260 270, 230 330 Z" 
            fill="#000000" stroke="#64748b" stroke-width="2.5"/>
      
      <!-- Enhancing Pterygopalatine Fossa Tumor Bowing the Wall Antral-ward -->
      <ellipse cx="290" cy="320" rx="55" ry="42" fill="#be123c" opacity="0.9" stroke="#f43f5e" stroke-width="3"/>

      <!-- Gold Arrow showing the Anterior Bowing (Holman-Miller Sign) -->
      <g transform="translate(320, 420)">
        <line x1="40" y1="30" x2="-20" y2="-50" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
      </g>
      <text x="200" y="560" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Axial CECT (PNS)</text>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>