<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(320, 100)">
    <!-- Isolated Auditory Ossicle Specimen -->
    <g transform="translate(100, 40)">
      <!-- Body of Specimen Bone with Concave Articular Facet -->
      <path d="M 90 100 
               C 120 50, 230 40, 280 90 
               C 310 120, 320 170, 290 210 
               L 360 230 
               C 385 240, 385 265, 360 270 
               L 260 260 
               L 250 420 
               C 245 455, 210 470, 195 460 
               C 180 450, 180 425, 190 405 
               L 195 250 
               C 155 260, 100 245, 80 200 
               C 65 165, 70 125, 90 100 Z" 
            fill="#e2e8f0" stroke="#cbd5e1" stroke-width="5"/>

      <!-- Concave Saddle-Shaped Articular Facet -->
      <path d="M 100 110 C 120 90, 160 90, 180 120 C 190 150, 180 190, 150 200 C 125 210, 95 190, 90 160 Z" 
            fill="#94a3b8" opacity="0.6"/>
      <text x="140" y="155" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Facet</text>

      <!-- Lenticular Process at tip of Long Process -->
      <ellipse cx="195" cy="460" rx="14" ry="11" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>

      <!-- Feature Lines -->
      <!-- Body -->
      <line x1="280" y1="130" x2="400" y2="100" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="415" y="105" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Body</text>

      <!-- Short Process -->
      <line x1="360" y1="250" x2="440" y2="250" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="455" y="255" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Short Process</text>

      <!-- Long Process -->
      <line x1="225" y1="350" x2="330" y2="350" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="345" y="355" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Long Process</text>

      <!-- Lenticular Process -->
      <line x1="210" y1="460" x2="330" y2="460" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="345" y="465" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Lenticular Process</text>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>