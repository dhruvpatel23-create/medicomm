<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Nutmeg pattern: pale tan background with dark reddish-brown congested centers -->
    <radialGradient id="nutmegField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <pattern id="congestedZones" width="36" height="36" patternUnits="userSpaceOnUse">
      <!-- Dark reddish-brown central vein congestion (Zone 3) -->
      <circle cx="18" cy="18" r="8" fill="#7f1d1d"/>
      <circle cx="18" cy="18" r="5" fill="#450a0a"/>
      <!-- Radiating sinusoids -->
      <path d="M 18,10 L 18,5 M 18,26 L 18,31 M 10,18 L 5,18 M 26,18 L 31,18" stroke="#991b1b" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">GROSS PATHOLOGY: CUT SECTION OF LIVER</text>
  </g>

  <!-- Liver Cut Surface Specimen Window -->
  <g transform="translate(480, 350)" filter="url(#shadow)">
    <!-- Natural anatomical liver slice outline -->
    <ellipse cx="0" cy="0" rx="340" ry="220" fill="url(#nutmegField)" stroke="#9a3412" stroke-width="4"/>
    <!-- Overlaid dense reticulated congestion pattern -->
    <ellipse cx="0" cy="0" rx="335" ry="215" fill="url(#congestedZones)" opacity="0.85"/>

    <!-- Central Hepatic Vein Branches cut in cross-section -->
    <g transform="translate(-70, -20)">
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="#450a0a" stroke="#7f1d1d" stroke-width="2.5"/>
      <path d="M -16,0 C -60,10 -110,-30 -160,-20" stroke="#7f1d1d" stroke-width="4" fill="none"/>
    </g>

    <!-- Zone Contrast Labels / Annotations -->
    <!-- Dark Area Annotation -->
    <g transform="translate(-180, 130)">
      <rect x="-10" y="-14" width="220" height="28" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fca5a5">DARK AREAS (CENTRILOBULAR)</text>
      <line x1="100" y1="-14" x2="80" y2="-45" stroke="#ef4444" stroke-width="2.5"/>
      <polygon points="76,-54 88,-44 76,-40" fill="#ef4444"/>
    </g>

    <!-- Pale Area Annotation -->
    <g transform="translate(140, -130)">
      <rect x="-10" y="-14" width="200" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="90" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fef08a">PALE AREAS (PERIPORTAL)</text>
      <line x1="90" y1="14" x2="60" y2="48" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="54,56 68,46 56,42" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>