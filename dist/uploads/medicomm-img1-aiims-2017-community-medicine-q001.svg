<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <rect width="1000" height="800" fill="#030712"/>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bgGlow)"/>

  <!-- Header -->
  <text x="500" y="65" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">BIOMEDICAL WASTE MANAGEMENT</text>
  <text x="500" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">Clinical Waste Segregation Protocol</text>

  <!-- Red Waste Bag Graphics -->
  <g transform="translate(100, 30)" filter="url(#shadow)">
    <!-- Floor shadow -->
    <ellipse cx="400" cy="670" rx="260" ry="25" fill="#000000" opacity="0.6"/>

    <!-- Bag Top Ruffle / Flare -->
    <path d="M 230 180 Q 210 140 230 110 Q 280 135 340 120 Q 400 130 460 115 Q 520 135 570 110 Q 590 140 570 180 Z" fill="#ef4444"/>
    
    <!-- White Closure Tie Strip -->
    <path d="M 220 180 Q 400 195 580 180 L 585 195 Q 400 210 215 195 Z" fill="url(#tieGrad)"/>
    
    <!-- Main Bag Body -->
    <path d="M 220 195 
             C 170 280, 140 430, 150 560 
             C 155 630, 210 660, 310 665 
             C 410 670, 490 670, 590 660 
             C 645 650, 655 615, 650 550 
             C 640 420, 620 280, 580 195 
             Z" 
          fill="url(#redBagGrad)"/>

    <!-- Highlights & Sheen on Plastic -->
    <path d="M 220 230 C 190 320, 185 450, 195 560 C 200 580, 220 540, 230 450 C 240 350, 250 260, 235 225 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M 320 210 C 310 270, 300 360, 305 450 C 310 360, 325 270, 335 210 Z" fill="#ffffff" opacity="0.08"/>
    <path d="M 520 220 C 540 320, 560 440, 565 540 C 575 440, 570 320, 545 220 Z" fill="#ffffff" opacity="0.09"/>

    <!-- Wrinkle Folds -->
    <path d="M 180 380 Q 260 410 330 395" stroke="#7f1d1d" stroke-width="6" fill="none" opacity="0.5"/>
    <path d="M 470 385 Q 550 405 625 365" stroke="#7f1d1d" stroke-width="6" fill="none" opacity="0.5"/>
    <path d="M 210 520 Q 350 560 490 530" stroke="#7f1d1d" stroke-width="8" fill="none" opacity="0.45"/>
    <path d="M 300 580 Q 420 620 560 575" stroke="#7f1d1d" stroke-width="7" fill="none" opacity="0.4"/>

    <!-- Centered Biohazard Symbol -->
    <g transform="translate(400, 450) scale(1.15)">
      <!-- Outer black ring segments -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#09090b" stroke-width="9"/>
      
      <!-- Central core cutout -->
      <circle cx="0" cy="0" r="14" fill="url(#redBagGrad)"/>
      <circle cx="0" cy="0" r="9" fill="#09090b"/>

      <!-- Three biohazard crescents -->
      <g transform="rotate(0)">
        <path d="M 0 -72 C -24 -72 -44 -52 -44 -26 C -44 -7 -30 9 -13 14 C -18 3 -18 -10 -13 -22 C -8 -34 2 -43 13 -47 C 8 -52 3 -58 0 -72 Z" fill="#09090b"/>
        <path d="M 0 -72 C 24 -72 44 -52 44 -26 C 44 -7 30 9 13 14 C 18 3 18 -10 13 -22 C 8 -34 -2 -43 -13 -47 C -8 -52 -3 -58 0 -72 Z" fill="#09090b"/>
      </g>
      <g transform="rotate(120)">
        <path d="M 0 -72 C -24 -72 -44 -52 -44 -26 C -44 -7 -30 9 -13 14 C -18 3 -18 -10 -13 -22 C -8 -34 2 -43 13 -47 C 8 -52 3 -58 0 -72 Z" fill="#09090b"/>
        <path d="M 0 -72 C 24 -72 44 -52 44 -26 C 44 -7 30 9 13 14 C 18 3 18 -10 13 -22 C 8 -34 -2 -43 -13 -47 C -8 -52 -3 -58 0 -72 Z" fill="#09090b"/>
      </g>
      <g transform="rotate(240)">
        <path d="M 0 -72 C -24 -72 -44 -52 -44 -26 C -44 -7 -30 9 -13 14 C -18 3 -18 -10 -13 -22 C -8 -34 2 -43 13 -47 C 8 -52 3 -58 0 -72 Z" fill="#09090b"/>
        <path d="M 0 -72 C 24 -72 44 -52 44 -26 C 44 -7 30 9 13 14 C 18 3 18 -10 13 -22 C 8 -34 -2 -43 -13 -47 C -8 -52 -3 -58 0 -72 Z" fill="#09090b"/>
      </g>

      <!-- Regulatory Label -->
      <text x="0" y="115" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="4">BIOHAZARD</text>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>