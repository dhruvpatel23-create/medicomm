<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(280, 80)">
    <!-- Lateral Craniofacial Contour -->
    <path d="M 140 60 C 260 40, 400 90, 440 240 C 470 340, 450 440, 420 540 C 370 600, 300 620, 240 620 L 120 620 Z" 
          fill="#1e293b" stroke="#334155" stroke-width="4"/>

    <!-- Ear Pinna -->
    <path d="M 280 180 C 270 110, 360 110, 370 190 C 380 250, 350 290, 320 310 C 300 325, 290 300, 280 260 Z" 
          fill="#334155" stroke="#475569" stroke-width="3"/>

    <!-- Tense, Tender, Fluctuant Parotid Glandular Mass -->
    <!-- Centered in pre- and infra-auricular space, elevating ear lobule -->
    <ellipse cx="340" cy="335" rx="85" ry="75" fill="#881337" opacity="0.85" stroke="#e11d48" stroke-width="4"/>
    <ellipse cx="345" cy="330" rx="55" ry="48" fill="#be123c" opacity="0.9"/>
    <circle cx="350" cy="325" r="22" fill="#fb7185" opacity="0.6"/>

    <!-- Elevating Ear Lobule contour -->
    <path d="M 315 305 Q 335 280 345 315" stroke="#f43f5e" stroke-width="4" fill="none"/>

    <!-- Mandibular Jawline Guide -->
    <path d="M 420 340 L 420 440 L 320 540 L 220 540" stroke="#64748b" stroke-width="3" stroke-dasharray="6,6" fill="none"/>

    <!-- Gold Arrow pointing to the tense fluctuant swelling -->
    <g transform="translate(520, 335)">
      <line x1="80" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>