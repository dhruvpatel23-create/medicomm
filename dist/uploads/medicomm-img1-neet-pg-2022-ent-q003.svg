<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(320, 80)">
    <!-- Victim Torso (Bent Slightly Forward) -->
    <path d="M 160 220 C 180 130, 260 100, 310 160 C 340 200, 330 360, 320 520 L 160 520 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="4"/>
    
    <!-- Victim Head with Choking Sign (Hands Grasping Neck) -->
    <circle cx="280" cy="90" r="45" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <!-- Hands Clutched at Throat (Universal Choking Sign) -->
    <path d="M 260 120 C 250 145, 290 155, 305 130" stroke="#f43f5e" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Rescuer Positioned Directly Behind Victim -->
    <path d="M 50 190 C 70 90, 180 90, 190 190 L 190 520 L 50 520 Z" 
          fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="115" cy="85" r="42" fill="#1e293b" stroke="#475569" stroke-width="3"/>

    <!-- Rescuer Arms Wrapping Around Victim Abdomen -->
    <path d="M 90 240 C 120 330, 190 360, 260 340" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
    <path d="M 90 240 C 120 330, 190 360, 260 340" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round"/>

    <!-- Rescuer Clenched Fist Placed Midway between Umbilicus and Xiphoid -->
    <circle cx="280" cy="340" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <!-- Other Hand Grasping the Fist -->
    <circle cx="305" cy="335" r="20" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>

    <!-- Dynamic Upward & Inward Force Vectors -->
    <g transform="translate(320, 280)">
      <path d="M 60 80 C 25 50, -15 25, -10 -20" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
      <polygon points="-10,-25 -22,-9 0,-11" fill="#f43f5e"/>
      <text x="50" y="0" fill="#f43f5e" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Upward &amp; Inward</text>
      <text x="50" y="24" fill="#f43f5e" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Abdominal Thrusts</text>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>