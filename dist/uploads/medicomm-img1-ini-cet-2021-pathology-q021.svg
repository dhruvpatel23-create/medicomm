<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">LUNG BIOPSY: INTERSTITIAL HISTOPATHOLOGY</text>
  </g>

  <!-- Histology Field -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="-372" y="-232" width="744" height="464" rx="16" fill="url(#fieldGrad)"/>

    <g clip-path="url(#lungClip)">
      <clipPath id="lungClip">
        <rect x="-372" y="-232" width="744" height="464" rx="16"/>
      </clipPath>

      <!-- Alveolar Septa & Interstitial Fibrosis (Wavy pink collagen bundles) -->
      <path d="M -380,-100 C -260,-40 -200,-160 -100,-120 C 0,-80 80,-180 200,-150 C 300,-120 340,-60 380,-40 L 380,240 L -380,240 Z"
            fill="#f472b6" opacity="0.45"/>
      <path d="M -380,80 C -250,50 -100,120 40,80 C 180,40 260,120 380,90"
            stroke="#db2777" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.6"/>

      <!-- Emphysematous dilated alveolar air spaces -->
      <ellipse cx="-240" cy="-140" rx="70" ry="45" fill="#ffffff" opacity="0.8"/>
      <ellipse cx="220" cy="-60" rx="90" ry="65" fill="#ffffff" opacity="0.8"/>

      <!-- Anthracotic Carbon Pigment Granules (black clumps) -->
      <g fill="#18181b">
        <circle cx="-160" cy="40" r="3"/>
        <circle cx="-154" cy="45" r="2.5"/>
        <circle cx="-162" cy="50" r="3.5"/>
        <circle cx="120" cy="110" r="4"/>
        <circle cx="128" cy="105" r="3"/>
        <circle cx="132" cy="116" r="3.5"/>
      </g>

      <!-- Asbestos / Ferruginous Bodies (Golden-brown beaded dumbbell rods) -->
      <!-- Central prominent Asbestos Body 1 -->
      <g transform="translate(-40, 20) rotate(42)">
        <!-- Thin translucent central core fiber -->
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#78350f" stroke-width="2"/>
        <!-- Segmented golden-brown iron-protein coating beads -->
        <circle cx="-60" cy="0" r="9" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="-35" cy="0" rx="8" ry="6" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="-12" cy="0" rx="7" ry="5.5" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="12" cy="0" rx="7" ry="5.5" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="35" cy="0" rx="8" ry="6" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
        <circle cx="60" cy="0" r="9" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
      </g>

      <!-- Secondary Asbestos Body 2 (upper left) -->
      <g transform="translate(-140, -100) rotate(-25)">
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#78350f" stroke-width="1.5"/>
        <circle cx="-42" cy="0" r="7" fill="#b45309"/>
        <circle cx="-20" cy="0" r="5" fill="#d97706"/>
        <circle cx="0" cy="0" r="5" fill="#d97706"/>
        <circle cx="20" cy="0" r="5" fill="#d97706"/>
        <circle cx="42" cy="0" r="7" fill="#b45309"/>
      </g>
    </g>

    <!-- Marker Arrow targeting Asbestos Body -->
    <g transform="translate(140, -40)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing directly to dumbbell body -->
      <line x1="-16" y1="6" x2="-100" y2="40" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="-110,44 -96,35 -99,48" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>