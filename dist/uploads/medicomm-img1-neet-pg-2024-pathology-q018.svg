<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-340" y="-24" width="680" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">URINE PROTEIN ELECTROPHORESIS (UPEP): DENSITOMETRY CURVE</text>
  </g>
  <g transform="translate(170, 150)">
    <line x1="0" y1="360" x2="640" y2="360" stroke="#94a3b8" stroke-width="3.5"/>
    
    <!-- Zone Dividers and Large Bold Labels -->
    <g font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#f8fafc">
      <rect x="25" y="375" width="80" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="65" y="396" text-anchor="middle">Albumin</text>

      <rect x="145" y="375" width="50" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="170" y="396" text-anchor="middle">α1</text>

      <rect x="225" y="375" width="50" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="250" y="396" text-anchor="middle">α2</text>

      <rect x="315" y="375" width="50" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="340" y="396" text-anchor="middle">β</text>

      <rect x="440" y="372" width="130" height="38" rx="19" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="505" y="396" text-anchor="middle" font-size="18">γ (Gamma)</text>
    </g>

    <!-- Densitometry Curve -->
    <path d="
      M 0,360
      C 30,360 40,240 65,240
      C 85,240 95,350 125,350
      C 150,350 160,335 170,335
      C 180,335 200,355 220,355
      C 235,355 245,330 255,330
      C 265,330 280,355 310,355
      C 330,355 340,325 350,325
      C 365,325 380,355 420,355
      C 470,355 485,15 505,15
      C 525,15 540,355 580,355
      L 640,360
    " fill="none" stroke="#38bdf8" stroke-width="4.5"/>

    <path d="M 465,355 C 485,355 490,15 505,15 C 520,15 535,355 555,355 Z" fill="#38bdf8" opacity="0.35"/>

    <!-- Gel Strip Graphic below -->
    <g transform="translate(0, 425)">
      <rect x="0" y="0" width="640" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <rect x="52" y="4" width="26" height="26" rx="3" fill="#38bdf8" opacity="0.5"/>
      <rect x="496" y="3" width="18" height="28" rx="3" fill="#38bdf8"/>
    </g>
  </g>
  
  <g transform="translate(740, 210)">
    <rect x="-115" y="-26" width="230" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Monoclonal M-Spike</text>
    <path d="M -103,0 L -160,-25" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-160" cy="-25" r="6" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>