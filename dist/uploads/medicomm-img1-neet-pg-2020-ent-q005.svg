<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 80)">
    <!-- Head / Cranial Contour (Lateral-Posterior Aspect) -->
    <path d="M 120 180 C 120 70, 240 20, 420 50 C 560 70, 640 180, 620 380 C 600 520, 520 660, 450 720 L 260 720 C 230 650, 180 500, 180 400 Z" 
          fill="#1e293b" stroke="#334155" stroke-width="4"/>
          
    <!-- Occipital & Scalp Hairline -->
    <path d="M 420 50 C 480 50, 580 90, 610 180 C 620 220, 590 320, 560 380 C 520 480, 480 620, 450 720" 
          fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>

    <!-- Ear Pinna (Anatomical Landmarks) -->
    <!-- Helix & Antihelix -->
    <path d="M 280 200 C 230 110, 410 100, 420 240 C 430 350, 390 440, 340 460 C 300 480, 280 430, 290 380 C 300 320, 280 250, 280 200 Z" 
          fill="#334155" stroke="#475569" stroke-width="5"/>
    <path d="M 330 220 C 310 170, 380 170, 375 250 C 370 320, 350 380, 330 400" 
          fill="none" stroke="#1e293b" stroke-width="4"/>
    <!-- Tragus & Concha Bowl -->
    <path d="M 290 280 C 270 300, 290 340, 310 330" fill="none" stroke="#1e293b" stroke-width="4"/>
    <ellipse cx="320" cy="310" rx="20" ry="28" fill="#0f172a"/>
    <!-- Ear Lobule -->
    <path d="M 340 450 C 330 500, 290 490, 295 440" fill="#334155" stroke="#475569" stroke-width="4"/>

    <!-- Mastoid Process Region: Characteristic Post-Traumatic Ecchymosis -->
    <!-- Diffuse Subcutaneous Hemorrhage / Bruising Pattern -->
    <g transform="translate(370, 380)">
      <ellipse cx="60" cy="40" rx="75" ry="60" fill="#4c0519" opacity="0.85"/>
      <ellipse cx="50" cy="35" rx="55" ry="45" fill="#581c87" opacity="0.75"/>
      <ellipse cx="65" cy="45" rx="40" ry="32" fill="#1e1b4b" opacity="0.85"/>
      <circle cx="55" cy="30" r="18" fill="#831843" opacity="0.6"/>
      <circle cx="75" cy="55" r="15" fill="#701a75" opacity="0.6"/>
      <circle cx="35" cy="50" r="14" fill="#3b0764" opacity="0.7"/>
    </g>

    <!-- Precise Gold Pointer to Retroauricular Mastoid Ecchymosis -->
    <g transform="translate(560, 380)">
      <line x1="120" y1="-40" x2="20" y2="20" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>