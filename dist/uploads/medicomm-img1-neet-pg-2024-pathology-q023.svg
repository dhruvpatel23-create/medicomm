<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="mriBrain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="80%" stop-color="#090d16"/><stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#mriBrain)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-340" y="-24" width="680" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">BRAIN MRI &amp; GROSS CYST: SUPRASELLAR REGION</text>
  </g>
  <g transform="translate(360, 360)">
    <ellipse cx="0" cy="0" rx="220" ry="240" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <path d="M -40,-80 C 20,-110 80,-40 20,-20 C -20,-10 -60,-40 -40,-80 Z" fill="#020617"/>
    <!-- Suprasellar Cystic Mass with Rim Calcification -->
    <circle cx="-10" cy="20" r="55" fill="#38bdf8" opacity="0.3"/>
    <circle cx="-10" cy="20" r="55" fill="none" stroke="#f8fafc" stroke-width="4" stroke-dasharray="8 4"/>
    <rect x="-85" y="6" width="150" height="30" rx="15" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-10" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#f8fafc">Suprasellar Mass</text>
  </g>
  <!-- Inset: Characteristic "Motor Oil" Brown Fluid Vial -->
  <g transform="translate(740, 360)">
    <rect x="-48" y="-130" width="96" height="260" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <path d="M -45,-10 L 45,-10 L 45,115 C 45,124 -45,124 -45,115 Z" fill="#451a03" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="45" ry="12" fill="#78350f"/>
    <rect x="-18" y="20" width="14" height="10" fill="#fef08a" opacity="0.9" transform="rotate(15 -11 25)"/>
    <rect x="12" y="55" width="16" height="9" fill="#fef08a" opacity="0.9" transform="rotate(-25 20 59)"/>
    
    <rect x="-110" y="145" width="220" height="36" rx="18" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="168" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#fde68a">"Motor Oil" Cyst Fluid</text>
  </g>
  
  <g transform="translate(180, 240)">
    <rect x="-105" y="-26" width="210" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Suprasellar Cyst</text>
    <path d="M 93,0 L 260,110" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="260" cy="110" r="6" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>