<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">ENDOMYOCARDIAL BIOPSY: RHEUMATIC CARDITIS</text>
  </g>

  <!-- Histology Field -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="-372" y="-232" width="744" height="464" rx="16" fill="url(#fieldGrad)"/>

    <g clip-path="url(#cardiacClip)">
      <clipPath id="cardiacClip">
        <rect x="-372" y="-232" width="744" height="464" rx="16"/>
      </clipPath>

      <!-- Cardiac Myocyte fibers running longitudinally -->
      <g transform="translate(-365, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(-280, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(-195, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(-110, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(-25, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(60, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(145, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(230, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g><g transform="translate(315, 0)">
          <rect x="0" y="-235" width="65" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <ellipse cx="32" cy="-120" rx="9" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="50" rx="10" ry="5.5" fill="#4c1d95"/>
          <ellipse cx="32" cy="190" rx="9" ry="5" fill="#4c1d95"/>
        </g>

      <!-- Focal Interstitial Aschoff Nodule -->
      <g transform="translate(80, 0)">
        <!-- Eosinophilic fibrinoid necrosis center -->
        <ellipse cx="0" cy="0" rx="95" ry="170" fill="#fb7185" opacity="0.8" stroke="#e11d48" stroke-width="2.5"/>

        <!-- Anitschkow cells (caterpillar nuclear pattern) -->
        <g transform="translate(-25, -60)">
          <ellipse cx="0" cy="0" rx="24" ry="15" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
          <path d="M -14,0 Q -7,-6 0,0 T 14,0" stroke="#581c87" stroke-width="3.5" fill="none"/>
        </g>
        <g transform="translate(25, -15)">
          <ellipse cx="0" cy="0" rx="26" ry="16" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
          <path d="M -15,0 Q -7,-6 0,0 T 15,0" stroke="#581c87" stroke-width="4" fill="none"/>
        </g>
        <g transform="translate(-20, 45)">
          <ellipse cx="0" cy="0" rx="24" ry="15" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
          <path d="M -14,0 Q -7,-5 0,0 T 14,0" stroke="#581c87" stroke-width="3.5" fill="none"/>
        </g>

        <!-- Aschoff Giant Cell (Multinucleated) -->
        <g transform="translate(10, 105)">
          <ellipse cx="0" cy="0" rx="36" ry="22" fill="#f472b6" stroke="#9d174d" stroke-width="2"/>
          <circle cx="-16" cy="-4" r="5" fill="#4c1d95"/>
          <circle cx="-6" cy="4" r="5.5" fill="#4c1d95"/>
          <circle cx="8" cy="-3" r="5" fill="#4c1d95"/>
          <circle cx="20" cy="3" r="5" fill="#4c1d95"/>
        </g>
      </g>
    </g>

    <!-- Marker Arrow to Aschoff Nodule -->
    <g transform="translate(-100, 0)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <line x1="18" y1="0" x2="110" y2="0" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="122,0 108,-6 108,6" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>