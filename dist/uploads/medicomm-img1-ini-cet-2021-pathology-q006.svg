<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Glass tube body gradient -->
    <linearGradient id="tubeGlassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#f8fafc" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#cbd5e1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Red rubber hemogard stopper gradient -->
    <linearGradient id="redStopperGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">PHLEBOTOMY SPECIMEN COLLECTION TUBE</text>
  </g>

  <!-- Angled Vacutainer Tube (diagonal orientation ~38 deg) -->
  <g transform="translate(480, 360) rotate(-35)" filter="url(#shadow)">
    <!-- Glass Tube Main Body -->
    <g>
      <!-- Bottom hemispherical rounded tip -->
      <path d="M -30,220 C -30,255 30,255 30,220 Z" fill="url(#tubeGlassGrad)" stroke="#64748b" stroke-width="2"/>
      <!-- Main cylinder body -->
      <rect x="-30" y="-140" width="60" height="360" fill="url(#tubeGlassGrad)" stroke="#64748b" stroke-width="2"/>
      
      <!-- Inner silica particles coating (microscopic white specks) -->
      <g fill="#ffffff" opacity="0.6">
        <circle cx="-22" cy="60" r="1.5"/><circle cx="-15" cy="71" r="1.5"/><circle cx="-8" cy="82" r="1.5"/><circle cx="-1" cy="93" r="1.5"/><circle cx="6" cy="104" r="1.5"/><circle cx="13" cy="115" r="1.5"/><circle cx="20" cy="126" r="1.5"/><circle cx="-18" cy="137" r="1.5"/><circle cx="-11" cy="148" r="1.5"/><circle cx="-4" cy="159" r="1.5"/><circle cx="3" cy="170" r="1.5"/><circle cx="10" cy="181" r="1.5"/><circle cx="17" cy="192" r="1.5"/><circle cx="-21" cy="203" r="1.5"/><circle cx="-14" cy="64" r="1.5"/><circle cx="-7" cy="75" r="1.5"/><circle cx="0" cy="86" r="1.5"/><circle cx="7" cy="97" r="1.5"/><circle cx="14" cy="108" r="1.5"/><circle cx="21" cy="119" r="1.5"/><circle cx="-17" cy="130" r="1.5"/><circle cx="-10" cy="141" r="1.5"/><circle cx="-3" cy="152" r="1.5"/><circle cx="4" cy="163" r="1.5"/><circle cx="11" cy="174" r="1.5"/><circle cx="18" cy="185" r="1.5"/><circle cx="-20" cy="196" r="1.5"/><circle cx="-13" cy="207" r="1.5"/><circle cx="-6" cy="68" r="1.5"/><circle cx="1" cy="79" r="1.5"/>
      </g>

      <!-- Paper Label on Tube -->
      <g transform="translate(0, 0)">
        <rect x="-29" y="-110" width="58" height="180" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <!-- Red band at top of label -->
        <rect x="-29" y="-110" width="58" height="18" fill="#dc2626"/>
        <text x="0" y="-97" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff" letter-spacing="1">SERUM</text>
        
        <!-- Barcode / patient info placeholder lines -->
        <line x1="-22" y1="-80" x2="22" y2="-80" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="-22" y1="-65" x2="22" y2="-65" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="-22" y1="-50" x2="22" y2="-50" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="-22" y1="-35" x2="22" y2="-35" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="-22" y1="-20" x2="22" y2="-20" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Fill volume arrow line -->
        <line x1="20" y1="20" x2="20" y2="60" stroke="#000000" stroke-width="2"/>
        <polygon points="20,12 16,22 24,22" fill="#000000"/>
      </g>

      <!-- Tube Collar / Ring -->
      <rect x="-33" y="-150" width="66" height="12" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Red Hemogard Stopper / Cap -->
      <path d="M -32,-150 L -32,-215 C -32,-225 32,-225 32,-215 L 32,-150 Z" fill="url(#redStopperGrad)" stroke="#991b1b" stroke-width="2"/>
      <!-- Stopper grip ridges -->
      <line x1="-20" y1="-210" x2="-20" y2="-155" stroke="#b91c1c" stroke-width="2.5"/>
      <line x1="-7" y1="-212" x2="-7" y2="-155" stroke="#b91c1c" stroke-width="2.5"/>
      <line x1="7" y1="-212" x2="7" y2="-155" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="20" y1="-210" x2="20" y2="-155" stroke="#ef4444" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Specimen Callout Indicator -->
  <g transform="translate(680, 200)">
    <circle cx="0" cy="0" r="14" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff">!</text>
    <rect x="25" y="-18" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">RED STOPPER TUBE</text>
    <!-- Pointer line -->
    <path d="M -16,8 L -110,60" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 2"/>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>