<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#000000"/>
  
  <defs>
    <!-- Axis arrow marker -->
    <marker id="axis-arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38b2ac" />
    </marker>
  </defs>

  <!-- ================= PANEL 1 (NON-COMPETITIVE) ================= -->
  <g transform="translate(0, 40)">
    <!-- Axes: X-axis at y=420, Y-axis at x=450 -->
    <line x1="160" y1="420" x2="1040" y2="420" stroke="#38b2ac" stroke-width="3" marker-end="url(#axis-arr)"/>
    <line x1="450" y1="460" x2="450" y2="100" stroke="#38b2ac" stroke-width="3" marker-end="url(#axis-arr)"/>
    
    <!-- Ticks on X axis -->
    <line x1="230" y1="414" x2="230" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="340" y1="414" x2="340" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="560" y1="414" x2="560" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="670" y1="414" x2="670" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="780" y1="414" x2="780" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="890" y1="414" x2="890" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="1000" y1="414" x2="1000" y2="426" stroke="#38b2ac" stroke-width="2"/>

    <!-- Ticks on Y axis -->
    <line x1="444" y1="360" x2="456" y2="360" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="300" x2="456" y2="300" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="240" x2="456" y2="240" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="180" x2="456" y2="180" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="120" x2="456" y2="120" stroke="#38b2ac" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="400" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="end">1</text>
    <line x1="380" y1="172" x2="420" y2="172" stroke="#ffffff" stroke-width="2"/>
    <text x="400" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="end">V<tspan dy="5" font-size="18">0</tspan></text>

    <text x="600" y="470" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">1</text>
    <line x1="585" y1="480" x2="615" y2="480" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="508" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">[S]</text>

    <!-- Non-competitive: Identical X-intercept at x=230, y=420 -->
    <!-- Blue line (without inhibitor): passes through (230, 420) and (450, 360) -> slope = -60/220 = -0.2727 -->
    <!-- Extends to x=1010, y = 360 - 0.2727*(1010-450) = 360 - 152.7 = 207 -->
    <line x1="230" y1="420" x2="1010" y2="207" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Red line (with inhibitor): passes through (230, 420) and (450, 280) -> slope = -140/220 = -0.6363 -->
    <!-- Extends to x=850, y = 280 - 0.6363*(850-450) = 280 - 254.5 = 25 -->
    <line x1="230" y1="420" x2="850" y2="100" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Badge 1 -->
    <circle cx="600" cy="545" r="22" fill="#00838f" stroke="#4dd0e1" stroke-width="2"/>
    <text x="600" y="553" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- ================= PANEL 2 (COMPETITIVE) ================= -->
  <g transform="translate(0, 600)">
    <!-- Axes: X-axis at y=420, Y-axis at x=450 -->
    <line x1="160" y1="420" x2="1040" y2="420" stroke="#38b2ac" stroke-width="3" marker-end="url(#axis-arr)"/>
    <line x1="450" y1="460" x2="450" y2="100" stroke="#38b2ac" stroke-width="3" marker-end="url(#axis-arr)"/>
    
    <!-- Ticks on X axis -->
    <line x1="230" y1="414" x2="230" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="340" y1="414" x2="340" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="560" y1="414" x2="560" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="670" y1="414" x2="670" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="780" y1="414" x2="780" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="890" y1="414" x2="890" y2="426" stroke="#38b2ac" stroke-width="2"/>
    <line x1="1000" y1="414" x2="1000" y2="426" stroke="#38b2ac" stroke-width="2"/>

    <!-- Ticks on Y axis -->
    <line x1="444" y1="360" x2="456" y2="360" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="300" x2="456" y2="300" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="240" x2="456" y2="240" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="180" x2="456" y2="180" stroke="#38b2ac" stroke-width="2"/>
    <line x1="444" y1="120" x2="456" y2="120" stroke="#38b2ac" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="400" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="end">1</text>
    <line x1="380" y1="172" x2="420" y2="172" stroke="#ffffff" stroke-width="2"/>
    <text x="400" y="200" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="end">V<tspan dy="5" font-size="18">0</tspan></text>

    <text x="600" y="470" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">1</text>
    <line x1="585" y1="480" x2="615" y2="480" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="508" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">[S]</text>

    <!-- Competitive: Identical Y-intercept at x=450, y=360 -->
    <!-- Blue line (without inhibitor): passes through (230, 420) and (450, 360) -> slope = -0.2727 -->
    <line x1="230" y1="420" x2="1010" y2="207" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Red line (with inhibitor): passes through (340, 420) and (450, 360) -> slope = -60/110 = -0.5454 -->
    <!-- Extends to x=870, y = 360 - 0.5454*(870-450) = 360 - 229 = 131 -->
    <line x1="340" y1="420" x2="870" y2="131" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Badge 2 -->
    <circle cx="600" cy="545" r="22" fill="#00838f" stroke="#4dd0e1" stroke-width="2"/>
    <text x="600" y="553" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">2</text>
  </g>

  <!-- Watermark -->
  <text x="40" y="1170" fill="#718096" font-family="Arial, sans-serif" font-size="24" font-weight="normal">medicomm</text>
</svg>