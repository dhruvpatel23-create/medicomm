<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">IMMUNOLOGICAL TOXIN MECHANISM</text>
  <text x="500" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Superantigen Cross-Linking of MHC Class II and T-Cell Receptor</text>

  <!-- Comparison: Left = Conventional Antigen, Right = Superantigen -->
  <!-- Left Side: Conventional Antigen Presentation (Specific 0.001%) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="410" height="740" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <text x="205" y="40" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">CONVENTIONAL ANTIGEN</text>
    <text x="205" y="65" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Specific Activation (~0.001% T-cells)</text>

    <!-- Top: APC Membrane -->
    <rect x="30" y="100" width="350" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="205" y="125" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">ANTIGEN-PRESENTING CELL (APC)</text>

    <!-- MHC Class II Molecule -->
    <g transform="translate(130, 140)">
      <rect x="0" y="0" width="60" height="90" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="30" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">&#945;</text>
      
      <rect x="90" y="0" width="60" height="90" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="120" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">&#946;</text>
      
      <!-- Antigen Peptide in Central Groove -->
      <rect x="50" y="25" width="50" height="25" rx="5" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
      <text x="75" y="42" text-anchor="middle" fill="#422006" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">PEPTIDE</text>
    </g>

    <!-- TCR (T-Cell Receptor) -->
    <g transform="translate(130, 270)">
      <rect x="0" y="0" width="60" height="90" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
      <text x="30" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">V&#945;</text>
      
      <rect x="90" y="0" width="60" height="90" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
      <text x="120" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">V&#946;</text>
    </g>

    <!-- Bottom: T-Cell Membrane -->
    <rect x="30" y="380" width="350" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="205" y="405" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">HELPER T-CELL (CD4+)</text>

    <!-- Description -->
    <rect x="30" y="470" width="350" height="230" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="205" y="510" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Normal Immune Response</text>
    <text x="45" y="545" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Requires intracellular processing</text>
    <text x="45" y="575" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Peptide fits within MHC peptide groove</text>
    <text x="45" y="605" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Contact with both CDR3 &#945; and &#946; chains</text>
    <text x="45" y="635" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Strict clonal specificity</text>
    <text x="45" y="665" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Regulated, physiological cytokine release</text>
  </g>

  <!-- Right Side: Superantigen Presentation (Polyclonal 20-30%) -->
  <g transform="translate(530, 130)">
    <rect x="0" y="0" width="410" height="740" rx="14" fill="#090d16" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="40" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">SUPERANTIGEN BINDING</text>
    <text x="205" y="65" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Massive Polyclonal Activation (20&#8211;30% T-cells)</text>

    <!-- Top: APC Membrane -->
    <rect x="30" y="100" width="350" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="205" y="125" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">ANTIGEN-PRESENTING CELL (APC)</text>

    <!-- MHC Class II Molecule -->
    <g transform="translate(130, 140)">
      <rect x="0" y="0" width="60" height="90" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="30" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">&#945;</text>
      
      <rect x="90" y="0" width="60" height="90" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="120" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">&#946;</text>
    </g>

    <!-- SUPERANTIGEN Molecule Binding OUTSIDE Groove -->
    <g transform="translate(270, 205)" filter="url(#glow)">
      <polygon points="0,-25 35,-5 22,30 -22,30 -35,-5" fill="#dc2626" stroke="#fca5a5" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900">SUPER-</text>
      <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900">ANTIGEN</text>
    </g>

    <!-- Pointers showing direct cross-link outside groove -->
    <path d="M 270 215 L 245 190" stroke="#f87171" stroke-width="3" stroke-dasharray="4 2"/>
    <path d="M 270 240 L 245 285" stroke="#f87171" stroke-width="3" stroke-dasharray="4 2"/>

    <!-- TCR (T-Cell Receptor) -->
    <g transform="translate(130, 270)">
      <rect x="0" y="0" width="60" height="90" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
      <text x="30" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">V&#945;</text>
      
      <rect x="90" y="0" width="60" height="90" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
      <text x="120" y="50" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">V&#946;</text>
    </g>

    <!-- Bottom: T-Cell Membrane -->
    <rect x="30" y="380" width="350" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="205" y="405" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">HELPER T-CELL (CD4+)</text>

    <!-- Superantigen Pathology Description -->
    <rect x="30" y="470" width="350" height="230" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
    <text x="205" y="510" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">CYTOKINE STORM CASCADE</text>
    <text x="45" y="545" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; <tspan font-weight="700">NO</tspan> antigen processing required</text>
    <text x="45" y="575" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Binds <tspan font-weight="700">outside</tspan> the peptide-binding cleft</text>
    <text x="45" y="605" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Direct bridge: MHC-II &#946; &#8596; TCR V&#946; region</text>
    <text x="45" y="635" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Massive secretion of <tspan font-weight="700">IL-1, IL-2, TNF-&#945;, IFN-&#947;</tspan></text>
    <text x="45" y="665" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Clinical syndrome: <tspan font-weight="700">Toxic Shock Syndrome</tspan></text>
  </g>

  <!-- Subtle medulla watermark -->
  
</svg>