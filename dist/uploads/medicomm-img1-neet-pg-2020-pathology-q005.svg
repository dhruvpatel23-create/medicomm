<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Myxoid Stroma Pale Bluish-Pink Field -->
    <radialGradient id="myxoidField" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="45%" stop-color="#e0e7ff"/>
      <stop offset="80%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </radialGradient>

    <!-- Chicken-wire capillary vascular color -->
    <linearGradient id="capillaryRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Lipoblast lipid droplet clear/creamy gradient -->
    <radialGradient id="lipidDrop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Nuclei purple gradient -->
    <linearGradient id="nucGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-310" y="-20" width="620" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">MYXOID LIPOSARCOMA HISTOPATHOLOGY [t(12;16)]</text>
  </g>

  <!-- Circular Microscopy Field (Center: 480, 310, r: 230) -->
  <g transform="translate(480, 310)" filter="url(#shadowBox)">
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#myxoidField)"/>

    <g clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Pale Bluish-Lavender Myxoid Ground Substance Wisps -->
      <g stroke="#c7d2fe" stroke-width="3" opacity="0.4" fill="none">
        <path d="M -230,-120 C -100,-80 50,-150 230,-100"/>
        <path d="M -230,-40 C -80,-10 80,-70 230,-20"/>
        <path d="M -230,60 C -120,40 20,90 230,50"/>
        <path d="M -230,140 C -70,110 90,160 230,120"/>
      </g>

      <!-- PLEXIFORM "CHICKEN-WIRE" / "CROW'S-FEET" CAPILLARY NETWORK -->
      <!-- Delicate, branching, anastomosing thin-walled capillary arcades -->
      <g stroke="url(#capillaryRed)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Main arcade 1 -->
        <path d="M -180,-160 L -120,-110 L -60,-130 L 10,-80 L 80,-120 L 150,-90 L 210,-130"/>
        <!-- Branching cross-links -->
        <path d="M -120,-110 L -140,-40 L -90,10 L -40,-10 L 10,-80"/>
        <path d="M -60,-130 L -40,-10"/>
        <path d="M 80,-120 L 60,-50 L 120,-10 L 150,-90"/>
        
        <!-- Arcade 2: Mid-level plexiform connections -->
        <path d="M -210,-30 L -140,-40"/>
        <path d="M -90,10 L -110,80 L -50,110 L 10,70 L 60,-50"/>
        <path d="M -40,-10 L 10,70"/>
        <path d="M 120,-10 L 170,40 L 120,90 L 50,130 L 10,70"/>
        <path d="M 170,40 L 220,20"/>
        
        <!-- Arcade 3: Lower network -->
        <path d="M -180,120 L -110,80"/>
        <path d="M -50,110 L -70,180 L 0,160 L 50,130"/>
        <path d="M 0,160 L 30,220"/>
        <path d="M 120,90 L 160,160 L 210,130"/>
      </g>

      <!-- Intraluminal Erythrocytes inside Chicken-Wire Capillaries -->
      <g fill="#dc2626">
        <circle cx="-150" cy="-135" r="3"/><circle cx="-90" cy="-120" r="3"/><circle cx="-25" cy="-105" r="3.2"/>
        <circle cx="45" cy="-100" r="3"/><circle cx="115" cy="-105" r="3"/><circle cx="180" cy="-110" r="3"/>
        <circle cx="-115" cy="-15" r="3"/><circle cx="-65" cy="0" r="3.2"/><circle cx="35" cy="-65" r="3"/>
        <circle cx="90" cy="-30" r="3.2"/><circle cx="145" cy="15" r="3"/><circle cx="195" cy="30" r="3"/>
        <circle cx="-80" cy="95" r="3"/><circle cx="-20" cy="90" r="3.2"/><circle cx="30" cy="100" r="3"/>
        <circle cx="85" cy="110" r="3.2"/><circle cx="140" cy="125" r="3"/><circle cx="-35" cy="170" r="3"/>
      </g>

      <!-- Primitive Stellate & Spindle Mesenchymal Stromal Cells -->
      <g fill="url(#nucGrad)" stroke="#312e81" stroke-width="0.8">
        <!-- Spindle cells -->
        <ellipse cx="-160" cy="-70" rx="9" ry="3.5" transform="rotate(25 -160 -70)"/>
        <ellipse cx="-110" cy="-160" rx="8" ry="3.5" transform="rotate(-30 -110 -160)"/>
        <ellipse cx="30" cy="-140" rx="9" ry="3.5" transform="rotate(15 30 -140)"/>
        <ellipse cx="140" cy="-40" rx="8" ry="3.5" transform="rotate(-40 140 -40)"/>
        <ellipse cx="-140" cy="60" rx="9" ry="3.5" transform="rotate(35 -140 60)"/>
        <ellipse cx="150" cy="100" rx="8" ry="3.5" transform="rotate(-20 150 100)"/>
        <ellipse cx="-80" cy="140" rx="9" ry="3.5" transform="rotate(10 -80 140)"/>
        
        <!-- Stellate cells with cytoplasmic processes -->
        <circle cx="-30" cy="-60" r="4.5"/>
        <circle cx="80" cy="20" r="4.5"/>
        <circle cx="-20" cy="30" r="4.5"/>
        <circle cx="90" cy="150" r="4.5"/>
      </g>

      <!-- ================= THE LIPOBLASTS (Hallmark Cells) ================= -->
      <!-- Lipoblast 1: Multivacuolar Lipoblast (Center: -10, -15) -->
      <g transform="translate(-10, -15)">
        <!-- Cytoplasm with scalloped margin -->
        <circle cx="0" cy="0" r="28" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
        
        <!-- Multiple Clear Lipid Droplets -->
        <circle cx="-10" cy="-8" r="9" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="1"/>
        <circle cx="8" cy="-10" r="8" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="1"/>
        <circle cx="-6" cy="10" r="9.5" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="1"/>
        <circle cx="10" cy="8" r="7" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="1"/>

        <!-- Centrally Scalloped / Indented Hyperchromatic Nucleus -->
        <path d="M 2,-2 C 5,-8 14,-6 14,2 C 14,10 6,12 2,6 C -2,6 -4,0 2,-2 Z" 
              fill="url(#nucGrad)" stroke="#1e1b4b" stroke-width="1.2"/>
      </g>

      <!-- Lipoblast 2: Classic Signet-Ring / Univacuolar Lipoblast (Lower-Right: 80, 50) -->
      <g transform="translate(80, 50)">
        <circle cx="0" cy="0" r="26" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
        
        <!-- Single Large Intracellular Lipid Droplet occupying cytoplasm -->
        <circle cx="-2" cy="1" r="18" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="1.2"/>

        <!-- Eccentric Crescent-Shaped Nucleus pushed against membrane -->
        <path d="M 12,-16 C 22,-8 24,8 14,18 C 19,10 19,-6 12,-16 Z" 
              fill="url(#nucGrad)" stroke="#1e1b4b" stroke-width="1.2"/>
      </g>

      <!-- Lipoblast 3: Multivacuolar Lipoblast (Upper-Left: -90, -70) -->
      <g transform="translate(-90, -70)">
        <circle cx="0" cy="0" r="24" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
        <circle cx="-7" cy="-6" r="7.5" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="0.9"/>
        <circle cx="7" cy="-7" r="7" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="0.9"/>
        <circle cx="0" cy="8" r="8" fill="url(#lipidDrop)" stroke="#f59e0b" stroke-width="0.9"/>
        <ellipse cx="1" cy="-1" rx="4" ry="5" fill="url(#nucGrad)" stroke="#1e1b4b" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: "Chicken-Wire" Capillary Network -->
  <g transform="translate(170, 160)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="20" y1="5" x2="250" y2="40" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#f87171">"CHICKEN-WIRE" CAPILLARIES</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Delicate branching plexiform network</text>
  </g>

  <!-- Callout 2: Diagnostic Lipoblast with Nuclear Scalloping -->
  <g transform="translate(790, 260)">
    <circle cx="0" cy="0" r="16" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">2</text>
    <line x1="-20" y1="5" x2="-230" y2="45" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="25" y="-5" text-anchor="start" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#c084fc">LIPOBLAST WITH SCALLOPED NUCLEUS</text>
    <text x="25" y="15" text-anchor="start" font-family="sans-serif" font-size="12" fill="#cbd5e1">Lipid vacuoles indenting hyperchromatic nucleus</text>
  </g>

  <!-- Callout 3: Pale Myxoid Ground Substance -->
  <g transform="translate(170, 390)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">3</text>
    <line x1="20" y1="-5" x2="210" y2="-40" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">MYXOID STROMA</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Hyaluronic acid-rich basophilic pool</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171">HISTOLOGIC HALLMARKS</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Triad:</tspan> 1. Myxoid matrix + 2. Chicken-wire vascularity +</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">3. Univacuolar/multivacuolar signet-ring lipoblasts.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Alcian Blue Stain:</tspan> Positively stains hyaluronic acid stroma.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#c084fc">GENETICS &amp; CLINICAL CORRELATION</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Pathognomonic Translocation:</tspan> <tspan font-weight="700" fill="#38bdf8">t(12;16)(q13;p11)</tspan></text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">results in oncogenic <tspan font-weight="700" fill="#f472b6">FUS-DDIT3</tspan> fusion gene transcript.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#4ade80">Location:</tspan> Deep soft tissues of extremity (thigh) &amp; retroperitoneum.</text>
  </g>

  <!-- Medulla Watermark -->
  
</svg>
