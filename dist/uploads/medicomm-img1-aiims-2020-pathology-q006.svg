<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Histology Field Vignette Clip & Gradient -->
    <linearGradient id="heFieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <!-- Giant cell cytoplasm -->
    <radialGradient id="giantCellGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#db2777" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Metal particle pattern -->
    <pattern id="metalFlakes" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 3,4 L 7,2 L 8,6 L 4,8 Z" fill="#18181b"/>
      <circle cx="14" cy="6" r="1.5" fill="#27272a"/>
      <path d="M 12,14 L 16,11 L 18,15 L 14,17 Z" fill="#09090b"/>
      <circle cx="6" cy="15" r="1.8" fill="#18181b"/>
    </pattern>

    <!-- Drop Shadow -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-290" y="-20" width="580" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">METALLOSIS: PERIPROSTHETIC HISTOPATHOLOGY</text>
  </g>

  <!-- Histopathology Microscopy Circular Field (Centered, x: 480, y: 310, r: 230) -->
  <g transform="translate(480, 310)" filter="url(#shadowBox)">
    <!-- Microscope Bezel / Rim -->
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#heFieldGrad)"/>

    <g clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Background Fibrous Stroma (Pink Collagen Bundles) -->
      <g stroke="#f9a8d4" stroke-width="6" stroke-linecap="round" opacity="0.45" fill="none">
        <path d="M -230,-150 C -120,-180 50,-120 230,-160"/>
        <path d="M -230,-100 C -140,-130 80,-80 230,-110"/>
        <path d="M -230,-50 C -100,-70 120,-30 230,-60"/>
        <path d="M -230,20 C -80,0 100,50 230,10"/>
        <path d="M -230,80 C -110,60 90,110 230,70"/>
        <path d="M -230,140 C -90,120 70,170 230,130"/>
        <path d="M -230,200 C -100,180 60,220 230,190"/>
      </g>

      <!-- Sheet of Macrophages / Histiocytes in background -->
      <g opacity="0.3" fill="#ec4899">
        <circle cx="-160" cy="-80" r="14"/><circle cx="-120" cy="-90" r="16"/>
        <circle cx="-140" cy="-50" r="15"/><circle cx="-80" cy="-60" r="14"/>
        <circle cx="120" cy="-90" r="15"/><circle cx="160" cy="-80" r="16"/>
        <circle cx="140" cy="-40" r="14"/><circle cx="90" cy="-30" r="15"/>
        <circle cx="-150" cy="110" r="15"/><circle cx="-120" cy="130" r="16"/>
        <circle cx="120" cy="110" r="15"/><circle cx="160" cy="120" r="16"/>
      </g>

      <!-- Heavy Black Metallic Wear Debris Deposits (Aggregates) -->
      <g fill="#09090b" stroke="#18181b" stroke-width="1">
        <!-- Cluster 1: Extracellular coarse metal chunks -->
        <path d="M -180,-30 Q -150,-45 -130,-25 Q -120,5 -145,15 Q -175,10 -180,-30 Z"/>
        <polygon points="-110,-10 -95,-25 -80,-15 -85,5 -105,8"/>
        <polygon points="-160,-70 -145,-80 -135,-65 -150,-55"/>

        <!-- Cluster 2: Central Right metallic deposit -->
        <path d="M 80,-20 Q 110,-40 140,-15 Q 155,10 130,25 Q 95,20 80,-20 Z"/>
        <polygon points="120,-60 135,-70 145,-55 130,-45"/>
        <polygon points="60,10 75,-5 85,15 70,25"/>

        <!-- Cluster 3: Lower left deposits -->
        <path d="M -110,130 Q -80,110 -60,135 Q -70,165 -100,160 Z"/>
        <polygon points="-40,140 -25,125 -15,145 -30,155"/>
      </g>

      <!-- Multinucleated Foreign Body Giant Cell #1 (Dominant Central Left) -->
      <g transform="translate(-40, -40)">
        <!-- Giant Cell Cytoplasm (Eosinophilic, irregular amoeboid border) -->
        <path d="M -70,-30 C -80,-70 -40,-90 10,-85 C 60,-80 85,-40 80,10 C 75,60 30,85 -20,80 C -60,75 -85,40 -70,-30 Z" fill="url(#giantCellGrad)" stroke="#9d174d" stroke-width="2"/>
        
        <!-- Multiple Nuclei scattered haphazardly in cytoplasm (Foreign Body type) -->
        <g fill="#4a044e" stroke="#3b0764" stroke-width="0.8">
          <ellipse cx="-45" cy="-40" rx="6" ry="9" transform="rotate(20 -45 -40)"/>
          <ellipse cx="-25" cy="-60" rx="6" ry="8" transform="rotate(-15 -25 -60)"/>
          <ellipse cx="5" cy="-65" rx="6" ry="9" transform="rotate(10 5 -65)"/>
          <ellipse cx="35" cy="-50" rx="5" ry="8" transform="rotate(40 35 -50)"/>
          <ellipse cx="55" cy="-20" rx="6" ry="9" transform="rotate(-25 55 -20)"/>
          <ellipse cx="50" cy="15" rx="6" ry="8" transform="rotate(15 50 15)"/>
          <ellipse cx="30" cy="45" rx="5" ry="8" transform="rotate(-30 30 45)"/>
          <ellipse cx="-5" cy="55" rx="6" ry="9" transform="rotate(5 -5 55)"/>
          <ellipse cx="-40" cy="40" rx="6" ry="8" transform="rotate(35 -40 40)"/>
          <ellipse cx="-55" cy="10" rx="5" ry="8" transform="rotate(-10 -55 10)"/>
          <!-- Central nuclei -->
          <ellipse cx="-15" cy="-25" rx="5" ry="7"/>
          <ellipse cx="15" cy="-20" rx="6" ry="8"/>
          <ellipse cx="10" cy="15" rx="5" ry="7"/>
        </g>

        <!-- Phagocytosed Fine Black Metallic Debris inside Giant Cell Cytoplasm -->
        <g fill="#09090b">
          <circle cx="-30" cy="-10" r="3"/><circle cx="-22" cy="-15" r="2.5"/><circle cx="-15" cy="-5" r="3.5"/>
          <circle cx="0" cy="-5" r="4"/><circle cx="10" cy="-35" r="3"/><circle cx="-5" cy="-45" r="2"/>
          <circle cx="25" cy="-5" r="3.5"/><circle cx="20" cy="25" r="4"/><circle cx="-10" cy="30" r="3"/>
          <polygon points="-35,-5 -28,-8 -26,-2 -33,2"/>
          <polygon points="5,5 12,2 15,9 7,11"/>
          <polygon points="-2,18 4,14 8,22 1,24"/>
        </g>
      </g>

      <!-- Multinucleated Giant Cell #2 (Lower Center Right) -->
      <g transform="translate(60, 90)">
        <path d="M -50,-20 C -60,-50 -20,-65 20,-60 C 60,-55 75,-20 70,20 C 65,55 20,70 -15,65 C -50,60 -65,25 -50,-20 Z" fill="url(#giantCellGrad)" stroke="#9d174d" stroke-width="2"/>
        <!-- Random Nuclei -->
        <g fill="#4a044e">
          <circle cx="-30" cy="-25" r="6"/><circle cx="-10" cy="-40" r="6"/>
          <circle cx="15" cy="-42" r="5.5"/><circle cx="40" cy="-25" r="6"/>
          <circle cx="48" cy="5" r="6"/><circle cx="35" cy="35" r="5.5"/>
          <circle cx="5" cy="45" r="6"/><circle cx="-25" cy="35" r="6"/>
          <circle cx="-38" cy="10" r="5"/>
        </g>
        <!-- Internal Black Metallic Particles -->
        <g fill="#09090b">
          <circle cx="5" cy="-10" r="4"/><circle cx="-10" cy="5" r="3"/><circle cx="15" cy="10" r="3.5"/>
          <polygon points="-8,-12 -2,-16 2,-10 -5,-7"/>
          <polygon points="8,5 16,1 18,8 10,11"/>
        </g>
      </g>

      <!-- Abundant fine metallic particle spray across stroma -->
      <g fill="#18181b" opacity="0.8">
        <circle cx="-60" cy="-140" r="1.5"/><circle cx="-45" cy="-155" r="2"/><circle cx="-30" cy="-135" r="1.8"/>
        <circle cx="50" cy="-150" r="2.2"/><circle cx="80" cy="-130" r="2"/><circle cx="110" cy="-145" r="1.5"/>
        <circle cx="-140" cy="60" r="2"/><circle cx="-120" cy="80" r="2.5"/><circle cx="-90" cy="70" r="2"/>
        <circle cx="130" cy="60" r="2.2"/><circle cx="150" cy="80" r="1.8"/><circle cx="100" cy="170" r="2"/>
      </g>
    </g>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: Multinucleated Foreign Body Giant Cell -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="16" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="20" y1="5" x2="220" y2="70" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#f472b6">FOREIGN BODY GIANT CELL</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Multinucleated with haphazard nuclei</text>
  </g>

  <!-- Callout 2: Intracellular & Extracellular Black Metallic Debris -->
  <g transform="translate(780, 220)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2</text>
    <line x1="-20" y1="5" x2="-200" y2="70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="25" y="-5" text-anchor="start" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">BLACK METALLIC DEBRIS</text>
    <text x="25" y="15" text-anchor="start" font-family="sans-serif" font-size="12" fill="#cbd5e1">Wear particles from prosthesis (Cobalt/Cr/Ti)</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="380" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">CLINICAL CORRELATION: METALLOSIS</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Etiology:</tspan> Metal-on-metal or loose joint prosthesis wear.</text>
    <text x="20" y="66" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Pathology:</tspan> Metal debris triggers histiocytic osteolysis,</text>
    <text x="32" y="84" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">synovial black discoloration, and implant loosening.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="380" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#ec4899">HISTOLOGIC DIFFERENTIATION</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Melanin / Melanoma:</tspan> Fontana-Masson (+), S100/HMB45 (+).</text>
    <text x="20" y="66" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Ochronosis:</tspan> Golden-brown pigment in cartilage (alkaptonuria).</text>
    <text x="20" y="86" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f472b6">Metallosis:</tspan> Insoluble opaque jet-black particles in histiocytes.</text>
  </g>

  <!-- Medulla Watermark -->
  
</svg>
