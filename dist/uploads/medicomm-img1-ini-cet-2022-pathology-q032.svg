<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">THYROID FNAC: CYTOMORPHOLOGICAL FEATURES</text>
  </g>

  <!-- Microscope Circular Field -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#fieldGrad)"/>

    <g clip-path="url(#thyroidClip)">
      <clipPath id="thyroidClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Papillary Fronds lined by neoplastic thyrocytes -->
      <!-- Prominent Papillary Cluster Center -->
      <g transform="translate(0, 0)">
        <path d="M -140,-80 C -80,-140 80,-140 140,-80 C 180,20 120,120 0,140 C -120,120 -180,20 -140,-80 Z"
              fill="#f472b6" opacity="0.6" stroke="#db2777" stroke-width="2"/>

        <!-- Classic "Orphan Annie Eye" Nuclei (Optically clear, empty-appearing ground-glass nuclei with peripheral condensed chromatin) -->
        <g transform="translate(-40, -30)">
          <ellipse cx="0" cy="0" rx="24" ry="18" fill="#ffffff" stroke="#581c87" stroke-width="2.5"/>
          <line x1="-14" y1="0" x2="14" y2="0" stroke="#7c3aed" stroke-width="1.5"/> <!-- Longitudinal nuclear groove / coffee-bean -->
        </g>
        <g transform="translate(35, -20)">
          <ellipse cx="0" cy="0" rx="26" ry="19" fill="#ffffff" stroke="#581c87" stroke-width="2.5"/>
          <circle cx="0" cy="0" r="6" fill="#fce7f3" stroke="#be185d"/> <!-- Nuclear pseudoinclusion -->
        </g>
        <g transform="translate(-10, 45)">
          <ellipse cx="0" cy="0" rx="28" ry="20" fill="#ffffff" stroke="#581c87" stroke-width="2.5"/>
          <line x1="-18" y1="2" x2="18" y2="-2" stroke="#7c3aed" stroke-width="1.5"/>
        </g>

        <!-- Psammoma Body (Concentric laminated calcific sphere) -->
        <g transform="translate(100, 50)">
          <circle cx="0" cy="0" r="22" fill="#581c87" opacity="0.85"/>
          <circle cx="0" cy="0" r="16" fill="none" stroke="#e9d5ff" stroke-width="2"/>
          <circle cx="0" cy="0" r="10" fill="none" stroke="#e9d5ff" stroke-width="2"/>
          <circle cx="0" cy="0" r="4" fill="#e9d5ff"/>
        </g>
      </g>
    </g>

    <!-- Marker Arrow to Orphan Annie Nuclei -->
    <g transform="translate(-140, -110)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <line x1="16" y1="12" x2="75" y2="60" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="85,66 72,58 77,48" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>