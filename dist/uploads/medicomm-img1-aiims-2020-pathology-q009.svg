<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glass tube lighting -->
    <linearGradient id="tubeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#e2e8f0" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Red Stopper Gradient -->
    <linearGradient id="redStopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="20%" stop-color="#dc2626"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Safety ring yellow/gold/red -->
    <linearGradient id="stopperRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Silica particles filter -->
    <pattern id="silicaDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#f8fafc" opacity="0.45"/>
      <circle cx="9" cy="8" r="0.75" fill="#38bdf8" opacity="0.35"/>
      <circle cx="6" cy="11" r="0.6" fill="#ffffff" opacity="0.4"/>
    </pattern>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="700" fill="#000000"/>
  <rect width="900" height="700" fill="url(#bgGrad)"/>

  <!-- Title / Context Badge -->
  <g transform="translate(450, 48)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" letter-spacing="1.5">VACUTAINER BLOOD COLLECTION TUBE</text>
  </g>

  <!-- Main Tube Illustration (Centered, Vertical with subtle angle) -->
  <g transform="translate(360, 100)" filter="url(#dropShadow)">
    <!-- Shadow beneath tube -->
    <ellipse cx="90" cy="510" rx="45" ry="14" fill="#020617" opacity="0.8"/>

    <!-- Plastic Tube Body (Base Layer) -->
    <!-- Outer tube body with rounded hemispherical bottom -->
    <path d="M 45,95 L 45,430 A 45,45 0 0,0 135,430 L 135,95 Z" fill="#0f172a" fill-opacity="0.6" stroke="#475569" stroke-width="2"/>

    <!-- Silica coating visualization on interior walls -->
    <path d="M 47,95 L 47,430 A 43,43 0 0,0 133,430 L 133,95 Z" fill="url(#silicaDots)"/>

    <!-- Glass/Plastic reflection layer -->
    <path d="M 46,95 L 46,430 A 44,44 0 0,0 134,430 L 134,95 Z" fill="url(#tubeGlass)"/>

    <!-- Specular highlight streak down left side -->
    <path d="M 52,98 L 52,430 A 38,38 0 0,0 68,460 L 68,98 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Tube Fill Line & Volume Marks -->
    <line x1="125" y1="200" x2="135" y2="200" stroke="#94a3b8" stroke-width="2"/>
    <text x="120" y="204" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8" font-weight="600">4.0 mL</text>
    
    <line x1="125" y1="260" x2="135" y2="260" stroke="#94a3b8" stroke-width="2"/>
    <text x="120" y="264" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8" font-weight="600">2.5 mL</text>

    <!-- Label on Tube -->
    <rect x="52" y="150" width="76" height="150" rx="4" fill="#f8fafc" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Label lines & details -->
    <rect x="56" y="155" width="68" height="10" fill="#ef4444" rx="2"/>
    <text x="90" y="163" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">CAT / CLOT ACTIVATOR</text>
    
    <line x1="56" y1="175" x2="124" y2="175" stroke="#94a3b8" stroke-width="1"/>
    <line x1="56" y1="190" x2="124" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <line x1="56" y1="205" x2="124" y2="205" stroke="#94a3b8" stroke-width="1"/>
    <line x1="56" y1="220" x2="124" y2="220" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Barcode graphic -->
    <g transform="translate(60, 235)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#0f172a" stroke-width="2"/>
      <line x1="4" y1="0" x2="4" y2="30" stroke="#0f172a" stroke-width="1"/>
      <line x1="8" y1="0" x2="8" y2="30" stroke="#0f172a" stroke-width="3"/>
      <line x1="14" y1="0" x2="14" y2="30" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="18" y1="0" x2="18" y2="30" stroke="#0f172a" stroke-width="2"/>
      <line x1="24" y1="0" x2="24" y2="30" stroke="#0f172a" stroke-width="3.5"/>
      <line x1="31" y1="0" x2="31" y2="30" stroke="#0f172a" stroke-width="1"/>
      <line x1="36" y1="0" x2="36" y2="30" stroke="#0f172a" stroke-width="2"/>
      <line x1="42" y1="0" x2="42" y2="30" stroke="#0f172a" stroke-width="3"/>
      <line x1="48" y1="0" x2="48" y2="30" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="54" y1="0" x2="54" y2="30" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="59" y1="0" x2="59" y2="30" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- Hemogard / Red Closure (Stopper + Shield) -->
    <!-- Lower collar -->
    <rect x="42" y="80" width="96" height="15" rx="3" fill="url(#stopperRing)" stroke="#78350f" stroke-width="1"/>
    
    <!-- Main Red Cap -->
    <path d="M 40,80 L 40,25 C 40,15 50,10 90,10 C 130,10 140,15 140,25 L 140,80 Z" fill="url(#redStopper)" stroke="#7f1d1d" stroke-width="1.5"/>
    
    <!-- Top indentation / rubber center -->
    <ellipse cx="90" cy="18" rx="26" ry="7" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
    <ellipse cx="90" cy="18" rx="14" ry="4" fill="#1c1917"/>

    <!-- Vertical gripping ridges on red cap -->
    <g opacity="0.3" stroke="#fecaca" stroke-width="1.5">
      <line x1="50" y1="28" x2="50" y2="76"/>
      <line x1="60" y1="25" x2="60" y2="78"/>
      <line x1="72" y1="23" x2="72" y2="79"/>
      <line x1="85" y1="22" x2="85" y2="80"/>
      <line x1="95" y1="22" x2="95" y2="80"/>
      <line x1="108" y1="23" x2="108" y2="79"/>
      <line x1="120" y1="25" x2="120" y2="78"/>
      <line x1="130" y1="28" x2="130" y2="76"/>
    </g>
  </g>

  <!-- Callouts and Educational Information -->
  <!-- Callout 1: Red Stopper -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="25" y1="0" x2="190" y2="-5" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="700" fill="#ef4444">RED TOP (PLASTIC)</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#94a3b8">Standard Serum Separator Closure</text>
  </g>

  <!-- Callout 2: Clot Activator Particles -->
  <g transform="translate(680, 360)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2</text>
    <line x1="-25" y1="0" x2="-180" y2="-10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="25" y="-8" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">SILICA COATING</text>
    <text x="25" y="12" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Clot Activator (CAT)</text>
    <text x="25" y="30" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#94a3b8">Induces rapid intrinsic clotting (30-60 min)</text>
  </g>

  <!-- Callout 3: Specimen & Uses Panel -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="310" height="120" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8">TUBE SPECIFICATIONS</text>
    <text x="20" y="54" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Additive: <tspan font-weight="700" fill="#f87171">Silica particles (Clot activator)</tspan></text>
    <text x="20" y="74" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Specimen: <tspan font-weight="700" fill="#facc15">Serum</tspan> (after centrifugation)</text>
    <text x="20" y="94" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Inversions: 5-8 gentle inversions</text>
  </g>

  <!-- Callout 4: Common Clinical Tests Panel -->
  <g transform="translate(510, 500)">
    <rect x="0" y="0" width="310" height="120" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8">KEY CLINICAL APPLICATIONS</text>
    <text x="20" y="54" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Clinical Chemistry panels (LFT, KFT, Lipids)</text>
    <text x="20" y="74" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Infectious Disease Serology (HIV, HBsAg, HCV)</text>
    <text x="20" y="94" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Blood Bank cross-matching &amp; antibody screen</text>
  </g>

  <!-- Medicomm Watermark -->
  <text x="32" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" opacity="0.35" letter-spacing="1">medicomm</text>
</svg>
