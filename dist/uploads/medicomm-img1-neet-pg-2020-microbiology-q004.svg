<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#000000"/>
  <rect width="960" height="720" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">DIMERIC IMMUNOGLOBULIN STRUCTURE</text>
  </g>

  <!-- Dimeric Antibody Complex (Centered at x=480, y=360) -->
  <g transform="translate(480, 350)" filter="url(#shadow)">

    <!-- Left Monomer (pointing left/up/down) -->
    <g transform="translate(-140, 0)">
      <!-- Fc Region (Horizontal stem towards center) -->
      <line x1="80" y1="-8" x2="-20" y2="-8" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <line x1="80" y1="8" x2="-20" y2="8" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Inter-chain Disulfide bridges on Fc -->
      <line x1="20" y1="-8" x2="20" y2="8" stroke="#fbbf24" stroke-width="3"/>
      <line x1="50" y1="-8" x2="50" y2="8" stroke="#fbbf24" stroke-width="3"/>

      <!-- Upper Fab Arm (Left-Up) -->
      <!-- Heavy Chain -->
      <line x1="-20" y1="-8" x2="-140" y2="-110" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Light Chain (Parallel outer) -->
      <line x1="-50" y1="-50" x2="-130" y2="-120" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
      <!-- Disulfide link -->
      <line x1="-80" y1="-60" x2="-75" y2="-72" stroke="#fbbf24" stroke-width="3"/>
      <!-- Fab Antigen Binding Tip -->
      <rect x="-155" y="-125" width="22" height="22" rx="4" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Lower Fab Arm (Left-Down) -->
      <!-- Heavy Chain -->
      <line x1="-20" y1="8" x2="-140" y2="110" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Light Chain (Parallel outer) -->
      <line x1="-50" y1="50" x2="-130" y2="120" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
      <!-- Disulfide link -->
      <line x1="-80" y1="60" x2="-75" y2="72" stroke="#fbbf24" stroke-width="3"/>
      <!-- Fab Antigen Binding Tip -->
      <rect x="-155" y="105" width="22" height="22" rx="4" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Right Monomer (pointing right/up/down) -->
    <g transform="translate(140, 0)">
      <!-- Fc Region (Horizontal stem towards center) -->
      <line x1="-80" y1="-8" x2="20" y2="-8" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <line x1="-80" y1="8" x2="20" y2="8" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Inter-chain Disulfide bridges on Fc -->
      <line x1="-20" y1="-8" x2="-20" y2="8" stroke="#fbbf24" stroke-width="3"/>
      <line x1="-50" y1="-8" x2="-50" y2="8" stroke="#fbbf24" stroke-width="3"/>

      <!-- Upper Fab Arm (Right-Up) -->
      <!-- Heavy Chain -->
      <line x1="20" y1="-8" x2="140" y2="-110" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Light Chain (Parallel outer) -->
      <line x1="50" y1="-50" x2="130" y2="-120" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
      <!-- Disulfide link -->
      <line x1="80" y1="-60" x2="75" y2="-72" stroke="#fbbf24" stroke-width="3"/>
      <!-- Fab Antigen Binding Tip -->
      <rect x="135" y="-125" width="22" height="22" rx="4" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Lower Fab Arm (Right-Down) -->
      <!-- Heavy Chain -->
      <line x1="20" y1="8" x2="140" y2="110" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
      <!-- Light Chain (Parallel outer) -->
      <line x1="50" y1="50" x2="130" y2="120" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
      <!-- Disulfide link -->
      <line x1="80" y1="60" x2="75" y2="72" stroke="#fbbf24" stroke-width="3"/>
      <!-- Fab Antigen Binding Tip -->
      <rect x="135" y="105" width="22" height="22" rx="4" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Joining Chain (J Chain) - Disulfide connected loop in center -->
    <g transform="translate(0, 0)">
      <!-- Oval/loop polypeptide joining the two Fc tails -->
      <path d="M -70 0 C -40 -35 40 -35 70 0 C 40 35 -40 35 -70 0 Z" fill="#ec4899" stroke="#f43f5e" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#be185d" stroke="#fda4af" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff">J</text>
    </g>

    <!-- Secretory Component (SC) - Wrapping glycoprotein winding around the Fc stems -->
    <g transform="translate(0, 0)">
      <path d="M -90 -45 C -40 -70 40 -70 90 -45 C 130 -25 110 50 70 55 C 20 60 -20 60 -70 55 C -110 50 -130 -25 -90 -45" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 8"/>
    </g>

    <!-- Labels & Structural Callouts -->

    <!-- Callout 1: J Chain -->
    <g transform="translate(0, -90)">
      <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fda4af">J CHAIN (15 kDa)</text>
      <line x1="0" y1="14" x2="0" y2="60" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="60" r="3" fill="#f43f5e"/>
    </g>

    <!-- Callout 2: Secretory Component -->
    <g transform="translate(0, 100)">
      <rect x="-95" y="-14" width="190" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7">SECRETORY COMPONENT</text>
      <line x1="0" y1="-14" x2="0" y2="-45" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="3" fill="#10b981"/>
    </g>

    <!-- Callout 3: Heavy & Light Chains (Left) -->
    <g transform="translate(-320, -60)">
      <rect x="-70" y="-22" width="140" height="44" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Heavy Chain (Alpha)</text>
      <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe">&amp; Light Chain</text>
      <line x1="70" y1="0" x2="120" y2="-20" stroke="#3b82f6" stroke-width="2"/>
    </g>

    <!-- Callout 4: Four Antigen Binding Sites (Fab) -->
    <g transform="translate(320, -60)">
      <rect x="-80" y="-22" width="160" height="44" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">4 Antigen-Binding Sites</text>
      <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">(Tetravalent Dimer)</text>
      <line x1="-80" y1="0" x2="-130" y2="-30" stroke="#60a5fa" stroke-width="2"/>
    </g>

  </g>

  <!-- Watermark -->
  <text x="36" y="692" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569" letter-spacing="1">medicomm</text>
</svg>