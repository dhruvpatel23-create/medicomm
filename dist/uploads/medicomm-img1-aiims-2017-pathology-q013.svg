          <rect x="-60" y="-45" width="35" height="40" rx="4"/>
          <rect x="-15" y="-45" width="35" height="40" rx="4"/>
          <rect x="30" y="-45" width="30" height="40" rx="4"/>
          <rect x="-60" y="5" width="35" height="40" rx="4"/>
          <rect x="-15" y="5" width="35" height="40" rx="4"/>
          <rect x="30" y="5" width="30" height="40" rx="4"/>
        </g>
      </g>
      <!-- Foreign-Body Giant Cells engulfing the vegetative matter -->
      <g transform="translate(-120, -50)">
        <ellipse cx="0" cy="0" rx="50" ry="35" fill="#fda4af" stroke="#be123c" stroke-width="2"/>
        <g fill="#4c1d95">
          <circle cx="-20" cy="-10" r="4.5"/><circle cx="-5" cy="-15" r="4.5"/><circle cx="10" cy="-12" r="4.5"/>
          <circle cx="-15" cy="10" r="4.5"/><circle cx="5" cy="12" r="4.5"/><circle cx="20" cy="5" r="4.5"/>
        </g>
      </g>
      <g transform="translate(120, 40)">
        <ellipse cx="0" cy="0" rx="48" ry="34" fill="#fda4af" stroke="#be123c" stroke-width="2"/>
        <g fill="#4c1d95">
          <circle cx="-15" cy="-8" r="4.5"/><circle cx="0" cy="-12" r="4.5"/><circle cx="15" cy="-8" r="4.5"/>
          <circle cx="-10" cy="10" r="4.5"/><circle cx="10" cy="10" r="4.5"/>
        </g>
      </g>
    </g>
  </g>
  
  <g transform="translate(740, 240)">
    <rect x="-165" y="-26" width="330" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Vegetative Foreign Matter</text>
    <path d="M -153,0 L -200,60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-200" cy="60" r="6" fill="#fde047"/>
