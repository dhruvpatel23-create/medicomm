<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">VIRAL ULTRASTRUCTURE IDENTIFICATION</text>
  <text x="500" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Transmission Electron Microscopy Morphologies</text>

  <!-- 2x2 Grid of Viruses -->
  <!-- Quadrant 1 (Top-Left): Rotavirus (Wheel with spokes) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="410" height="370" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Cartwheel Virion Illustration -->
    <g transform="translate(205, 185)">
      <!-- Outer Rim Capsid -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#38bdf8" stroke-width="12"/>
      <circle cx="0" cy="0" r="75" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="5"/>
      <!-- Inner Core Hub -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
      <!-- Radiating Spokes (Cartwheel morphology) -->
      <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-42" x2="0" y2="-94"/>
        <line x1="0" y1="42" x2="0" y2="94"/>
        <line x1="-42" y1="0" x2="-94" y2="0"/>
        <line x1="42" y1="0" x2="94" y2="0"/>
        <line x1="-30" y1="-30" x2="-68" y2="-68"/>
        <line x1="30" y1="-30" x2="68" y2="-68"/>
        <line x1="-30" y1="30" x2="-68" y2="68"/>
        <line x1="30" y1="30" x2="68" y2="68"/>
        <line x1="-16" y1="-38" x2="-36" y2="-88"/>
        <line x1="16" y1="-38" x2="36" y2="-88"/>
        <line x1="-16" y1="38" x2="-36" y2="88"/>
        <line x1="16" y1="38" x2="36" y2="88"/>
        <line x1="-38" y1="-16" x2="-88" y2="-36"/>
        <line x1="38" y1="-16" x2="88" y2="-36"/>
        <line x1="-38" y1="16" x2="-88" y2="36"/>
        <line x1="38" y1="16" x2="88" y2="36"/>
      </g>
    </g>
    <!-- Label Marker 1 -->
    <g transform="translate(45, 45)" filter="url(#glow)">
      <circle cx="0" cy="0" r="24" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">1</text>
    </g>
  </g>

  <!-- Quadrant 2 (Top-Right): Bullet-Shaped (Rhabdovirus) -->
  <g transform="translate(530, 130)">
    <rect x="0" y="0" width="410" height="370" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Bullet Shaped Virion -->
    <g transform="translate(205, 185)">
      <!-- Bullet shape: rounded hemisphere top, cylindrical trunk, flat base -->
      <path d="M -50 80 L -50 -20 C -50 -75 50 -75 50 -20 L 50 80 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="6"/>
      <!-- Inner helical ribonucleoprotein core -->
      <path d="M -30 70 L -30 -15 C -30 -50 30 -50 30 -15 L 30 70" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- Surface spikes -->
      <g stroke="#818cf8" stroke-width="3">
        <line x1="-50" y1="60" x2="-62" y2="60"/><line x1="50" y1="60" x2="62" y2="60"/>
        <line x1="-50" y1="30" x2="-62" y2="30"/><line x1="50" y1="30" x2="62" y2="30"/>
        <line x1="-50" y1="0" x2="-62" y2="0"/><line x1="50" y1="0" x2="62" y2="0"/>
        <line x1="-50" y1="-30" x2="-62" y2="-30"/><line x1="50" y1="-30" x2="62" y2="-30"/>
      </g>
    </g>
    <!-- Label Marker 2 -->
    <g transform="translate(45, 45)" filter="url(#glow)">
      <circle cx="0" cy="0" r="24" fill="#4f46e5" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">2</text>
    </g>
  </g>

  <!-- Quadrant 3 (Bottom-Left): Filamentous (Filovirus) -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="410" height="370" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Filamentous shepherd's crook -->
    <g transform="translate(205, 185)">
      <path d="M -100 90 C -70 80 -40 -30 0 -30 C 50 -30 80 10 60 50 C 40 80 -10 60 0 20 C 10 -10 40 -80 90 -90" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round"/>
      <path d="M -100 90 C -70 80 -40 -30 0 -30 C 50 -30 80 10 60 50 C 40 80 -10 60 0 20 C 10 -10 40 -80 90 -90" fill="none" stroke="#ffe4e6" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Label Marker 3 -->
    <g transform="translate(45, 45)" filter="url(#glow)">
      <circle cx="0" cy="0" r="24" fill="#e11d48" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">3</text>
    </g>
  </g>

  <!-- Quadrant 4 (Bottom-Right): Brick-Shaped (Poxvirus) -->
  <g transform="translate(530, 530)">
    <rect x="0" y="0" width="410" height="370" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Brick-shaped with biconcave/dumbbell core -->
    <g transform="translate(205, 185)">
      <rect x="-85" y="-65" width="170" height="130" rx="28" fill="#14532d" stroke="#22c55e" stroke-width="6"/>
      <!-- Dumbbell core -->
      <path d="M -50 -35 C -20 -10 20 -10 50 -35 C 65 -15 65 15 50 35 C 20 10 -20 10 -50 35 C -65 15 -65 -15 -50 -35 Z" fill="#166534" stroke="#86efac" stroke-width="3"/>
      <!-- Lateral bodies -->
      <ellipse cx="0" cy="-35" rx="35" ry="12" fill="#15803d" opacity="0.7"/>
      <ellipse cx="0" cy="35" rx="35" ry="12" fill="#15803d" opacity="0.7"/>
    </g>
    <!-- Label Marker 4 -->
    <g transform="translate(45, 45)" filter="url(#glow)">
      <circle cx="0" cy="0" r="24" fill="#16a34a" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">4</text>
    </g>
  </g>

  <!-- Subtle medulla watermark -->
  
</svg>