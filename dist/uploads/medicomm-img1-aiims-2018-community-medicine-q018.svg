<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <rect width="1200" height="850" fill="#030712"/>
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">ZOONOTIC TRANSMISSION ECOLOGY</text>
  <text x="600" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">Comparative Reservoir Dynamics &amp; Transmission Spillover Pathways</text>

  <!-- Central Top: Natural Reservoir -->
  <g transform="translate(600, 190)" filter="url(#cardShadow)">
    <rect x="-220" y="-70" width="440" height="140" rx="16" fill="url(#batGrad)" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Bat silhouette icon -->
    <path d="M -150 -10 Q -120 -40 -90 -25 Q -60 -40 -30 -10 Q -5 -25 0 0 Q 5 -25 30 -10 Q 60 -40 90 -25 Q 120 -40 150 -10 Q 90 25 30 15 Q 10 35 0 20 Q -10 35 -30 15 Q -90 25 -150 -10 Z" fill="#c7d2fe" opacity="0.35"/>
    
    <text x="0" y="-20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">NATURAL RESERVOIR HOST</text>
    <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Fruit Bats (Pteropus species)</text>
    <text x="0" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Shedding virus in saliva, urine &amp; feces (asymptomatic carriers)</text>
  </g>

  <!-- Branching Arrows from Reservoir -->
  <!-- Left Arrow to Route A -->
  <path d="M 450 250 C 330 300 240 330 240 390" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <rect x="250" y="295" width="130" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="315" y="313" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route A (Malaysia)</text>

  <!-- Right Arrow to Route B -->
  <path d="M 750 250 C 870 300 960 330 960 390" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="820" y="295" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="890" y="313" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route B (Bangladesh)</text>

  <!-- ==================== LEFT COLUMN: ROUTE A (MALAYSIA) ==================== -->
  <!-- Box A1: Intermediate Amplifying Host (Pigs) -->
  <g transform="translate(240, 460)" filter="url(#cardShadow)">
    <rect x="-180" y="-55" width="360" height="110" rx="14" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-20" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">INTERMEDIATE AMPLIFIER HOST</text>
    <text x="0" y="8" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Pigs / Swine</text>
    <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Contaminated orchard fruit / dropped food</text>
  </g>

  <!-- Arrow A1 -> A2 -->
  <path d="M 240 515 L 240 575" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="255" y="550" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Direct contact</text>

  <!-- Box A2: Human Exposure in Route A -->
  <g transform="translate(240, 660)" filter="url(#cardShadow)">
    <rect x="-180" y="-60" width="360" height="120" rx="14" fill="url(#boxGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="-25" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">PRIMARY HUMAN INFECTION</text>
    <text x="0" y="2" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Pig Farmers &amp; Abattoir Workers</text>
    <text x="0" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Occupational aerosol / body fluid contact</text>
    <text x="0" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Encephalitis / Severe Respiratory Illness</text>
  </g>

  <!-- ==================== RIGHT COLUMN: ROUTE B (BANGLADESH) ==================== -->
  <!-- Box B1: Food Vehicle (Raw Date Palm Sap) -->
  <g transform="translate(960, 460)" filter="url(#cardShadow)">
    <rect x="-180" y="-55" width="360" height="110" rx="14" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">VEHICLE OF TRANSMISSION</text>
    <text x="0" y="8" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Raw Date Palm Sap</text>
    <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Bats lick / defecate into collection clay pots</text>
  </g>

  <!-- Arrow B1 -> B2 -->
  <path d="M 960 515 L 960 575" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="975" y="550" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Ingestion</text>

  <!-- Box B2: Human Infection & Person-to-Person in Route B -->
  <g transform="translate(960, 660)" filter="url(#cardShadow)">
    <rect x="-180" y="-60" width="360" height="120" rx="14" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">DIRECT SPILLOVER &amp; SPREAD</text>
    <text x="0" y="2" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Human Consumption of Raw Sap</text>
    <text x="0" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">&#10140; Secondary Human-to-Human Transmission</text>
    <text x="0" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Caregivers, Family Contacts, Nosocomial</text>
  </g>

  <!-- Watermark -->
  
</svg>