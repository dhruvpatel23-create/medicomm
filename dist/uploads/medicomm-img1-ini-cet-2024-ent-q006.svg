<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(300, 100)">
    <!-- Microsurgical Operative Field (Oval Window Niche) -->
    <circle cx="300" cy="350" r="320" fill="#020617" stroke="#475569" stroke-width="6"/>

    <!-- Promontory Bone -->
    <path d="M 120 440 C 200 530, 400 530, 480 440" fill="#1c1917" stroke="#44403c" stroke-width="4"/>
    
    <!-- Incus Long Process Hanging Above -->
    <path d="M 270 120 L 275 280 C 275 310, 295 310, 295 280 L 300 120 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
    <text x="210" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Incus Long Process</text>

    <!-- Stapes Footplate at Oval Window (Superstructure Removed) -->
    <ellipse cx="310" cy="420" rx="80" ry="34" fill="#44403c" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Micro-Fenestration Hole in Footplate -->
    <circle cx="310" cy="420" r="14" fill="#000000" stroke="#f59e0b" stroke-width="3.5"/>

    <!-- Piston Prosthesis Hooked to Incus and Shaft in Fenestration -->
    <!-- Metallic Hook Crimped around Incus -->
    <circle cx="285" cy="280" r="20" fill="none" stroke="#38bdf8" stroke-width="8"/>
    <!-- Vertical Piston Shaft -->
    <line x1="285" y1="300" x2="310" y2="420" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <line x1="285" y1="300" x2="310" y2="420" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Gold Arrow pointing to the Piston Hook on Incus -->
    <g transform="translate(450, 280)">
      <line x1="70" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
    <!-- Gold Arrow pointing to Footplate Fenestration -->
    <g transform="translate(450, 420)">
      <line x1="70" y1="0" x2="15" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>