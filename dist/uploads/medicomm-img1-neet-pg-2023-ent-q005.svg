<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(300, 80)">
    <!-- Anterior Neck Clinical Inspection -->
    <!-- Neck Contour -->
    <path d="M 100 60 L 100 200 C 100 380, 120 540, 40 600 L 560 600 C 480 540, 500 380, 500 200 L 500 60 Z" 
          fill="#1e293b" stroke="#334155" stroke-width="4"/>
          
    <!-- Chin Margin above -->
    <path d="M 180 60 Q 300 100, 420 60" stroke="#475569" stroke-width="4" fill="none"/>

    <!-- Flat Midline Neck (Absence of Laryngeal Prominence / Thyroid Cartilage) -->
    <line x1="300" y1="120" x2="300" y2="300" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>

    <!-- Low Midline Tracheal End-Stoma -->
    <!-- Circumferential Mucocutaneous Suture Margin -->
    <ellipse cx="300" cy="410" rx="80" ry="65" fill="#881337" stroke="#e11d48" stroke-width="4"/>
    <ellipse cx="300" cy="410" rx="50" ry="38" fill="#000000" stroke="#fda4af" stroke-width="3"/>
    
    <!-- Concentric Tracheal Cartilage Ring Rim visible within stoma -->
    <ellipse cx="300" cy="410" rx="38" ry="26" fill="none" stroke="#e2e8f0" stroke-width="5"/>

    <!-- Well-Healed Transverse Apron Incision Scar across anterior neck -->
    <path d="M 120 360 C 200 470, 400 470, 480 360" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-dasharray="8,6"/>

    <!-- Suprasternal Notch below Stoma -->
    <path d="M 240 540 Q 300 570, 360 540" stroke="#475569" stroke-width="4" fill="none"/>

    <!-- Gold Arrow pointing to the Permanent End-Stoma -->
    <g transform="translate(460, 410)">
      <line x1="80" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>