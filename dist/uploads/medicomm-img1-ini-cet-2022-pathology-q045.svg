    <!-- Marker Arrow to Amyloid Stroma -->
    <g transform="translate(-240, -110)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing to pink acellular amyloid matrix -->
      <line x1="16" y1="12" x2="65" y2="55" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="75,62 61,54 67,44" fill="#f59e0b"/>
