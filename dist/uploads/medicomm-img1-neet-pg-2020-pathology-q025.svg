<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Whole Lung Specimen Gradient -->
    <linearGradient id="lungParenchyma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Lower Lobe Panacinar Emphysematous Sieve Texture Pattern -->
    <pattern id="sievePattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <ellipse cx="6" cy="6" rx="4.5" ry="3.5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <ellipse cx="18" cy="18" rx="5" ry="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <ellipse cx="18" cy="6" rx="3.5" ry="4.5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <ellipse cx="6" cy="18" rx="4" ry="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="12" cy="12" r="2.5" fill="#020617"/>
    </pattern>

    <!-- Large Bullae / Emphysema Holes Pattern -->
    <radialGradient id="bullaGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="lungShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-310" y="-20" width="620" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">PANACINAR EMPHYSEMA (ALPHA-1-ANTITRYPSIN DEFICIENCY)</text>
  </g>

  <!-- Whole Lung Sagittal/Coronal Autopsy Slice (Centered, x: 480, y: 310) -->
  <g transform="translate(480, 310)" filter="url(#lungShadow)">
    <!-- Autopsy Tray Shadow / Perimeter -->
    <!-- Lung Silhouette: Apex top, Hilum medial (left), Base diaphragmatic bottom -->
    <path d="M -20,-220 
             C 40,-225 120,-170 145,-100 
             C 170,-30 180,50 170,120 
             C 160,190 120,230 40,240 
             C -30,250 -100,240 -150,210 
             C -130,170 -110,130 -115,80 
             C -120,40 -150,0 -160,-50 
             C -170,-100 -120,-180 -70,-210 Z" 
          fill="url(#lungParenchyma)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Main Bronchus & Pulmonary Vessels entering at hilum (-150, 0) -->
    <g transform="translate(-140, -10)">
      <!-- Main stem bronchus cartilage rings -->
      <path d="M -15,-30 L 35,-15 L 30,15 L -20,5 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="30" cy="-2" rx="6" ry="12" fill="#0f172a"/>
      <!-- Pulmonary artery branch -->
      <circle cx="20" cy="-25" r="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- Pulmonary vein branch -->
      <circle cx="25" cy="22" r="9" fill="#991b1b" stroke="#ef4444" stroke-width="1.5"/>
    </g>

    <!-- Fissures dividing Lobes -->
    <!-- Oblique (Major) Fissure running diagonally across lung -->
    <path d="M -100,-70 C -30,-20 60,30 165,115" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 3" fill="none"/>

    <!-- ================= UPPER LOBE (Relatively Spared) ================= -->
    <g transform="translate(10, -120)">
      <!-- Mild anthracite pigment streaks (normal urban dust macules) -->
      <path d="M -20,-20 Q -5,-15 10,-25" stroke="#09090b" stroke-width="2" fill="none" opacity="0.4"/>
      <path d="M 30,-40 Q 45,-35 60,-45" stroke="#09090b" stroke-width="2" fill="none" opacity="0.4"/>
      <!-- Normal dense fine parenchymal texture -->
      <circle cx="0" cy="-30" r="2" fill="#334155"/>
      <circle cx="40" cy="-10" r="2.5" fill="#334155"/>
      <circle cx="-30" cy="10" r="2" fill="#334155"/>
    </g>

    <!-- ================= LOWER LOBE (PANACINAR EMPHYSEMA - Severe Destruction) ================= -->
    <g clip-path="url(#lowerLobeClip)">
      <clipPath id="lowerLobeClip">
        <path d="M -160,20 C -90,-20 60,30 180,120 L 160,250 L -160,250 Z"/>
      </clipPath>

      <!-- Sieve-like / Swiss-cheese diffuse porous texture filling lower lobe -->
      <rect x="-160" y="-10" width="340" height="260" fill="url(#sievePattern)"/>

      <!-- Large Panacinar Emphysematous Cysts and Dilated Airspaces -->
      <g stroke="#64748b" stroke-width="1">
        <!-- Cluster 1 (Basal Lateral) -->
        <circle cx="90" cy="160" r="18" fill="url(#bullaGrad)"/>
        <circle cx="125" cy="140" r="14" fill="url(#bullaGrad)"/>
        <circle cx="65" cy="185" r="16" fill="url(#bullaGrad)"/>
        <circle cx="110" cy="190" r="17" fill="url(#bullaGrad)"/>

        <!-- Cluster 2 (Central Base) -->
        <circle cx="20" cy="140" r="19" fill="url(#bullaGrad)"/>
        <circle cx="-25" cy="155" r="21" fill="url(#bullaGrad)"/>
        <circle cx="15" cy="190" r="18" fill="url(#bullaGrad)"/>
        <circle cx="-30" cy="205" r="16" fill="url(#bullaGrad)"/>

        <!-- Cluster 3 (Basal Medial) -->
        <circle cx="-75" cy="140" r="16" fill="url(#bullaGrad)"/>
        <circle cx="-110" cy="165" r="15" fill="url(#bullaGrad)"/>
        <circle cx="-75" cy="180" r="17" fill="url(#bullaGrad)"/>

        <!-- Mid-zone panacinar porous destruction -->
        <circle cx="50" cy="85" r="15" fill="url(#bullaGrad)"/>
        <circle cx="95" cy="95" r="16" fill="url(#bullaGrad)"/>
        <circle cx="0" cy="80" r="14" fill="url(#bullaGrad)"/>
        <circle cx="-45" cy="90" r="15" fill="url(#bullaGrad)"/>
        <circle cx="-85" cy="75" r="13" fill="url(#bullaGrad)"/>
      </g>

      <!-- Fine broken, floating alveolar septa remnants inside bullae -->
      <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none">
        <line x1="85" y1="150" x2="95" y2="170"/>
        <line x1="15" y1="130" x2="25" y2="150"/>
        <line x1="-30" y1="145" x2="-20" y2="165"/>
        <line x1="60" y1="175" x2="70" y2="195"/>
      </g>
    </g>

    <!-- Zone Demarcation Bracket -->
    <path d="M 185,40 Q 205,140 185,230" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="215" y="145" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">LOWER LOBE PREDOMINANCE</text>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: Lower Lobe Panacinar Emphysema -->
  <g transform="translate(170, 160)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">1</text>
    <line x1="20" y1="5" x2="245" y2="-50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">RELATIVELY SPARED UPPER LOBE</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Contrast with smoking (centrilobular) emphysema</text>
  </g>

  <!-- Callout 2: Diffuse Sieve-Like Alveolar Wall Destruction -->
  <g transform="translate(170, 420)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2</text>
    <line x1="20" y1="-5" x2="250" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">PANACINAR DESTRUCTION</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Uniform enlargement of all acini throughout lower lobes</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">PANACINAR VS CENTRIACINAR EMPHYSEMA</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Panacinar (Panlobular):</tspan> Affects lower/basal lobes uniformly;</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">caused by <tspan font-weight="700" fill="#facc15">Alpha-1-Antitrypsin (AAT) deficiency</tspan> (PiZZ genotype).</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Centriacinar (Centrilobular):</tspan> Upper lobes; caused by cigarette smoking.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">PATHOGENESIS &amp; LIVER MANIFESTATION</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Protease-Antiprotease Imbalance:</tspan> Lack of AAT allows uninhibited</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">neutrophil elastase to digest alveolar elastin/septal architecture.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Hepatic Finding:</tspan> PAS (+), diastase-resistant globules in periportal hepatocytes.</text>
  </g>

  <!-- Medulla Watermark -->
  
</svg>
