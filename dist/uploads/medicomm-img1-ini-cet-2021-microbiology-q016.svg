<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="70" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">BACTERIAL CELL WALL ENVELOPE</text>
  <text x="500" y="105" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Structural Components of Gram-Negative Envelope</text>

  <!-- Diagram Container -->
  <g transform="translate(100, 140)">
    <!-- O-Antigen Chains (Top) -->
    <!-- Wavy repetitive polysaccharide chains -->
    <g stroke="#38bdf8" stroke-width="4" fill="none">
      <path d="M 200 120 Q 190 80 200 40 Q 210 10 200 -20"/>
      <path d="M 280 120 Q 270 70 285 30 Q 275 -5 285 -30"/>
      <path d="M 360 120 Q 350 80 365 45 Q 355 10 365 -25"/>
      <path d="M 440 120 Q 430 75 445 35 Q 435 -5 445 -35"/>
      <path d="M 520 120 Q 510 80 525 40 Q 515 0 525 -30"/>
      <path d="M 600 120 Q 590 70 605 35 Q 595 -5 605 -25"/>
    </g>
    <!-- O-antigen repeating units (beads) -->
    <g fill="#0284c7">
      <circle cx="200" cy="80" r="8"/><circle cx="205" cy="40" r="8"/><circle cx="200" cy="0" r="8"/>
      <circle cx="280" cy="80" r="8"/><circle cx="285" cy="40" r="8"/><circle cx="280" cy="0" r="8"/>
      <circle cx="360" cy="80" r="8"/><circle cx="365" cy="40" r="8"/><circle cx="360" cy="0" r="8"/>
      <circle cx="440" cy="80" r="8"/><circle cx="445" cy="40" r="8"/><circle cx="440" cy="0" r="8"/>
      <circle cx="520" cy="80" r="8"/><circle cx="525" cy="40" r="8"/><circle cx="520" cy="0" r="8"/>
      <circle cx="600" cy="80" r="8"/><circle cx="605" cy="40" r="8"/><circle cx="600" cy="0" r="8"/>
    </g>

    <!-- Core Polysaccharide -->
    <rect x="150" y="120" width="500" height="40" rx="8" fill="#eab308" fill-opacity="0.8" stroke="#ca8a04" stroke-width="2"/>
    <text x="400" y="146" text-anchor="middle" fill="#422006" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Core Polysaccharide</text>

    <!-- Lipid A Region (Directly anchored into outer membrane) -->
    <rect x="150" y="165" width="500" height="45" rx="6" fill="#dc2626" fill-opacity="0.9" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="400" y="194" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Lipid Glucosamine Disaccharide &amp; Fatty Acids</text>

    <!-- Outer Membrane Bilayer -->
    <rect x="100" y="215" width="600" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <!-- Outer leaflet & Inner leaflet circles -->
    <g fill="#94a3b8">
      <circle cx="140" cy="235" r="7"/><circle cx="170" cy="235" r="7"/><circle cx="200" cy="235" r="7"/>
      <circle cx="600" cy="235" r="7"/><circle cx="630" cy="235" r="7"/><circle cx="660" cy="235" r="7"/>
      <circle cx="140" cy="285" r="7"/><circle cx="170" cy="285" r="7"/><circle cx="200" cy="285" r="7"/>
      <circle cx="600" cy="285" r="7"/><circle cx="630" cy="285" r="7"/><circle cx="660" cy="285" r="7"/>
    </g>
    <!-- Porin Channel -->
    <rect x="340" y="215" width="120" height="90" rx="8" fill="#4f46e5" stroke="#818cf8" stroke-width="2"/>
    <text x="400" y="265" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Porin</text>

    <!-- Periplasmic Space -->
    <rect x="100" y="325" width="600" height="150" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="130" y="360" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Periplasmic Space</text>
    
    <!-- Thin Peptidoglycan Mesh -->
    <rect x="120" y="380" width="560" height="30" rx="6" fill="#10b981" fill-opacity="0.8" stroke="#059669" stroke-width="2"/>
    <text x="400" y="401" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Thin Peptidoglycan Layer</text>

    <!-- Plasma / Inner Membrane Bilayer -->
    <rect x="100" y="495" width="600" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="400" y="548" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Phospholipid Bilayer</text>

    <!-- Cytoplasm -->
    <rect x="100" y="605" width="600" height="60" fill="#030712"/>
    <text x="400" y="642" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Cytoplasm</text>
  </g>

  <!-- Numbered Callout Markers: 1, 2, 3, 4 -->
  <!-- Marker 2: O-Antigen -->
  <g transform="translate(60, 180)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">2</text>
    <line x1="32" y1="0" x2="180" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="180" cy="0" r="5" fill="#38bdf8"/>
  </g>

  <!-- Marker 1: Lipid A (Endotoxin) -->
  <g transform="translate(60, 325)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">1</text>
    <line x1="32" y1="0" x2="180" y2="0" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="180" cy="0" r="5" fill="#ef4444"/>
  </g>

  <!-- Marker 3: Outer Membrane -->
  <g transform="translate(860, 400)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#475569" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">3</text>
    <line x1="-32" y1="0" x2="-150" y2="0" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="-150" cy="0" r="5" fill="#94a3b8"/>
  </g>

  <!-- Marker 4: Plasma / Inner Membrane -->
  <g transform="translate(860, 680)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">4</text>
    <line x1="-32" y1="0" x2="-150" y2="0" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="-150" cy="0" r="5" fill="#94a3b8"/>
  </g>

  <!-- Subtle medulla watermark -->
  
</svg>