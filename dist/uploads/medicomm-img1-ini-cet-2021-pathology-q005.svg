<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-290" y="-18" width="580" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">IN VIVO COAGULATION CASCADE: EXTRINSIC PATHWAY</text>
  </g>

  <!-- Diagram Canvas Container -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-420" y="-250" width="840" height="500" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>

    <!-- Vascular Damage Banner at Top -->
    <g transform="translate(0, -200)">
      <rect x="-380" y="-20" width="760" height="42" rx="8" fill="#881337" opacity="0.6" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffe4e6">VASCULAR DAMAGE</text>
      <text x="0" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fecdd3">Exposure to Subendothelial Tissue Factor (TF)</text>
    </g>

    <!-- Subendothelial Membrane Strip -->
    <rect x="-380" y="-155" width="760" height="14" fill="#fb7185" opacity="0.8"/>

    <!-- TF Node on Membrane -->
    <g transform="translate(-140, -148)">
      <circle cx="0" cy="0" r="28" fill="#059669" stroke="#34d399" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff">TF</text>
    </g>

    <!-- Arrow from TF to Complexation -->
    <path d="M -140,-120 L -140,-35" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-140,-25 -146,-40 -134,-40" fill="#34d399"/>

    <!-- Left: Factor 'L' Node -->
    <g transform="translate(-300, -30)">
      <circle cx="0" cy="0" r="32" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff">L</text>
    </g>

    <!-- Arrow from L towards complexation -->
    <line x1="-265" y1="-30" x2="-180" y2="-30" stroke="#a78bfa" stroke-width="3"/>
    <polygon points="-170,-30 -185,-36 -185,-24" fill="#a78bfa"/>

    <!-- Combined TF - L Complex -->
    <g transform="translate(60, -30)">
      <!-- L component -->
      <circle cx="-15" cy="0" r="30" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="-15" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff">L</text>
      <!-- TF component -->
      <circle cx="28" cy="-18" r="22" fill="#059669" stroke="#34d399" stroke-width="2"/>
      <text x="28" y="-12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff">TF</text>
    </g>

    <!-- Horizontal transition arrow to TF-L Complex -->
    <line x1="-100" y1="-30" x2="10" y2="-30" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="20,-30 8,-36 8,-24" fill="#38bdf8"/>

    <!-- Pathway Down to Factor IX -> IXa -->
    <g transform="translate(-160, 100)">
      <!-- Factor IX -->
      <circle cx="0" cy="0" r="28" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff">IX</text>
    </g>

    <!-- Activation arrow IX -> IXa -->
    <line x1="-128" y1="100" x2="180" y2="100" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="190,100 178,94 178,106" fill="#38bdf8"/>

    <!-- Arrow from TF-L complex catalyzing IX -> IXa -->
    <path d="M 60,15 L 60,90" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <polygon points="60,98 54,84 66,84" fill="#34d399"/>

    <!-- Factor IXa Result -->
    <g transform="translate(225, 100)">
      <circle cx="0" cy="0" r="30" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#ffffff">IXa</text>
    </g>

    <!-- Downstream Clot Formation Summary (X -> Xa -> Thrombin -> Fibrin) -->
    <g transform="translate(0, 185)">
      <rect x="-350" y="-30" width="700" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="-250" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">Factor X</text>
      <text x="-160" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">→</text>
      <text x="-80" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">Factor Xa</text>
      <text x="10" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">→</text>
      <text x="100" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#f59e0b">Thrombin</text>
      <text x="190" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">→</text>
      <text x="270" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#ef4444">Fibrin Clot</text>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>