<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">BONE RADIOGRAPHY: DIAPHYSEAL LESION</text>
  </g>

  <!-- Radiograph Display Frame -->
  <g transform="translate(480, 350)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="16" fill="#020617" stroke="#334155" stroke-width="2.5"/>

    <!-- Long Bone Cortex (Tibia Diaphysis) -->
    <g transform="translate(0, 0)">
      <!-- Medullary Canal (Radiolucent osteolytic destruction) -->
      <rect x="-65" y="-235" width="130" height="470" fill="#0f172a"/>
      <!-- Permeative / Moth-eaten Lytic Lesion in mid-shaft -->
      <ellipse cx="0" cy="0" rx="55" ry="110" fill="#000000" stroke="#1e293b" stroke-width="2"/>

      <!-- Cortical Bone (Ivory/Gray dense bone) -->
      <!-- Left Cortex -->
      <rect x="-115" y="-235" width="50" height="470" fill="#cbd5e1" opacity="0.8"/>
      <!-- Right Cortex -->
      <rect x="65" y="-235" width="50" height="470" fill="#cbd5e1" opacity="0.8"/>

      <!-- "Onion-Skin" Multilayered Lamellated Periosteal Reaction (Bilateral concentric parallel bone shells) -->
      <!-- Left side lamellae -->
      <path d="M -120,-160 C -140,-40 -140,40 -120,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.9"/><path d="M -128,-160 C -148,-40 -148,40 -128,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.75"/><path d="M -136,-160 C -156,-40 -156,40 -136,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.6000000000000001"/><path d="M -144,-160 C -164,-40 -164,40 -144,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.45000000000000007"/><path d="M -152,-160 C -172,-40 -172,40 -152,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.30000000000000004"/>

      <!-- Right side lamellae -->
      <path d="M 120,-160 C 140,-40 140,40 120,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.9"/><path d="M 128,-160 C 148,-40 148,40 128,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.75"/><path d="M 136,-160 C 156,-40 156,40 136,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.6000000000000001"/><path d="M 144,-160 C 164,-40 164,40 144,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.45000000000000007"/><path d="M 152,-160 C 172,-40 172,40 152,160" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.30000000000000004"/>
    </g>

    <!-- Marker Arrow to Onion-Skin Periosteal Reaction -->
    <g transform="translate(-240, 0)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing to lamellated periosteum -->
      <line x1="18" y1="0" x2="80" y2="0" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="90,0 78,-5 78,5" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>