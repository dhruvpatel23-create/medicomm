<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 80)">
    <!-- Coronal CT of Sinonasal and Orbital Anatomy -->
    <ellipse cx="350" cy="360" rx="330" ry="300" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Normal Right Frontal Sinus (Aerated, Hypodense Black) -->
    <path d="M 230 190 C 220 120, 290 120, 300 190 Z" fill="#000000" stroke="#64748b" stroke-width="2.5"/>

    <!-- Right Orbit (Normal Position) -->
    <ellipse cx="200" cy="330" rx="80" ry="90" fill="#000000" stroke="#64748b" stroke-width="2.5"/>

    <!-- Large Expansile Left Frontal Sinus Cystic Mass (Isodense Soft Tissue) -->
    <ellipse cx="440" cy="220" rx="105" ry="85" fill="#1e1b4b" stroke="#f43f5e" stroke-width="4"/>
    <ellipse cx="440" cy="220" rx="75" ry="60" fill="#312e81"/>

    <!-- Eroded Superior Orbital Rim / Orbital Roof (Bony Resorption Margin) -->
    <path d="M 350 270 Q 440 320 530 270" stroke="#f43f5e" stroke-width="5" stroke-dasharray="5,5" fill="none"/>

    <!-- Proptosed Left Globe (Displaced Downward & Outward) -->
    <ellipse cx="470" cy="410" rx="80" ry="90" fill="#000000" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="480" cy="420" r="35" fill="#1e293b"/>

    <!-- Gold Arrow pointing to the expansile eroding cystic mass -->
    <g transform="translate(560, 160)">
      <line x1="80" y1="-30" x2="10" y2="20" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>