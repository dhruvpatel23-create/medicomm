<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Affected Symbol Gradient (Vibrant Cyan) -->
    <linearGradient id="affectedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Symbol Drop Shadow -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 45)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f8fafc" letter-spacing="1.5">FAMILY PEDIGREE ANALYSIS</text>
  </g>

  <!-- Pedigree Tree Layout -->
  <!-- Connecting lines group -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- GENERATION I: Mating Line -->
    <line x1="430" y1="130" x2="530" y2="130"/>
    <!-- Descent from Gen I mating to crossbar -->
    <line x1="480" y1="130" x2="480" y2="190"/>
    <!-- Gen II horizontal distribution bar (from x: 230 to 730) -->
    <line x1="230" y1="190" x2="730" y2="190"/>
    <!-- Drops to Gen II siblings -->
    <line x1="230" y1="190" x2="230" y2="230"/> <!-- II-1 -->
    <line x1="390" y1="190" x2="390" y2="230"/> <!-- II-2 -->
    <line x1="570" y1="190" x2="570" y2="230"/> <!-- II-4 -->
    <line x1="730" y1="190" x2="730" y2="230"/> <!-- II-5 -->

    <!-- GENERATION II: Mating Line II-2 with II-3 -->
    <line x1="390" y1="250" x2="470" y2="250"/>
    <!-- Descent from II-2 x II-3 mating to Gen III crossbar -->
    <line x1="430" y1="250" x2="430" y2="330"/>
    <!-- Gen III horizontal distribution bar (from x: 330 to 530) -->
    <line x1="330" y1="330" x2="530" y2="330"/>
    <!-- Drops to Gen III siblings -->
    <line x1="330" y1="330" x2="330" y2="370"/> <!-- III-1 -->
    <line x1="430" y1="330" x2="430" y2="370"/> <!-- III-2 (Proband) -->
    <line x1="530" y1="330" x2="530" y2="370"/> <!-- III-3 -->
  </g>

  <!-- GENERATION LABELS -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f59e0b" text-anchor="middle">
    <text x="80" y="137">I</text>
    <text x="80" y="257">II</text>
    <text x="80" y="397">III</text>
  </g>

  <!-- ==================== GENERATION I ==================== -->
  <!-- I-1: Affected Male (Filled Square) -->
  <g transform="translate(410, 110)">
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#symbolShadow)"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">1</text>
  </g>

  <!-- I-2: Unaffected Female (Hollow Circle) -->
  <g transform="translate(550, 130)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">2</text>
  </g>

  <!-- ==================== GENERATION II ==================== -->
  <!-- II-1: Unaffected Male -->
  <g transform="translate(230, 250)">
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">1</text>
  </g>

  <!-- II-2: Affected Female (Filled Circle) -->
  <g transform="translate(390, 250)">
    <circle cx="0" cy="0" r="20" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#symbolShadow)"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">2</text>
  </g>

  <!-- II-3: Spousal Partner Unaffected Male -->
  <g transform="translate(470, 250)">
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">3</text>
  </g>

  <!-- II-4: Affected Male (Filled Square) -->
  <g transform="translate(570, 250)">
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#symbolShadow)"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">4</text>
  </g>

  <!-- II-5: Unaffected Female -->
  <g transform="translate(730, 250)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">5</text>
  </g>

  <!-- ==================== GENERATION III ==================== -->
  <!-- III-1: Unaffected Female -->
  <g transform="translate(330, 390)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">1</text>
  </g>

  <!-- III-2: Affected Male (PROBAND - 6'5" man with murmur) -->
  <g transform="translate(430, 390)">
    <rect x="-20" y="-20" width="40" height="40" rx="3" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#symbolShadow)"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">2</text>
    
    <!-- Proband Arrow (P) -->
    <g transform="translate(-42, 38)">
      <line x1="0" y1="18" x2="26" y2="-4" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="20,-10 32,-8 28,4" fill="#f59e0b"/>
      <text x="-8" y="24" font-family="sans-serif" font-size="15" font-weight="900" fill="#f59e0b">P</text>
    </g>
  </g>

  <!-- III-3: Affected Female -->
  <g transform="translate(530, 390)">
    <circle cx="0" cy="0" r="20" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#symbolShadow)"/>
    <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">3</text>
  </g>

  <!-- ==================== PEDIGREE LEGEND ==================== -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="220" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">PEDIGREE KEY</text>
    
    <!-- Male hollow -->
    <rect x="20" y="44" width="16" height="16" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <text x="50" y="57" font-family="sans-serif" font-size="12" fill="#e2e8f0">Unaffected Male</text>

    <!-- Female hollow -->
    <circle cx="28" cy="80" r="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <text x="50" y="84" font-family="sans-serif" font-size="12" fill="#e2e8f0">Unaffected Female</text>

    <!-- Affected Male -->
    <rect x="20" y="99" width="16" height="16" rx="2" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="112" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">Affected Male</text>

    <!-- Affected Female -->
    <circle cx="28" cy="135" r="8" fill="url(#affectedGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="139" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">Affected Female</text>

    <!-- Proband P -->
    <text x="25" y="165" font-family="sans-serif" font-size="14" font-weight="900" fill="#f59e0b">P →</text>
    <text x="50" y="165" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="600">Proband (Patient)</text>
  </g>

  <!-- ==================== GENETIC CRITERIA CARDS ==================== -->
  <g transform="translate(320, 480)">
    <rect x="0" y="0" width="560" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">AUTOSOMAL DOMINANT INHERITANCE CRITERIA</text>
    
    <g font-family="sans-serif" font-size="12" fill="#e2e8f0">
      <text x="24" y="54">• <tspan font-weight="700" fill="#facc15">Vertical Transmission:</tspan> Seen in every successive generation without skipping.</text>
      <text x="24" y="78">• <tspan font-weight="700" fill="#facc15">Equal Sex Distribution:</tspan> Males and females are affected with equal frequency.</text>
      <text x="24" y="102">• <tspan font-weight="700" fill="#facc15">Transmission Risk:</tspan> An affected parent transmits disease to 50% (1 in 2) of offspring.</text>
      <text x="24" y="126">• <tspan font-weight="700" fill="#facc15">Male-to-Male Transmission:</tspan> Present (rules out X-linked dominant inheritance).</text>
      <text x="24" y="152" fill="#94a3b8">Clinical Correlate: Tall stature + aortic regurgitation murmur = <tspan font-weight="700" fill="#38bdf8">Marfan Syndrome (FBN1 mutation)</tspan></text>
    </g>
  </g>

  <!-- Medicomm Watermark -->
  <text x="32" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" opacity="0.35" letter-spacing="1">medicomm</text>
</svg>
