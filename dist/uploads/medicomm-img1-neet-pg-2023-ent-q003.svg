<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(320, 100)">
    <!-- Cuffed Airway Cannula Hardware Illustration -->
    <!-- 15 mm Standard Outer Connector -->
    <rect x="60" y="80" width="80" height="60" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="50" y="65" width="100" height="15" rx="3" fill="#64748b"/>

    <!-- Neck Flange with Bilateral Strap Slits -->
    <path d="M 20 140 L 180 140 L 195 170 L 5 170 Z" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <ellipse cx="30" cy="155" rx="6" ry="10" fill="#020617"/>
    <ellipse cx="170" cy="155" rx="6" ry="10" fill="#020617"/>

    <!-- Curved Shaft of Cannula -->
    <path d="M 100 170 C 100 360, 180 470, 360 480" fill="none" stroke="#e2e8f0" stroke-width="52" stroke-linecap="round"/>
    <path d="M 100 170 C 100 360, 180 470, 360 480" fill="none" stroke="#0f172a" stroke-width="32" stroke-linecap="round"/>

    <!-- Inflatable Low-Pressure High-Volume Cuff Surrounding Distal Shaft -->
    <ellipse cx="270" cy="420" rx="65" ry="46" fill="#38bdf8" opacity="0.45" stroke="#38bdf8" stroke-width="3" transform="rotate(-30 270 420)"/>

    <!-- Pilot Balloon & Inflation Tubing Line -->
    <path d="M 130 170 C 200 140, 270 140, 320 200" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <ellipse cx="340" cy="230" rx="30" ry="20" fill="#38bdf8" opacity="0.75" stroke="#0284c7" stroke-width="3"/>
    <!-- One-Way Luer Valve -->
    <rect x="365" y="222" width="22" height="16" rx="3" fill="#cbd5e1"/>

    <!-- Labels -->
    <text x="380" y="250" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Pilot Balloon &amp; Valve</text>
    <text x="320" y="520" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Inflatable Cuff</text>
    <text x="210" y="145" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Neck Flange</text>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>