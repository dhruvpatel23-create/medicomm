<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <rect width="1000" height="750" fill="#030712"/>
  <defs>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">POPULATION DISTRIBUTION CURVES</text>
  <text x="500" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">Comparative Frequency Distribution Analysis: Study A vs Study B</text>

  <!-- Card Container -->
  <rect x="70" y="110" width="860" height="570" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Legend at Top Right -->
  <g transform="translate(680, 140)">
    <!-- Study A Legend -->
    <line x1="0" y1="15" x2="35" y2="15" stroke="#ef4444" stroke-width="4"/>
    <circle cx="17.5" cy="15" r="4" fill="#ef4444"/>
    <text x="45" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Study A (Red)</text>

    <!-- Study B Legend -->
    <line x1="0" y1="45" x2="35" y2="45" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="17.5" cy="45" r="4" fill="#3b82f6"/>
    <text x="45" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Study B (Blue)</text>
  </g>

  <!-- Cartesian Axes -->
  <!-- Y-axis: (150, 580) to (150, 150) -->
  <line x1="150" y1="580" x2="150" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#axisArrow)"/>
  <text x="100" y="365" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 100 365)">Frequency</text>

  <!-- X-axis: (150, 580) to (880, 580) -->
  <line x1="150" y1="580" x2="880" y2="580" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#axisArrow)"/>
  <text x="515" y="635" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Value of Variable</text>

  <!-- Center Reference Line at X = 515 -->
  <line x1="515" y1="190" x2="515" y2="580" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ==================== CURVES ==================== -->
  <!-- Baseline at Y = 580 -->
  <!-- Center at X = 515 -->

  <!-- STUDY A: Red Single-Peak Bell Curve -->
  <!-- Peak at (515, 230), starts at (220, 580), ends at (810, 580) -->
  <path d="M 220 580 
           C 340 580, 420 230, 515 230 
           C 610 230, 690 580, 810 580" 
        fill="none" 
        stroke="#ef4444" 
        stroke-width="4.5" 
        stroke-linecap="round"
        filter="url(#glowRed)"/>

  <!-- STUDY B: Blue Two-Peak Symmetrical Curve -->
  <!-- Starts at (220, 580), 
       Peak 1 at (370, 360), 
       Trough at (515, 545), 
       Peak 2 at (660, 360), 
       Ends at (810, 580) -->
  <path d="M 220 580 
           C 280 580, 320 360, 370 360 
           C 420 360, 455 545, 515 545 
           C 575 545, 610 360, 660 360 
           C 710 360, 750 580, 810 580" 
        fill="none" 
        stroke="#3b82f6" 
        stroke-width="4.5" 
        stroke-linecap="round"
        filter="url(#glowBlue)"/>

  <!-- Watermark -->
  
</svg>