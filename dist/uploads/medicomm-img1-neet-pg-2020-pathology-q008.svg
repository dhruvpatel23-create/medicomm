<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Field Vignette -->
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="65%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </radialGradient>

    <!-- Inspissated Mucin Gradient in Dilated Glands -->
    <radialGradient id="mucinGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="50%" stop-color="#fee2e2"/>
      <stop offset="85%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f87171"/>
    </radialGradient>

    <!-- Inflamed Stroma Texture -->
    <linearGradient id="stromaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Purple Nuclei -->
    <linearGradient id="nucGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-310" y="-20" width="620" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">JUVENILE (RETENTION) POLYP HISTOPATHOLOGY</text>
  </g>

  <!-- Circular Microscopy Field (Center: 480, 310, r: 230) -->
  <g transform="translate(480, 310)" filter="url(#shadowBox)">
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#fieldGrad)"/>

    <g clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Expanded, Edematous Lamina Propria Background -->
      <rect x="-230" y="-230" width="460" height="460" fill="url(#stromaGrad)"/>

      <!-- Inflammatory Infiltrate in Lamina Propria (Neutrophils, Eosinophils, Plasma Cells) -->
      <g fill="#4c1d95" opacity="0.6">
        <!-- Dense peppered inflammatory cells throughout stroma -->
        <circle cx="-180" cy="-140" r="3.5"/><circle cx="-160" cy="-160" r="3.2"/><circle cx="-140" cy="-130" r="3.5"/>
        <circle cx="-190" cy="-90" r="3.2"/><circle cx="-150" cy="-100" r="3.5"/><circle cx="-170" cy="-50" r="3.2"/>
        <circle cx="160" cy="-160" r="3.5"/><circle cx="180" cy="-130" r="3.2"/><circle cx="140" cy="-140" r="3.5"/>
        <circle cx="170" cy="-80" r="3.5"/><circle cx="150" cy="-40" r="3.2"/><circle cx="190" cy="-30" r="3.5"/>
        
        <circle cx="-180" cy="80" r="3.5"/><circle cx="-160" cy="120" r="3.2"/><circle cx="-140" cy="90" r="3.5"/>
        <circle cx="-190" cy="150" r="3.2"/><circle cx="-150" cy="170" r="3.5"/><circle cx="-120" cy="140" r="3.2"/>
        <circle cx="160" cy="100" r="3.5"/><circle cx="180" cy="130" r="3.2"/><circle cx="140" cy="150" r="3.5"/>
        <circle cx="170" cy="170" r="3.5"/><circle cx="120" cy="180" r="3.2"/><circle cx="190" cy="80" r="3.5"/>
        
        <!-- Interglandular stroma cells -->
        <circle cx="-30" cy="-40" r="3.2"/><circle cx="40" cy="-30" r="3.5"/><circle cx="10" cy="30" r="3.2"/>
        <circle cx="-40" cy="40" r="3.5"/><circle cx="30" cy="60" r="3.2"/><circle cx="0" cy="-80" r="3.5"/>
      </g>

      <!-- Congested Thin-Walled Capillaries in Lamina Propria -->
      <g fill="#ef4444" stroke="#b91c1c" stroke-width="0.8">
        <ellipse cx="-160" cy="0" rx="9" ry="5"/>
        <ellipse cx="160" cy="20" rx="10" ry="6"/>
        <ellipse cx="0" cy="-160" rx="11" ry="6"/>
        <ellipse cx="-10" cy="160" rx="10" ry="5"/>
      </g>

      <!-- ================= CYSTICALLY DILATED GLANDS (The Defining Feature) ================= -->
      <!-- Gland 1: Huge Central Cystic Retention Gland (-30, -10) -->
      <g transform="translate(-30, -10)">
        <!-- Gland Epithelial Border (Cuboidal/flattened, non-dysplastic) -->
        <ellipse cx="0" cy="0" rx="85" ry="65" fill="url(#mucinGrad)" stroke="#db2777" stroke-width="2.5"/>
        
        <!-- Attenuated Single-Layer Columnar/Cuboidal Nuclei Lining the Gland -->
        <g fill="url(#nucGrad)">
          <!-- Top rim -->
          <circle cx="-65" cy="-35" r="4.5"/><circle cx="-45" cy="-52" r="4.5"/><circle cx="-20" cy="-62" r="4.5"/>
          <circle cx="10" cy="-64" r="4.5"/><circle cx="40" cy="-56" r="4.5"/><circle cx="65" cy="-38" r="4.5"/>
          <!-- Right rim -->
          <circle cx="82" cy="-15" r="4.5"/><circle cx="84" cy="15" r="4.5"/>
          <!-- Bottom rim -->
          <circle cx="65" cy="40" r="4.5"/><circle cx="40" cy="58" r="4.5"/><circle cx="15" cy="64" r="4.5"/>
          <circle cx="-15" cy="63" r="4.5"/><circle cx="-45" cy="54" r="4.5"/><circle cx="-68" cy="38" r="4.5"/>
          <!-- Left rim -->
          <circle cx="-83" cy="15" r="4.5"/><circle cx="-82" cy="-15" r="4.5"/>
        </g>

        <!-- Thick Inspissated Eosinophilic Mucin & Cellular Debris inside Cystic Lumen -->
        <path d="M -50,-10 C -30,-30 20,-25 45,-5 C 50,20 10,40 -20,30 C -45,20 -55,0 -50,-10 Z" fill="#fca5a5" opacity="0.6"/>
        <path d="M -30,5 C -15,-10 15,-10 25,5 C 20,20 -10,20 -30,5 Z" fill="#f87171" opacity="0.5"/>
        <!-- Pyknotic sloughed cell debris in mucin -->
        <circle cx="-15" cy="5" r="2.5" fill="#4c1d95"/>
        <circle cx="10" cy="-8" r="3" fill="#4c1d95"/>
        <circle cx="5" cy="15" r="2.8" fill="#4c1d95"/>
      </g>

      <!-- Gland 2: Upper Right Cystic Gland (100, -85) -->
      <g transform="translate(100, -85)">
        <ellipse cx="0" cy="0" rx="55" ry="42" fill="url(#mucinGrad)" stroke="#db2777" stroke-width="2"/>
        <g fill="url(#nucGrad)">
          <circle cx="-40" cy="-25" r="4"/><circle cx="-15" cy="-38" r="4"/><circle cx="15" cy="-38" r="4"/>
          <circle cx="42" cy="-22" r="4"/><circle cx="52" cy="0" r="4"/><circle cx="42" cy="24" r="4"/>
          <circle cx="15" cy="40" r="4"/><circle cx="-15" cy="40" r="4"/><circle cx="-42" cy="24" r="4"/>
          <circle cx="-52" cy="0" r="4"/>
        </g>
        <ellipse cx="2" cy="4" rx="28" ry="18" fill="#fca5a5" opacity="0.6"/>
      </g>

      <!-- Gland 3: Lower Right Dilated Gland (85, 95) -->
      <g transform="translate(85, 95)">
        <ellipse cx="0" cy="0" rx="60" ry="46" fill="url(#mucinGrad)" stroke="#db2777" stroke-width="2"/>
        <g fill="url(#nucGrad)">
          <circle cx="-45" cy="-28" r="4"/><circle cx="-18" cy="-42" r="4"/><circle cx="18" cy="-42" r="4"/>
          <circle cx="45" cy="-26" r="4"/><circle cx="58" cy="0" r="4"/><circle cx="45" cy="28" r="4"/>
          <circle cx="18" cy="44" r="4"/><circle cx="-18" cy="44" r="4"/><circle cx="-45" cy="28" r="4"/>
          <circle cx="-58" cy="0" r="4"/>
        </g>
        <ellipse cx="0" cy="0" rx="32" ry="20" fill="#fca5a5" opacity="0.6"/>
      </g>

      <!-- Gland 4: Lower Left Smaller Dilated Crypt (-115, 90) -->
      <g transform="translate(-115, 90)">
        <ellipse cx="0" cy="0" rx="42" ry="32" fill="url(#mucinGrad)" stroke="#db2777" stroke-width="2"/>
        <g fill="url(#nucGrad)">
          <circle cx="-32" cy="-18" r="3.5"/><circle cx="0" cy="-30" r="3.5"/><circle cx="32" cy="-18" r="3.5"/>
          <circle cx="40" cy="0" r="3.5"/><circle cx="32" cy="18" r="3.5"/><circle cx="0" cy="30" r="3.5"/>
          <circle cx="-32" cy="18" r="3.5"/><circle cx="-40" cy="0" r="3.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: Cystically Dilated Mucin-Filled Glands -->
  <g transform="translate(170, 150)">
    <circle cx="0" cy="0" r="16" fill="#db2777" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="20" y1="5" x2="250" y2="120" stroke="#db2777" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#f472b6">CYSTICALLY DILATED GLANDS</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Retention cysts packed with inspissated mucin</text>
  </g>

  <!-- Callout 2: Inflamed & Edematous Lamina Propria -->
  <g transform="translate(790, 240)">
    <circle cx="0" cy="0" r="16" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">2</text>
    <line x1="-20" y1="5" x2="-230" y2="40" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="25" y="-5" text-anchor="start" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#c084fc">INFLAMED LAMINA PROPRIA</text>
    <text x="25" y="15" text-anchor="start" font-family="sans-serif" font-size="12" fill="#cbd5e1">Abundant neutrophils, eosinophils &amp; edema</text>
  </g>

  <!-- Callout 3: Non-Dysplastic Attenuated Epithelium -->
  <g transform="translate(170, 390)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">3</text>
    <line x1="20" y1="-5" x2="220" y2="-40" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">BENIGN LINING EPITHELIUM</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">No cellular dysplasia or adenomatous atypia</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f472b6">CLINICAL PROFILE: JUVENILE POLYP</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Typical Patient:</tspan> Child &lt; 5 years of age presenting with</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">painless bright red rectal bleeding or prolapsing rectal mass.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#4ade80">Nature:</tspan> Hamartomatous malformation; majority are solitary.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">JUVENILE POLYPOSIS SYNDROME</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Syndromic (JPS):</tspan> Multiple polyps (&gt;5 to 100s) carrying an</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">autosomal dominant risk of colorectal adenocarcinoma (SMAD4/BMPR1A).</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Solitary Sporadic:</tspan> Excellent prognosis, no malignant potential.</text>
  </g>

  <!-- Medicomm Watermark -->
  <text x="32" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" opacity="0.35" letter-spacing="1">medicomm</text>
</svg>
