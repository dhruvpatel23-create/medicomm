<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Histology Field Vignette -->
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="70%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>

    <!-- Myocardial Fiber Cytoplasm (Pink / Eosinophilic) -->
    <linearGradient id="myoFiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Contraction Band Hyper-Eosinophilic Gradient (Intense Crimson / Dark Pink-Red) -->
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Blood / Hemorrhage RBC Gradient -->
    <radialGradient id="rbcGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-310" y="-20" width="620" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">REPERFUSED MYOCARDIUM: CONTRACTION BAND NECROSIS</text>
  </g>

  <!-- Circular Microscopy Field (Center: 480, 310, r: 230) -->
  <g transform="translate(480, 310)" filter="url(#shadowBox)">
    <circle cx="0" cy="0" r="236" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="230" fill="url(#fieldGrad)"/>

    <g clip-path="url(#circleClip)">
      <clipPath id="circleClip">
        <circle cx="0" cy="0" r="230"/>
      </clipPath>

      <!-- Interstitial Hemorrhage / Leaked Erythrocytes in background -->
      <g fill="url(#rbcGrad)" stroke="#7f1d1d" stroke-width="0.6">
        <circle cx="-160" cy="-60" r="6"/><circle cx="-145" cy="-65" r="5.5"/><circle cx="-135" cy="-55" r="6"/>
        <circle cx="-150" cy="-45" r="5.5"/><circle cx="-165" cy="-50" r="6"/>
        
        <circle cx="140" cy="40" r="6"/><circle cx="155" cy="45" r="5.5"/><circle cx="165" cy="35" r="6"/>
        <circle cx="130" cy="50" r="5.5"/><circle cx="145" cy="60" r="6"/>
        
        <circle cx="-50" cy="140" r="6"/><circle cx="-35" cy="145" r="5.5"/><circle cx="-20" cy="135" r="6"/>
        <circle cx="-45" cy="155" r="6"/><circle cx="-30" cy="160" r="5.5"/>

        <circle cx="60" cy="-140" r="6"/><circle cx="75" cy="-135" r="5.5"/><circle cx="90" cy="-145" r="6"/>
      </g>

      <!-- ================= MYOCARDIAL MUSCLE FIBERS (Longitudinal Bundles) ================= -->
      <!-- FIBER 1: Top Longitudinal Bundle (y: -170 to -100) -->
      <g transform="translate(0, -135)">
        <rect x="-240" y="-30" width="480" height="60" fill="url(#myoFiber)" stroke="#e11d48" stroke-width="1.5"/>
        <!-- Fine baseline sarcomere cross-striations -->
        <g stroke="#ffffff" stroke-width="0.8" opacity="0.35">
          <line x1="-220" y1="-28" x2="-220" y2="28"/><line x1="-200" y1="-28" x2="-200" y2="28"/>
          <line x1="-180" y1="-28" x2="-180" y2="28"/><line x1="-160" y1="-28" x2="-160" y2="28"/>
          <line x1="160" y1="-28" x2="160" y2="28"/><line x1="180" y1="-28" x2="180" y2="28"/>
          <line x1="200" y1="-28" x2="200" y2="28"/><line x1="220" y1="-28" x2="220" y2="28"/>
        </g>
        <!-- CONTRACTION BANDS (Thick dense dark transverse bars) -->
        <rect x="-110" y="-30" width="22" height="60" rx="3" fill="url(#bandGrad)"/>
        <rect x="-50" y="-30" width="26" height="60" rx="3" fill="url(#bandGrad)"/>
        <rect x="20" y="-30" width="24" height="60" rx="3" fill="url(#bandGrad)"/>
        <rect x="90" y="-30" width="28" height="60" rx="3" fill="url(#bandGrad)"/>
        <!-- Clear lysed spaces between contraction bands -->
        <rect x="-86" y="-28" width="34" height="56" fill="#fff1f2" opacity="0.5"/>
        <rect x="-22" y="-28" width="40" height="56" fill="#fff1f2" opacity="0.5"/>
        <rect x="46" y="-28" width="42" height="56" fill="#fff1f2" opacity="0.5"/>
      </g>

      <!-- FIBER 2: Dominant Middle-Upper Bundle (y: -80 to 0) -->
      <g transform="translate(0, -40)">
        <rect x="-240" y="-35" width="480" height="70" fill="url(#myoFiber)" stroke="#e11d48" stroke-width="1.5"/>
        <!-- Pyknotic / Karyolytic nucleus remnant (fading ghost nucleus) -->
        <ellipse cx="-170" cy="0" rx="9" ry="6" fill="#831843" opacity="0.4"/>
        <ellipse cx="180" cy="-5" rx="8" ry="5" fill="#831843" opacity="0.3"/>

        <!-- CONTRACTION BANDS (Prominent, dense hyper-eosinophilic) -->
        <rect x="-140" y="-35" width="26" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="-70" y="-35" width="30" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="5" y="-35" width="32" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="85" y="-35" width="28" height="70" rx="4" fill="url(#bandGrad)"/>

        <!-- Disrupted, clumped myofibrils inside the band -->
        <g stroke="#4c0519" stroke-width="1.5" opacity="0.6">
          <line x1="-135" y1="-25" x2="-118" y2="-25"/><line x1="-135" y1="0" x2="-118" y2="0"/><line x1="-135" y1="25" x2="-118" y2="25"/>
          <line x1="-65" y1="-25" x2="-45" y2="-25"/><line x1="-65" y1="0" x2="-45" y2="0"/><line x1="-65" y1="25" x2="-45" y2="25"/>
          <line x1="10" y1="-25" x2="32" y2="-25"/><line x1="10" y1="0" x2="32" y2="0"/><line x1="10" y1="25" x2="32" y2="25"/>
        </g>

        <!-- Adjacent lysed empty cytoplasmic zones -->
        <rect x="-112" y="-33" width="40" height="66" fill="#fff1f2" opacity="0.6"/>
        <rect x="-38" y="-33" width="41" height="66" fill="#fff1f2" opacity="0.6"/>
        <rect x="39" y="-33" width="44" height="66" fill="#fff1f2" opacity="0.6"/>
      </g>

      <!-- FIBER 3: Central-Lower Bundle (y: 20 to 100) -->
      <g transform="translate(0, 60)">
        <rect x="-240" y="-35" width="480" height="70" fill="url(#myoFiber)" stroke="#e11d48" stroke-width="1.5"/>
        
        <!-- CONTRACTION BANDS -->
        <rect x="-120" y="-35" width="28" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="-45" y="-35" width="32" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="35" y="-35" width="30" height="70" rx="4" fill="url(#bandGrad)"/>
        <rect x="110" y="-35" width="28" height="70" rx="4" fill="url(#bandGrad)"/>

        <!-- Lysed empty spaces -->
        <rect x="-90" y="-33" width="43" height="66" fill="#fff1f2" opacity="0.6"/>
        <rect x="-11" y="-33" width="44" height="66" fill="#fff1f2" opacity="0.6"/>
        <rect x="67" y="-33" width="41" height="66" fill="#fff1f2" opacity="0.6"/>
      </g>

      <!-- FIBER 4: Deep Bottom Bundle (y: 120 to 190) -->
      <g transform="translate(0, 155)">
        <rect x="-240" y="-30" width="480" height="60" fill="url(#myoFiber)" stroke="#e11d48" stroke-width="1.5"/>
        <rect x="-100" y="-30" width="24" height="60" rx="3" fill="url(#bandGrad)"/>
        <rect x="-30" y="-30" width="26" height="60" rx="3" fill="url(#bandGrad)"/>
        <rect x="50" y="-30" width="26" height="60" rx="3" fill="url(#bandGrad)"/>
      </g>

      <!-- Neutrophils invading ischemic interstitium -->
      <g fill="#4c1d95">
        <circle cx="-80" cy="5" r="3.5"/><circle cx="-75" cy="10" r="3.2"/><circle cx="-83" cy="12" r="3"/>
        <circle cx="80" cy="-85" r="3.5"/><circle cx="85" cy="-80" r="3.2"/><circle cx="77" cy="-78" r="3"/>
      </g>
    </g>
  </g>

  <!-- Pointers / Callouts -->
  <!-- Callout 1: Contraction Band Necrosis -->
  <g transform="translate(170, 160)">
    <circle cx="0" cy="0" r="16" fill="#be123c" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1</text>
    <line x1="20" y1="5" x2="250" y2="45" stroke="#be123c" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#fb7185">CONTRACTION BANDS</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Hyper-eosinophilic transverse clumped sarcomeres</text>
  </g>

  <!-- Callout 2: Adjacent Myofibrillar Lysis / Clearing -->
  <g transform="translate(790, 240)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2</text>
    <line x1="-20" y1="5" x2="-230" y2="40" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="25" y="-5" text-anchor="start" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8">MYOFIBRILLAR LYSIS</text>
    <text x="25" y="15" text-anchor="start" font-family="sans-serif" font-size="12" fill="#cbd5e1">Pale, empty, torn sarcomeric spaces</text>
  </g>

  <!-- Callout 3: Interstitial Hemorrhage -->
  <g transform="translate(170, 390)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">3</text>
    <line x1="20" y1="-5" x2="240" y2="-60" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="-15" y="-5" text-anchor="end" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#f87171">INTERSTITIAL HEMORRHAGE</text>
    <text x="-15" y="15" text-anchor="end" font-family="sans-serif" font-size="12" fill="#cbd5e1">Microvascular damage exacerbated by reperfusion</text>
  </g>

  <!-- Educational Concept Cards (Bottom) -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#fb7185">PATHOPHYSIOLOGY OF CONTRACTION BANDS</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Calcium Influx:</tspan> Reperfusion supplies fresh Ca2+ into</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">myocytes with membranes damaged by preceding ischemia.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Hypercontraction:</tspan> Sarcomeres tetanically contract &amp; snap.</text>
  </g>

  <g transform="translate(500, 560)">
    <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">CLINICAL SETTING: REPERFUSION INJURY</text>
    <text x="20" y="46" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#38bdf8">Triggers:</tspan> PCI (angioplasty), thrombolysis (tPA), CABG,</text>
    <text x="32" y="64" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">or spontaneous relief of coronary artery vasospasm.</text>
    <text x="20" y="84" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#4ade80">Diagnostic Rule:</tspan> Contraction bands = hallmark of <tspan font-weight="700" fill="#4ade80">reperfused</tspan> MI.</text>
  </g>

  <!-- Medicomm Watermark -->
  <text x="32" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" opacity="0.35" letter-spacing="1">medicomm</text>
</svg>
