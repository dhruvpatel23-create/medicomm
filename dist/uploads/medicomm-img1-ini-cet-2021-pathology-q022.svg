<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">MYOCARDIAL HISTOPATHOLOGY: ARTHRITIS &amp; MURMUR</text>
  </g>

  <!-- Histology Field -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="-372" y="-232" width="744" height="464" rx="16" fill="url(#fieldGrad)"/>

    <g clip-path="url(#myoClip)">
      <clipPath id="myoClip">
        <rect x="-372" y="-232" width="744" height="464" rx="16"/>
      </clipPath>

      <!-- Striated Cardiac Myocytes (Vertical bundles of eosinophilic muscle) -->
      <g transform="translate(-360, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(-265, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(-170, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(-75, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(20, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(115, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(210, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g><g transform="translate(305, 0)">
          <rect x="0" y="-235" width="70" height="470" fill="#f43f5e" opacity="0.65" stroke="#be123c" stroke-width="1"/>
          <!-- Nuclei of myocytes -->
          <ellipse cx="35" cy="-140" rx="10" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="30" rx="11" ry="6" fill="#4c1d95"/>
          <ellipse cx="35" cy="180" rx="10" ry="5.5" fill="#4c1d95"/>
        </g>

      <!-- Interstitial Granuloma: Aschoff Body (Center-right focal swelling) -->
      <g transform="translate(110, 10)">
        <!-- Central Fibrinoid Collagen Necrosis (Eosinophilic smudgy zone) -->
        <ellipse cx="0" cy="0" rx="90" ry="160" fill="#fb7185" opacity="0.75" stroke="#e11d48" stroke-width="2"/>
        
        <!-- Anitschkow Cells ("Caterpillar Cells" with wavy central chromatin ribbon) -->
        <g transform="translate(-30, -50)">
          <ellipse cx="0" cy="0" rx="22" ry="14" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
          <!-- Wavy chromatin ribbon -->
          <path d="M -12,0 Q -6,-5 0,0 T 12,0" stroke="#4c1d95" stroke-width="3" fill="none"/>
        </g>
        <g transform="translate(20, -10)">
          <ellipse cx="0" cy="0" rx="24" ry="15" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
          <path d="M -13,0 Q -6,-6 0,0 T 13,0" stroke="#4c1d95" stroke-width="3.5" fill="none"/>
        </g>
        <g transform="translate(-15, 60)">
          <ellipse cx="0" cy="0" rx="22" ry="14" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
          <path d="M -12,0 Q -6,-5 0,0 T 12,0" stroke="#4c1d95" stroke-width="3" fill="none"/>
        </g>

        <!-- Multinucleate Aschoff Giant Cell -->
        <g transform="translate(10, 110)">
          <ellipse cx="0" cy="0" rx="34" ry="20" fill="#f472b6" stroke="#9d174d" stroke-width="2"/>
          <circle cx="-16" cy="-4" r="5" fill="#4c1d95"/>
          <circle cx="-5" cy="4" r="5" fill="#4c1d95"/>
          <circle cx="8" cy="-3" r="5.5" fill="#4c1d95"/>
          <circle cx="18" cy="3" r="5" fill="#4c1d95"/>
        </g>

        <!-- Scattered Lymphocytes & Plasma cells -->
        <circle cx="-60" cy="-120" r="4.5" fill="#312e81"/><circle cx="-43" cy="-97" r="4.5" fill="#312e81"/><circle cx="-26" cy="-74" r="4.5" fill="#312e81"/><circle cx="-9" cy="-51" r="4.5" fill="#312e81"/><circle cx="8" cy="-28" r="4.5" fill="#312e81"/><circle cx="25" cy="-5" r="4.5" fill="#312e81"/><circle cx="42" cy="18" r="4.5" fill="#312e81"/><circle cx="59" cy="41" r="4.5" fill="#312e81"/><circle cx="-44" cy="64" r="4.5" fill="#312e81"/><circle cx="-27" cy="87" r="4.5" fill="#312e81"/><circle cx="-10" cy="110" r="4.5" fill="#312e81"/><circle cx="7" cy="-107" r="4.5" fill="#312e81"/><circle cx="24" cy="-84" r="4.5" fill="#312e81"/><circle cx="41" cy="-61" r="4.5" fill="#312e81"/><circle cx="58" cy="-38" r="4.5" fill="#312e81"/><circle cx="-45" cy="-15" r="4.5" fill="#312e81"/><circle cx="-28" cy="8" r="4.5" fill="#312e81"/><circle cx="-11" cy="31" r="4.5" fill="#312e81"/>
      </g>
    </g>

    <!-- Marker Arrow to Aschoff Nodule -->
    <g transform="translate(-60, 10)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Slim shaft arrow to Anitschkow cell -->
      <line x1="18" y1="0" x2="65" y2="0" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="76,0 62,-6 62,6" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>