<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <rect width="1000" height="750" fill="#030712"/>
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="barGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">DISTRIBUTION OF CD4 COUNT IN HIV PATIENTS</text>
  <text x="500" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">Frequency Histogram for Patient Cohort Analysis</text>

  <!-- Card Background -->
  <rect x="70" y="110" width="860" height="570" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Plot Area Boundaries: X from 170 to 890, Y from 170 to 570 (Height 400px = 40 units -> 10px per unit) -->
  <!-- Horizontal Grid Lines & Y-axis labels -->
  <!-- Y=40: y=170 -->
  <line x1="170" y1="170" x2="890" y2="170" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="176" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">40</text>

  <!-- Y=35: y=220 -->
  <line x1="170" y1="220" x2="890" y2="220" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">35</text>

  <!-- Y=30: y=270 -->
  <line x1="170" y1="270" x2="890" y2="270" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="276" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">30</text>

  <!-- Y=25: y=320 -->
  <line x1="170" y1="320" x2="890" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="326" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">25</text>

  <!-- Y=20: y=370 -->
  <line x1="170" y1="370" x2="890" y2="370" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="376" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">20</text>

  <!-- Y=15: y=420 -->
  <line x1="170" y1="420" x2="890" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="426" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">15</text>

  <!-- Y=10: y=470 -->
  <line x1="170" y1="470" x2="890" y2="470" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="476" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">10</text>

  <!-- Y=5: y=520 -->
  <line x1="170" y1="520" x2="890" y2="520" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="150" y="526" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">5</text>

  <!-- Y=0 Baseline: y=570 -->
  <line x1="170" y1="570" x2="890" y2="570" stroke="#475569" stroke-width="2"/>
  <text x="150" y="575" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">0</text>

  <!-- Y-axis Line -->
  <line x1="170" y1="570" x2="170" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="110" y="340" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 110 340)">Frequency</text>

  <!-- Histogram Bars (Contiguous, 6 bins of width 115px each) -->
  <!-- Bin 1: < 100, Freq = 5 (h = 50px, y = 520) -->
  <rect x="180" y="520" width="115" height="50" fill="url(#barGrad1)" stroke="#09090b" stroke-width="1.5"/>
  <text x="237.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">&lt; 100</text>

  <!-- Bin 2: 100-200, Freq = 10 (h = 100px, y = 470) -->
  <rect x="295" y="470" width="115" height="100" fill="url(#barGrad2)" stroke="#09090b" stroke-width="1.5"/>
  <text x="352.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">100–200</text>

  <!-- Bin 3: 200-300, Freq = 25 (h = 250px, y = 320) -->
  <rect x="410" y="320" width="115" height="250" fill="url(#barGrad3)" stroke="#09090b" stroke-width="1.5"/>
  <text x="467.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">200–300</text>

  <!-- Bin 4: 300-400, Freq = 35 (h = 350px, y = 220) -->
  <rect x="525" y="220" width="115" height="350" fill="url(#barGrad4)" stroke="#09090b" stroke-width="1.5"/>
  <text x="582.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">300–400</text>

  <!-- Bin 5: 400-500, Freq = 20 (h = 200px, y = 370) -->
  <rect x="640" y="370" width="115" height="200" fill="url(#barGrad5)" stroke="#09090b" stroke-width="1.5"/>
  <text x="697.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">400–500</text>

  <!-- Bin 6: > 500, Freq = 5 (h = 50px, y = 520) -->
  <rect x="755" y="520" width="115" height="50" fill="url(#barGrad6)" stroke="#09090b" stroke-width="1.5"/>
  <text x="812.5" y="598" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">&gt; 500</text>

  <!-- X-axis Label & Directional Arrow -->
  <g transform="translate(535, 642)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">CD4 Count (cells/µL)</text>
    <line x1="95" y1="-5" x2="165" y2="-5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Watermark -->
  
</svg>