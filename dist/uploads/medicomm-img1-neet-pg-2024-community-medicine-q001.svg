<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <rect width="1000" height="800" fill="#030712"/>
  <defs>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 2x2 Grid of White Card Panels -->
  <!-- Top Left: Panel 1 (Poshan Abhiyaan Motif) -->
  <g transform="translate(60, 50)" filter="url(#panelShadow)">
    <rect width="410" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Stylized Tree/Human growth motif -->
    <g transform="translate(205, 145)">
      <!-- Base green line -->
      <path d="M -50 70 Q 0 80 50 70" stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Green curving stem / body -->
      <path d="M 0 65 Q -10 10 20 -20 Q 35 -35 20 -50 Q -10 -20 -15 20 Q -18 50 0 65 Z" fill="#16a34a"/>
      <!-- Orange dynamic human figure & foliage -->
      <circle cx="15" cy="-70" r="14" fill="#ea580c"/>
      <path d="M -5 -30 C -25 -70, 20 -90, 45 -45 C 55 -25, 30 10, -5 -30 Z" fill="#f97316"/>
      <path d="M 40 -65 C 65 -65, 75 -40, 50 -35 Z" fill="#fb923c"/>
      <path d="M 35 -20 C 60 -15, 65 5, 40 5 Z" fill="#fb923c"/>
      <path d="M -25 -25 C -50 -30, -55 -5, -30 -5 Z" fill="#f97316"/>
    </g>
    <!-- Badge Label '1' -->
    <circle cx="205" cy="275" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="205" y="283" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">1</text>
  </g>

  <!-- Top Right: Panel 2 (NLEP Lotus & Hand Shelter Motif) -->
  <g transform="translate(530, 50)" filter="url(#panelShadow)">
    <rect width="410" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- NLEP Emblem: Three-petaled lotus held above hand forming house/shelter -->
    <g transform="translate(205, 130)">
      <!-- Three-petaled Lotus in reddish-brown / terracotta -->
      <!-- Center Petal -->
      <path d="M 0 -85 C 20 -60, 25 -20, 0 0 C -25 -20, -20 -60, 0 -85 Z" fill="#9a3412"/>
      <!-- Left Petal -->
      <path d="M -8 -15 C -45 -35, -60 -70, -40 -80 C -20 -80, -10 -40, -8 -15 Z" fill="#c2410c"/>
      <!-- Right Petal -->
      <path d="M 8 -15 C 45 -35, 60 -70, 40 -80 C 20 -80, 10 -40, 8 -15 Z" fill="#c2410c"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="#9a3412" stroke-width="4"/>

      <!-- Hand forming shelter / house shape below -->
      <!-- Forefinger and partially affected thumb forming arch -->
      <path d="M -75 70 L -75 25 L 0 5 L 75 25 L 75 70 L 60 70 L 60 40 L 0 22 L -60 40 L -60 70 Z" fill="#9a3412"/>
      <!-- Rising Sun with rays inside shelter -->
      <path d="M -30 65 A 30 30 0 0 1 30 65 Z" fill="#ea580c"/>
      <circle cx="-25" cy="55" r="2.5" fill="#fef08a"/>
      <circle cx="-15" cy="45" r="2.5" fill="#fef08a"/>
      <circle cx="0" cy="40" r="2.5" fill="#fef08a"/>
      <circle cx="15" cy="45" r="2.5" fill="#fef08a"/>
      <circle cx="25" cy="55" r="2.5" fill="#fef08a"/>
    </g>
    <!-- Badge Label '2' -->
    <circle cx="205" cy="275" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="205" y="283" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">2</text>
  </g>

  <!-- Bottom Left: Panel 3 (National Health Mission Red Arch & Family) -->
  <g transform="translate(60, 410)" filter="url(#panelShadow)">
    <rect width="410" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Red semicircular dome with family silhouette inside -->
    <g transform="translate(205, 135)">
      <!-- Red Arch -->
      <path d="M -130 60 A 130 110 0 0 1 130 60 Z" fill="#dc2626"/>
      <!-- Yellow Sun -->
      <circle cx="0" cy="-25" r="14" fill="#fbbf24"/>
      <!-- Sun rays -->
      <g stroke="#f59e0b" stroke-width="2.5">
        <line x1="0" y1="-45" x2="0" y2="-40"/>
        <line x1="14" y1="-39" x2="10" y2="-35"/>
        <line x1="20" y1="-25" x2="15" y2="-25"/>
        <line x1="14" y1="-11" x2="10" y2="-15"/>
        <line x1="0" y1="-5" x2="0" y2="-10"/>
        <line x1="-14" y1="-11" x2="-10" y2="-15"/>
        <line x1="-20" y1="-25" x2="-15" y2="-25"/>
        <line x1="-14" y1="-39" x2="-10" y2="-35"/>
      </g>
      <!-- White Silhouettes of Father, Child, Mother -->
      <!-- Father (Left) -->
      <circle cx="-65" cy="-5" r="11" fill="#ffffff"/>
      <path d="M -80 12 L -50 12 L -55 55 L -62 55 L -62 38 L -68 38 L -68 55 L -75 55 Z" fill="#ffffff"/>
      <!-- Child (Center) -->
      <circle cx="0" cy="18" r="8" fill="#ffffff"/>
      <polygon points="0,28 -15,55 15,55" fill="#ffffff"/>
      <!-- Mother (Right) -->
      <circle cx="65" cy="-2" r="11" fill="#ffffff"/>
      <polygon points="65,12 45,55 85,55" fill="#ffffff"/>
    </g>
    <!-- Badge Label '3' -->
    <circle cx="205" cy="275" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="205" y="283" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">3</text>
  </g>

  <!-- Bottom Right: Panel 4 (Ayushman Bharat Emblem) -->
  <g transform="translate(530, 410)" filter="url(#panelShadow)">
    <rect width="410" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Lotus petals above seated yogic human support -->
    <g transform="translate(205, 140)">
      <!-- Green Lotus Petals radiating upward -->
      <path d="M 0 -80 C 25 -55, 30 -20, 0 0 C -30 -20, -25 -55, 0 -80 Z" fill="#84cc16"/>
      <path d="M -10 -5 C -45 -25, -65 -60, -45 -70 C -25 -70, -15 -35, -10 -5 Z" fill="#22c55e"/>
      <path d="M 10 -5 C 45 -25, 65 -60, 45 -70 C 25 -70, 15 -35, 10 -5 Z" fill="#22c55e"/>
      <path d="M -15 0 C -60 -5, -95 -25, -80 -40 C -65 -45, -35 -20, -15 0 Z" fill="#15803d"/>
      <path d="M 15 0 C 60 -5, 95 -25, 80 -40 C 65 -45, 35 -20, 15 0 Z" fill="#15803d"/>
      <!-- Saffron/Orange Human Base (Head and supportive arms/legs) -->
      <circle cx="0" cy="15" r="14" fill="#ea580c"/>
      <path d="M -35 35 L 35 35 L 20 55 L -20 55 Z" fill="#ea580c"/>
      <ellipse cx="-25" cy="65" rx="20" ry="9" fill="#ea580c"/>
      <ellipse cx="25" cy="65" rx="20" ry="9" fill="#ea580c"/>
    </g>
    <!-- Badge Label '4' -->
    <circle cx="205" cy="275" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="205" y="283" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">4</text>
  </g>

  <!-- Watermark -->
  
</svg>