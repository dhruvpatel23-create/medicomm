<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <rect width="1000" height="750" fill="#030712"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Left: Modifying Factors -->
  <!-- Top Box: Demographic Variables -->
  <rect x="40" y="80" width="220" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="150" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">DEMOGRAPHIC</text>
  <text x="150" y="148" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">VARIABLES</text>
  <text x="150" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">class, gender, age, etc.</text>

  <!-- Bottom Box: Psychological Characteristics -->
  <rect x="40" y="440" width="220" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="150" y="480" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PSYCHOLOGICAL</text>
  <text x="150" y="503" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CHARACTERISTICS</text>
  <text x="150" y="530" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">personality, peer</text>
  <text x="150" y="546" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">group pressure, etc.</text>

  <!-- Left Bracket grouping the two boxes -->
  <path d="M 270 135 C 290 135, 290 315, 305 315 C 290 315, 290 495, 270 495" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Arrows from Left Bracket to Center Sections -->
  <!-- Upper Arrow to Individual Perceptions -->
  <path d="M 305 315 C 330 315, 330 160, 360 160" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Middle Arrow to Box C -->
  <path d="M 305 315 L 390 315" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <!-- Lower Arrow to Barriers/Benefits -->
  <path d="M 305 315 C 330 315, 330 470, 360 470" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center-Top: Perceived Susceptibility & Severity -->
  <rect x="400" y="80" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="520" y="116" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Perceived susceptibility</text>

  <rect x="400" y="160" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="520" y="196" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Perceived severity</text>

  <!-- Bracket for Top Group -->
  <path d="M 385 110 C 375 110, 375 150, 365 150 C 375 150, 375 190, 385 190" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 655 110 C 665 110, 665 150, 675 150 C 665 150, 665 190, 655 190" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Center: TARGET BOX C (Highlighted with Gold, clearly labeled 'C') -->
  <rect x="400" y="275" width="240" height="80" rx="10" fill="#1e1b4b" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
  <text x="520" y="328" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle">C</text>

  <!-- Center-Bottom: Perceived Benefits & Barriers -->
  <rect x="400" y="390" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="520" y="426" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Perceived benefits</text>

  <rect x="400" y="470" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="520" y="506" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Perceived barriers</text>

  <!-- Bracket for Bottom Group -->
  <path d="M 385 420 C 375 420, 375 460, 365 460 C 375 460, 375 500, 385 500" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 655 420 C 665 420, 665 460, 675 460 C 665 460, 665 500, 655 500" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Right: Action Box -->
  <rect x="760" y="275" width="190" height="80" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="855" y="323" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Action</text>

  <!-- Connectors into Action -->
  <path d="M 675 150 C 715 150, 725 300, 755 305" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 640 315 L 750 315" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <path d="M 675 460 C 715 460, 725 330, 755 325" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right-Bottom: Cues to Action -->
  <rect x="760" y="470" width="190" height="70" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="855" y="512" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Cues to action</text>
  <path d="M 855 470 L 855 365" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Watermark -->
  <text x="40" y="720" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>