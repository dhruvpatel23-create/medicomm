<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">VIRAL REPLICATION CYCLE</text>
  <text x="500" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Icosahedral Enveloped dsDNA Virus Replication Pathway</text>

  <!-- Host Cell Boundary -->
  <rect x="70" y="130" width="860" height="790" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="120" y="170" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">HOST CELL CYTOPLASM</text>

  <!-- Host Nucleus Boundary -->
  <ellipse cx="500" cy="510" rx="260" ry="220" fill="#020617" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10 5"/>
  <text x="500" y="340" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">HOST CELL NUCLEUS</text>

  <!-- Step 1: Virion Attachment and Fusion -->
  <g transform="translate(150, 240)">
    <!-- Virion -->
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <polygon points="0,-18 16,-6 16,14 0,24 -16,14 -16,-6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="55" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">1. Attachment &amp; Entry</text>
  </g>
  <path d="M 180 250 L 270 320" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Capsid Delivery to Nuclear Pore -->
  <g transform="translate(290, 360)">
    <polygon points="0,-18 16,-6 16,14 0,24 -16,14 -16,-6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-40" y="45" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">2. Nuclear Docking</text>
  </g>
  <path d="M 310 380 L 380 430" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: DNA Circularization & Transcription Cascade in Nucleus -->
  <g transform="translate(500, 480)">
    <!-- Circular dsDNA -->
    <circle cx="0" cy="-20" r="45" fill="none" stroke="#facc15" stroke-width="4"/>
    <text x="0" y="-15" text-anchor="middle" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">dsDNA</text>
    
    <!-- Transcription Cascade Box -->
    <rect x="-150" y="40" width="300" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="65" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">TRANSCRIPTION CASCADE</text>
    <text x="0" y="88" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#945; (Immediate-Early) &#8594; Regulatory</text>
    <text x="0" y="108" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#946; (Early) &#8594; DNA Polymerase / TK</text>
    <text x="0" y="126" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#947; (Late) &#8594; Structural Proteins</text>
  </g>

  <!-- Step 4: Assembly & Nuclear Egress -->
  <path d="M 640 450 L 720 380" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(730, 360)">
    <polygon points="0,-18 16,-6 16,14 0,24 -16,14 -16,-6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">4. Capsid Assembly</text>
  </g>

  <!-- Step 5: Golgi Envelopment & Exocytosis -->
  <path d="M 760 380 L 820 480" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(820, 530)">
    <!-- Virion in vesicle -->
    <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <polygon points="0,-18 16,-6 16,14 0,24 -16,14 -16,-6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="55" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">5. Envelopment &amp; Release</text>
  </g>

  <!-- Subtle medicomm watermark -->
  <text x="40" y="970" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>