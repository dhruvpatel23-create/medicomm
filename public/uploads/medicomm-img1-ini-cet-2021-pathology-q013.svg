<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 40)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">G-BANDED CYTOGENETIC KARYOGRAM</text>
  </g>

  <!-- Karyotype Grid Container -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-420" y="-250" width="840" height="500" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <rect x="-412" y="-242" width="824" height="484" rx="12" fill="#ffffff"/>

    <!-- Chromosome Rendering Helper -->
    <!-- Row 1: Pairs 1 - 5 -->
    <g transform="translate(-340, -180)">
        <!-- Chromosome A -->
        <g transform="translate(-10, 0)">
          <line x1="0" y1="-55" x2="0" y2="55" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Chromosome B -->
        <g transform="translate(10, 0)">
          <line x1="0" y1="-55" x2="0" y2="55" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <text x="0" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">1</text>
      </g><g transform="translate(-175, -180)">
        <!-- Chromosome A -->
        <g transform="translate(-10, 0)">
          <line x1="0" y1="-52" x2="0" y2="52" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Chromosome B -->
        <g transform="translate(10, 0)">
          <line x1="0" y1="-52" x2="0" y2="52" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <text x="0" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">2</text>
      </g><g transform="translate(-10, -180)">
        <!-- Chromosome A -->
        <g transform="translate(-10, 0)">
          <line x1="0" y1="-46" x2="0" y2="46" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Chromosome B -->
        <g transform="translate(10, 0)">
          <line x1="0" y1="-46" x2="0" y2="46" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <text x="0" y="66" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">3</text>
      </g><g transform="translate(155, -180)">
        <!-- Chromosome A -->
        <g transform="translate(-10, 0)">
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Chromosome B -->
        <g transform="translate(10, 0)">
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">4</text>
      </g><g transform="translate(320, -180)">
        <!-- Chromosome A -->
        <g transform="translate(-10, 0)">
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Chromosome B -->
        <g transform="translate(10, 0)">
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
          <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ffffff" stroke-width="3"/>
          <line x1="-4" y1="12" x2="4" y2="12" stroke="#ffffff" stroke-width="3"/>
        </g>
        <text x="0" y="62" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">5</text>
      </g>

    <!-- Row 2: Pairs 6 - 12 -->
    <g transform="translate(-350, -60)">
        <line x1="-7" y1="-36" x2="-7" y2="36" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-36" x2="7" y2="36" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="54" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">6</text>
      </g><g transform="translate(-234, -60)">
        <line x1="-7" y1="-34.5" x2="-7" y2="34.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-34.5" x2="7" y2="34.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="52.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">7</text>
      </g><g transform="translate(-118, -60)">
        <line x1="-7" y1="-33" x2="-7" y2="33" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-33" x2="7" y2="33" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="51" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">8</text>
      </g><g transform="translate(-2, -60)">
        <line x1="-7" y1="-31.5" x2="-7" y2="31.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-31.5" x2="7" y2="31.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="49.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">9</text>
      </g><g transform="translate(114, -60)">
        <line x1="-7" y1="-30" x2="-7" y2="30" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-30" x2="7" y2="30" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">10</text>
      </g><g transform="translate(230, -60)">
        <line x1="-7" y1="-28.5" x2="-7" y2="28.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-28.5" x2="7" y2="28.5" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="46.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">11</text>
      </g><g transform="translate(346, -60)">
        <line x1="-7" y1="-27" x2="-7" y2="27" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="7" y1="-27" x2="7" y2="27" stroke="#334155" stroke-width="6.5" stroke-linecap="round"/>
        <text x="0" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">12</text>
      </g>

    <!-- Row 3: Pairs 13 - 18 -->
    <g transform="translate(-340, 50)">
        <line x1="-6" y1="-30" x2="-6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-30" x2="6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">13</text>
      </g><g transform="translate(-205, 50)">
        <line x1="-6" y1="-30" x2="-6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-30" x2="6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">14</text>
      </g><g transform="translate(-70, 50)">
        <line x1="-6" y1="-30" x2="-6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-30" x2="6" y2="30" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">15</text>
      </g><g transform="translate(65, 50)">
        <line x1="-6" y1="-25" x2="-6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-25" x2="6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">16</text>
      </g><g transform="translate(200, 50)">
        <line x1="-6" y1="-25" x2="-6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-25" x2="6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">17</text>
      </g><g transform="translate(335, 50)">
        <line x1="-6" y1="-25" x2="-6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="6" y1="-25" x2="6" y2="25" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <text x="0" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">18</text>
      </g>

    <!-- Row 4: Pairs 19 - 22 and Sex Chromosomes (XXY) -->
    <g transform="translate(-340, 150)">
        <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="6" y1="-20" x2="6" y2="20" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">19</text>
      </g><g transform="translate(-230, 150)">
        <line x1="-6" y1="-20" x2="-6" y2="20" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="6" y1="-20" x2="6" y2="20" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <text x="0" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">20</text>
      </g><g transform="translate(-120, 150)">
        <line x1="-6" y1="-16" x2="-6" y2="16" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="6" y1="-16" x2="6" y2="16" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <text x="0" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">21</text>
      </g><g transform="translate(-10, 150)">
        <line x1="-6" y1="-16" x2="-6" y2="16" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="6" y1="-16" x2="6" y2="16" stroke="#334155" stroke-width="5.5" stroke-linecap="round"/>
        <text x="0" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">22</text>
      </g>

    <!-- Highlight Box for Sex Chromosomes XXY -->
    <g transform="translate(260, 150)">
      <rect x="-100" y="-45" width="200" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
      <!-- First X Chromosome -->
      <g transform="translate(-50, 0)">
        <line x1="0" y1="-32" x2="0" y2="32" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
        <line x1="-3" y1="-5" x2="3" y2="-5" stroke="#ffffff" stroke-width="2.5"/>
      </g>
      <!-- Second X Chromosome -->
      <g transform="translate(-20, 0)">
        <line x1="0" y1="-32" x2="0" y2="32" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
        <line x1="-3" y1="-5" x2="3" y2="-5" stroke="#ffffff" stroke-width="2.5"/>
      </g>
      <text x="-35" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#dc2626">X (two)</text>

      <!-- Y Chromosome (Short acrocentric) -->
      <g transform="translate(45, 8)">
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
      </g>
      <text x="45" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#dc2626">Y</text>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>