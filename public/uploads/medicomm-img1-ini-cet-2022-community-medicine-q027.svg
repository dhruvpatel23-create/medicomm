<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#030712"/>
  <defs>
    <filter id="mathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Mathematical Display Card -->
  <rect x="180" y="100" width="640" height="500" rx="20" fill="#0b1329" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Formula Elements Group -->
  <g transform="translate(230, 160)" filter="url(#mathGlow)">
    <!-- Radical Symbol (Square Root): Left check, deep v, top overline -->
    <path d="M 0 310 L 45 380 L 110 50 L 520 50" fill="none" stroke="#f8fafc" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inside Radical: Numerator, Fraction Bar, Denominator -->
    <!-- Large Summation Symbol Sigma (Σ) -->
    <path d="M 155 110 L 210 110 L 175 160 L 210 210 L 155 210" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- (x - x̄)² -->
    <!-- Open parenthesis -->
    <text x="225" y="195" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="95" font-weight="400">(</text>
    <!-- x -->
    <text x="260" y="185" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="80" font-style="italic">x</text>
    <!-- Minus sign -->
    <text x="315" y="180" fill="#38bdf8" font-family="'Cambria Math', 'Times New Roman', serif" font-size="75">−</text>
    <!-- x with bar (x̄) -->
    <text x="370" y="185" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="80" font-style="italic">x</text>
    <line x1="370" y1="118" x2="410" y2="118" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <!-- Close parenthesis -->
    <text x="420" y="195" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="95" font-weight="400">)</text>
    <!-- Exponent 2 -->
    <text x="460" y="130" fill="#38bdf8" font-family="'Cambria Math', 'Times New Roman', serif" font-size="52" font-weight="700">2</text>

    <!-- Fraction Bar -->
    <line x1="145" y1="240" x2="495" y2="240" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>

    <!-- Denominator: n - 1 -->
    <text x="250" y="325" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="80" font-style="italic">n</text>
    <text x="310" y="320" fill="#38bdf8" font-family="'Cambria Math', 'Times New Roman', serif" font-size="75">−</text>
    <text x="365" y="325" fill="#f8fafc" font-family="'Cambria Math', 'Times New Roman', serif" font-size="80">1</text>
  </g>

  <!-- Watermark -->
  <text x="40" y="670" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>