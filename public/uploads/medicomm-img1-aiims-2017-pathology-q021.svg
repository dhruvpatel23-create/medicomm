<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="85%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <radialGradient id="kwGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="70%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  
  <g transform="translate(480, 48)">
    <rect x="-370" y="-24" width="740" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">RENAL GLOMERULUS: DIABETIC NEPHROPATHY (PAS STAIN)</text>
  </g>
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="280" fill="url(#fieldGrad)" stroke="#334155" stroke-width="8"/>
    <clipPath id="c21"><circle cx="0" cy="0" r="276"/></clipPath>
    <g clip-path="url(#c21)">
      <!-- Bowman's Capsule -->
      <circle cx="0" cy="0" r="240" fill="none" stroke="#be123c" stroke-width="3"/>
      
      <!-- Nodular Intercapillary Glomerulosclerosis (KW Nodules - Spherical, Acellular, PAS+) -->
      <g transform="translate(-70, -40)">
        <circle cx="0" cy="0" r="52" fill="url(#kwGrad)" stroke="#831843" stroke-width="3"/>
        <path d="M -30,-10 C -20,-30 20,-30 30,-10 C 35,15 15,35 -10,35" stroke="#fbcfe8" stroke-width="2.5" fill="none" opacity="0.8"/>
      </g>
      <g transform="translate(60, 40)">
        <circle cx="0" cy="0" r="50" fill="url(#kwGrad)" stroke="#831843" stroke-width="3"/>
      </g>
      <!-- Compressed peripheral capillary loop (Microaneurysm) -->
      <ellipse cx="120" cy="-50" rx="35" ry="25" fill="#fda4af" stroke="#be123c" stroke-width="2.5"/>
    </g>
  </g>
  
  <g transform="translate(220, 240)">
    <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Acellular KW Nodule</text>
    <path d="M 138,0 L 180,70" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="180" cy="70" r="6" fill="#fde047"/>
  </g>
  
</svg>