<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(100, 60)">
    <!-- 2x2 Grid of Audiological & Otological Rehabilitation Hardware -->
    
    <!-- Quadrant 1: Cranial Coupling Sound Transducer Appliance - TARGET DEVICE 1 -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="420" height="340" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Numbered Badge 1 -->
      <circle cx="45" cy="45" r="22" fill="#e11d48" stroke="#f43f5e" stroke-width="2.5"/>
      <text x="45" y="53" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
      
      <!-- Percutaneous Appliance Components: Sound Processor + Snap Abutment + Titanium Fixture -->
      <g transform="translate(200, 160)">
        <!-- External Sound Processor Unit -->
        <rect x="-80" y="-70" width="130" height="110" rx="20" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
        <circle cx="-15" cy="-15" r="24" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Volume / Program Button -->
        <rect x="35" y="-30" width="12" height="30" rx="4" fill="#64748b"/>
        
        <!-- Coupling Abutment -->
        <rect x="50" y="-12" width="30" height="24" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
        
        <!-- Threaded Titanium Bone Fixture (Osseointegrated Screw) -->
        <polygon points="80,-8 130,-12 135,12 80,8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
        <line x1="90" y1="-9" x2="90" y2="9" stroke="#64748b" stroke-width="2"/>
        <line x1="105" y1="-10" x2="105" y2="10" stroke="#64748b" stroke-width="2"/>
        <line x1="120" y1="-11" x2="120" y2="11" stroke="#64748b" stroke-width="2"/>
      </g>
    </g>

    <!-- Quadrant 2: Auditory Neural Stimulator - DEVICE 2 -->
    <g transform="translate(520, 40)">
      <rect x="0" y="0" width="420" height="340" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Numbered Badge 2 -->
      <circle cx="45" cy="45" r="22" fill="#3b82f6" stroke="#60a5fa" stroke-width="2.5"/>
      <text x="45" y="53" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">2</text>

      <!-- Internal Stimulator & Curled Electrode -->
      <g transform="translate(180, 150)">
        <!-- Hermetic Ceramic/Silicone Package -->
        <circle cx="0" cy="0" r="55" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
        <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Flexible Electrode Lead -->
        <path d="M 0 55 C 20 110, 80 120, 110 80 C 130 50, 100 20, 75 40 C 60 55, 75 75, 90 70" 
              fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
        <!-- Individual Contact Rings -->
        <circle cx="108" cy="78" r="3.5" fill="#f8fafc"/>
        <circle cx="95" cy="50" r="3.5" fill="#f8fafc"/>
        <circle cx="78" cy="45" r="3.5" fill="#f8fafc"/>
      </g>
    </g>

    <!-- Quadrant 3: Stapedectomy Piston Prosthesis - DEVICE 3 -->
    <g transform="translate(60, 400)">
      <rect x="0" y="0" width="420" height="340" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Numbered Badge 3 -->
      <circle cx="45" cy="45" r="22" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
      <text x="45" y="53" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">3</text>

      <!-- Micro-Piston Hardware (Hook + Shaft) -->
      <g transform="translate(210, 160)">
        <!-- Crimping Hook (Platinum/Titanium Ribbon) -->
        <path d="M -30 -60 C -10 -90, 40 -70, 30 -30 C 25 -10, 0 -20, 0 0" 
              fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
        <!-- Piston Shaft (Teflon/Fluoroplastic Cylinder) -->
        <rect x="-8" y="0" width="16" height="90" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      </g>
    </g>

    <!-- Quadrant 4: Partial Ossicular Replacement Prosthesis (PORP) - DEVICE 4 -->
    <g transform="translate(520, 400)">
      <rect x="0" y="0" width="420" height="340" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Numbered Badge 4 -->
      <circle cx="45" cy="45" r="22" fill="#f59e0b" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="45" y="53" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">4</text>

      <!-- PORP Hardware (Top Head Plate + Hollow Shaft) -->
      <g transform="translate(210, 150)">
        <!-- Perforated Titanium Head Plate -->
        <ellipse cx="0" cy="-40" rx="55" ry="24" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
        <circle cx="-25" cy="-40" r="6" fill="#0f172a"/>
        <circle cx="0" cy="-40" r="6" fill="#0f172a"/>
        <circle cx="25" cy="-40" r="6" fill="#0f172a"/>
        <!-- Central Hollow Shaft to receive stapes capitulum -->
        <rect x="-10" y="-18" width="20" height="85" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
        <ellipse cx="0" cy="67" rx="12" ry="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
      </g>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>