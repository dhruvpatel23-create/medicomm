<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">ONCOGENIC VIRAL GENOME</text>
  <text x="500" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Human Papillomavirus Circular Double-Stranded DNA Map (~8 kb)</text>

  <!-- Circular Genome Map Center -->
  <g transform="translate(500, 360)">
    <!-- Base Circular Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1e293b" stroke-width="32"/>

    <!-- LCR (Long Control Region / URR) -->
    <path d="M -30 -157 A 160 160 0 0 1 30 -157" fill="none" stroke="#64748b" stroke-width="32"/>
    <text x="0" y="-180" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">LCR (URR)</text>

    <!-- Early Gene: E6 (Oncogene - Red) -->
    <path d="M 35 -156 A 160 160 0 0 1 95 -128" fill="none" stroke="#dc2626" stroke-width="32"/>
    <text x="85" y="-155" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">E6</text>

    <!-- Early Gene: E7 (Oncogene - Red) -->
    <path d="M 100 -124 A 160 160 0 0 1 145 -65" fill="none" stroke="#dc2626" stroke-width="32"/>
    <text x="145" y="-105" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">E7</text>

    <!-- Early Gene: E1 (Replication helicase - Blue) -->
    <path d="M 148 -58 A 160 160 0 0 1 158 50" fill="none" stroke="#0284c7" stroke-width="32"/>
    <text x="175" y="0" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">E1</text>

    <!-- Early Gene: E2 (Transcriptional regulator - Cyan) -->
    <path d="M 155 58 A 160 160 0 0 1 115 110" fill="none" stroke="#06b6d4" stroke-width="32"/>
    <text x="148" y="95" text-anchor="middle" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">E2</text>

    <!-- Early Gene: E4 / E5 (Green) -->
    <path d="M 108 116 A 160 160 0 0 1 50 152" fill="none" stroke="#10b981" stroke-width="32"/>
    <text x="88" y="150" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">E4/E5</text>

    <!-- Late Gene: L2 (Minor capsid - Orange) -->
    <path d="M 40 155 A 160 160 0 0 1 -75 141" fill="none" stroke="#f97316" stroke-width="32"/>
    <text x="-20" y="165" text-anchor="middle" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">L2</text>

    <!-- Late Gene: L1 (Major capsid - Yellow) -->
    <path d="M -82 136 A 160 160 0 0 1 -140 -75" fill="none" stroke="#eab308" stroke-width="32"/>
    <text x="-155" y="30" text-anchor="middle" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">L1</text>

    <!-- Center Label -->
    <text x="0" y="-10" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">HPV dsDNA</text>
    <text x="0" y="15" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">~7,900 bp</text>
  </g>

  <!-- Molecular Mechanisms of E6 and E7 (Bottom Infographic) -->
  <g transform="translate(80, 580)">
    <!-- E6 Box -->
    <rect x="0" y="0" width="400" height="280" rx="14" fill="#0f172a" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="15" y="15" width="70" height="34" rx="6" fill="#dc2626"/>
    <text x="50" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">E6</text>
    <text x="100" y="38" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">PRIMARY ONCOGENE</text>

    <line x1="20" y1="65" x2="380" y2="65" stroke="#1e293b" stroke-width="2"/>
    <text x="25" y="100" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">&#8226; Binds to p53 Tumor Suppressor</text>
    <text x="25" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Recruits E6AP ubiquitin-protein ligase</text>
    <text x="25" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">&#8594; <tspan fill="#fca5a5" font-weight="700">Ubiquitination &amp; Proteasomal Degradation</tspan></text>
    <text x="25" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">&#8226; Activates Telomerase (hTERT)</text>
    <text x="25" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Prevents apoptosis &amp; confers cellular immortality</text>
    <rect x="25" y="240" width="350" height="26" rx="4" fill="#450a0a"/>
    <text x="200" y="258" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">INHIBITS p53 APOPTOTIC PATHWAY</text>
  </g>

  <g transform="translate(520, 580)">
    <!-- E7 Box -->
    <rect x="0" y="0" width="400" height="280" rx="14" fill="#0f172a" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="15" y="15" width="70" height="34" rx="6" fill="#dc2626"/>
    <text x="50" y="39" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">E7</text>
    <text x="100" y="38" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">PRIMARY ONCOGENE</text>

    <line x1="20" y1="65" x2="380" y2="65" stroke="#1e293b" stroke-width="2"/>
    <text x="25" y="100" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">&#8226; Binds to Hypophosphorylated pRb</text>
    <text x="25" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Displaces E2F transcription factor from pRb</text>
    <text x="25" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">&#8594; <tspan fill="#fca5a5" font-weight="700">Constitutive E2F release &amp; S-phase entry</tspan></text>
    <text x="25" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">&#8226; Inhibits CDK inhibitors (p21, p27)</text>
    <text x="25" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Drives cell cycle progression past G1/S checkpoint</text>
    <rect x="25" y="240" width="350" height="26" rx="4" fill="#450a0a"/>
    <text x="200" y="258" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">INACTIVATES RETINOBLASTOMA PROTEIN (pRb)</text>
  </g>

  <!-- Subtle medicomm watermark -->
  <text x="40" y="970" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>