<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <rect width="1000" height="800" fill="#030712"/>
  <defs>
    <!-- Pie slice shading -->
    <linearGradient id="pieBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="pieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Top Left: Pie 1 (Center: 270, 200, Radius: 105) -->
  <!-- B slice: Right half (from 0 to 180 deg) -->
  <g transform="translate(270, 200)" filter="url(#pieShadow)">
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Slice B: (180 deg, right half) -->
    <path d="M 0 -105 A 105 105 0 0 1 0 105 Z" fill="url(#pieBlue)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Slice A: top left quadrant -->
    <path d="M 0 -105 A 105 105 0 0 0 -105 0 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Slice C: bottom left quadrant -->
    <path d="M -105 0 A 105 105 0 0 0 0 105 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Labels -->
    <text x="-48" y="-40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">A</text>
    <text x="-48" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">C</text>
    <text x="50" y="8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">B</text>
  </g>

  <!-- Top Right: Pie 2 (Center: 730, 200, Radius: 105) -->
  <g transform="translate(730, 200)" filter="url(#pieShadow)">
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Slice C: top left -->
    <path d="M 0 -105 A 105 105 0 0 0 -105 0 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Slice D: top right -->
    <path d="M 0 -105 A 105 105 0 0 1 105 0 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Slice A: bottom right -->
    <path d="M 105 0 A 105 105 0 0 1 0 105 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Slice B: bottom left -->
    <path d="M -105 0 A 105 105 0 0 0 0 105 L 0 0 Z" fill="url(#pieBlue)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Labels -->
    <text x="-48" y="-40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">C</text>
    <text x="48" y="-40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">D</text>
    <text x="48" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">A</text>
    <text x="-48" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">B</text>
  </g>

  <!-- Middle Center: Pie 3 (Center: 500, 390, Radius: 105) -->
  <g transform="translate(500, 390)" filter="url(#pieShadow)">
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Slice B: top left quadrant (90 deg) -->
    <path d="M 0 -105 A 105 105 0 0 0 -105 0 L 0 0 Z" fill="url(#pieBlue)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Slice C: top right quadrant -->
    <path d="M 0 -105 A 105 105 0 0 1 105 0 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Slice D: bottom right quadrant -->
    <path d="M 105 0 A 105 105 0 0 1 0 105 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Slices E & F: in bottom left quadrant -->
    <path d="M 0 105 A 105 105 0 0 1 -74.2 74.2 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M -74.2 74.2 A 105 105 0 0 1 -105 0 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Labels -->
    <text x="-48" y="-40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">B</text>
    <text x="48" y="-40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">C</text>
    <text x="48" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">D</text>
    <text x="-32" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">E</text>
    <text x="-68" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">F</text>
  </g>

  <!-- Bottom Left: Pie 4 (Center: 270, 580, Radius: 105) -->
  <g transform="translate(270, 580)" filter="url(#pieShadow)">
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <path d="M 0 -105 A 105 105 0 0 0 -105 0 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Slice B: from (-105, 0) to (-74.2, 74.2) -->
    <path d="M -105 0 A 105 105 0 0 0 -74.2 74.2 L 0 0 Z" fill="url(#pieBlue)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M -74.2 74.2 A 105 105 0 0 0 0 105 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M 0 105 A 105 105 0 0 0 105 0 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 105 0 A 105 105 0 0 0 74.2 -74.2 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M 74.2 -74.2 A 105 105 0 0 0 0 -105 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Labels -->
    <text x="-48" y="-40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">C</text>
    <text x="-68" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" text-anchor="middle">B</text>
    <text x="-32" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">G</text>
    <text x="48" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">A</text>
    <text x="68" y="-22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">F</text>
    <text x="32" y="-62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">E</text>
  </g>

  <!-- Bottom Right: Pie 5 (Center: 730, 580, Radius: 105) -->
  <g transform="translate(730, 580)" filter="url(#pieShadow)">
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Slice B: top left quadrant -->
    <path d="M 0 -105 A 105 105 0 0 0 -105 0 L 0 0 Z" fill="url(#pieBlue)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Slice E: bottom left quadrant -->
    <path d="M -105 0 A 105 105 0 0 0 0 105 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Right side slices -->
    <path d="M 0 -105 A 105 105 0 0 1 80 -65 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M 80 -65 A 105 105 0 0 1 95 40 L 0 0 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 95 40 A 105 105 0 0 1 0 105 L 0 0 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Labels -->
    <text x="-48" y="-40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">B</text>
    <text x="-48" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">E</text>
    <text x="35" y="-55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">A</text>
    <text x="65" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">F</text>
  </g>

  <!-- Watermark -->
  <text x="40" y="770" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>