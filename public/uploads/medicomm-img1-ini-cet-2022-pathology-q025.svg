<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">MEDICAL INSTRUMENT: BONE MARROW BIOPSY</text>
  </g>

  <!-- Klima Needle Instrument (Rotated horizontally across canvas) -->
  <g transform="translate(480, 350)" filter="url(#shadow)">
    <!-- Main Needle Shaft (Stainless Steel with bevel tip at left) -->
    <polygon points="-320,0 -290,-7 -290,7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-290" y="-6" width="280" height="12" fill="url(#metalGrad)" stroke="#475569" stroke-width="1"/>

    <!-- Adjustable Guard / Depth Collar with Locking Side Screw (Pathognomonic feature of Klima needle) -->
    <g transform="translate(-160, 0)">
      <!-- Main guard cylinder -->
      <rect x="-20" y="-18" width="40" height="36" rx="4" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>
      <!-- Knurled grip lines -->
      <line x1="-12" y1="-16" x2="-12" y2="16" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#475569" stroke-width="2"/>
      <line x1="12" y1="-16" x2="12" y2="16" stroke="#475569" stroke-width="2"/>
      <!-- Side lock screw protruding upwards -->
      <rect x="-8" y="-38" width="16" height="20" rx="3" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="0" cy="-38" rx="16" ry="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Hub Assembly -->
    <g transform="translate(40, 0)">
      <polygon points="-10,-12 60,-24 60,24 -10,12" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Stylet Handle with Locking Cap at Right -->
    <g transform="translate(130, 0)">
      <rect x="0" y="-30" width="70" height="60" rx="8" fill="url(#metalGrad)" stroke="#334155" stroke-width="2.5"/>
      <ellipse cx="70" cy="0" rx="12" ry="24" fill="#64748b" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Feature Pointer to Adjustable Guard -->
    <g transform="translate(-160, -90)">
      <circle cx="0" cy="0" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#000000">!</text>
      <line x1="0" y1="16" x2="0" y2="40" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="0,48 -5,36 5,36" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>