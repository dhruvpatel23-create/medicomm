<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="85%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  
  <g transform="translate(480, 48)">
    <rect x="-360" y="-24" width="720" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">ESOPHAGEAL BIOPSY: EPITHELIAL TRANSITION (H&amp;E)</text>
  </g>
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="280" fill="url(#fieldGrad)" stroke="#334155" stroke-width="8"/>
    <clipPath id="c23"><circle cx="0" cy="0" r="276"/></clipPath>
    <g clip-path="url(#c23)">
      <!-- Left Half: Normal Stratified Squamous Epithelium -->
      <path d="M -280,-280 L 0,-280 L 0,280 L -280,280 Z" fill="#fda4af" opacity="0.7"/>
      <!-- Squamous layers -->
      <line x1="-280" y1="-100" x2="0" y2="-100" stroke="#f43f5e" stroke-width="2"/>
      <line x1="-280" y1="0" x2="0" y2="0" stroke="#f43f5e" stroke-width="2"/>
      <line x1="-280" y1="100" x2="0" y2="100" stroke="#f43f5e" stroke-width="2"/>
      
      <!-- Right Half: Intestinal Metaplasia with Columnar Cells & Blue Goblet Cells -->
      <path d="M 0,-280 L 280,-280 L 280,280 L 0,280 Z" fill="#ffe4e6"/>
      <!-- Glandular crypts with Goblet Cells -->
      <g stroke="#db2777" stroke-width="3" fill="none">
        <path d="M 40,-200 C 90,-200 90,-50 40,-50"/>
        <path d="M 120,-180 C 180,-180 180,-30 120,-30"/>
        <path d="M 50,20 C 110,20 110,180 50,180"/>
        <path d="M 140,40 C 200,40 200,200 140,200"/>
      </g>
      <!-- Distinct Blue-Mucin Goblet Cells -->
      <ellipse cx="65" cy="-120" rx="14" ry="20" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <ellipse cx="145" cy="-100" rx="14" ry="20" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <ellipse cx="75" cy="100" rx="14" ry="20" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <ellipse cx="165" cy="120" rx="14" ry="20" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

      <!-- Transition Dividing Line -->
      <line x1="0" y1="-280" x2="0" y2="280" stroke="#881337" stroke-width="4.5"/>
    </g>
  </g>
  
  <g transform="translate(740, 240)">
    <rect x="-155" y="-26" width="310" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Intestinal Goblet Cell</text>
    <path d="M -143,0 L -210,50" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-210" cy="50" r="6" fill="#fde047"/>
  </g>
  
</svg>