      <!-- Centerpiece: Classic Binucleated Reed-Sternberg Cell (Owl-Eye Appearance) -->
      <g transform="translate(0, 0)">
        <!-- Abundant slightly amphophilic / eosinophilic cytoplasm -->
        <ellipse cx="0" cy="0" rx="90" ry="75" fill="#f472b6" opacity="0.65" stroke="#be185d" stroke-width="2.5"/>

        <!-- Twin / Mirror-image Bilobed Nucleus -->
        <!-- Left lobe -->
        <g transform="translate(-32, -5)">
          <ellipse cx="0" cy="0" rx="30" ry="32" fill="#e9d5ff" stroke="#6b21a8" stroke-width="3"/>
          <!-- Clear perinucleolar halo -->
          <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.8"/>
          <!-- Huge, inclusion-like cherry-red nucleolus -->
          <circle cx="0" cy="0" r="10" fill="#be123c" stroke="#881337" stroke-width="1.5"/>
        </g>

        <!-- Right lobe -->
        <g transform="translate(32, -5)">
