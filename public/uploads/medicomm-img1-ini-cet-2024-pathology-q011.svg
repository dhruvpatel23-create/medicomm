<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-340" y="-24" width="680" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">EXPERIMENTAL TRANSPLANTATION: GRAFT SURVIVAL CURVE</text>
  </g>
  <g transform="translate(190, 140)">
    <!-- Axes with high contrast -->
    <line x1="0" y1="420" x2="630" y2="420" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="0" y2="420" stroke="#94a3b8" stroke-width="3.5"/>
    
    <!-- Big Bold Axis Labels -->
    <text x="315" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="1">Days Post-Transplantation</text>
    <text x="-48" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="1" transform="rotate(-90 -48 210)">Graft Survival (%)</text>
    
    <!-- Large, Sharp Y-axis Ticks & Numbers -->
    <line x1="-8" y1="0" x2="0" y2="0" stroke="#94a3b8" stroke-width="3"/>
    <text x="-16" y="6" text-anchor="end" font-family="monospace" font-size="16" font-weight="800" fill="#f8fafc">100</text>
    
    <line x1="-8" y1="210" x2="0" y2="210" stroke="#94a3b8" stroke-width="3"/>
    <text x="-16" y="216" text-anchor="end" font-family="monospace" font-size="16" font-weight="800" fill="#f8fafc">50</text>
    
    <line x1="-8" y1="420" x2="0" y2="420" stroke="#94a3b8" stroke-width="3"/>
    <text x="-16" y="425" text-anchor="end" font-family="monospace" font-size="16" font-weight="800" fill="#f8fafc">0</text>
    
    <!-- X-axis Ticks & Numbers -->
    <line x1="100" y1="420" x2="100" y2="428" stroke="#94a3b8" stroke-width="3"/>
    <text x="100" y="448" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#cbd5e1">10</text>

    <line x1="200" y1="420" x2="200" y2="428" stroke="#94a3b8" stroke-width="3"/>
    <text x="200" y="448" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#cbd5e1">20</text>

    <line x1="300" y1="420" x2="300" y2="428" stroke="#94a3b8" stroke-width="3"/>
    <text x="300" y="448" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#cbd5e1">30</text>

    <line x1="450" y1="420" x2="450" y2="428" stroke="#94a3b8" stroke-width="3"/>
    <text x="450" y="448" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#cbd5e1">45</text>

    <line x1="600" y1="420" x2="600" y2="428" stroke="#94a3b8" stroke-width="3"/>
    <text x="600" y="448" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#cbd5e1">60</text>

    <!-- Guide Gridlines -->
    <line x1="0" y1="210" x2="630" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Bold High-Contrast Survival Curves -->
    <path d="M 0,0 L 60,0 L 80,180 L 100,420" stroke="#ef4444" stroke-width="4.5" fill="none"/>
    <path d="M 0,0 L 80,0 L 110,200 L 140,420" stroke="#f97316" stroke-width="4.5" fill="none"/>
    <path d="M 0,0 L 160,0 L 220,180 L 280,420" stroke="#38bdf8" stroke-width="4.5" fill="none"/>
    <path d="M 0,0 L 360,0 L 480,140 L 560,420" stroke="#22c55e" stroke-width="5" fill="none"/>

    <!-- Crisp Large Legend Box -->
    <g transform="translate(340, 25)">
      <rect x="0" y="0" width="280" height="170" rx="12" fill="#020617" stroke="#475569" stroke-width="2"/>
      
      <line x1="20" y1="30" x2="70" y2="30" stroke="#ef4444" stroke-width="5"/>
      <circle cx="45" cy="30" r="5" fill="#ef4444"/>
      <text x="85" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Control (No Treatment)</text>

      <line x1="20" y1="68" x2="70" y2="68" stroke="#f97316" stroke-width="5"/>
      <circle cx="45" cy="68" r="5" fill="#f97316"/>
      <text x="85" y="74" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Anti-CD8 alone</text>

      <line x1="20" y1="106" x2="70" y2="106" stroke="#38bdf8" stroke-width="5"/>
      <circle cx="45" cy="106" r="5" fill="#38bdf8"/>
      <text x="85" y="112" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Anti-CD4 alone</text>

      <line x1="20" y1="144" x2="70" y2="144" stroke="#22c55e" stroke-width="5"/>
      <circle cx="45" cy="144" r="5" fill="#22c55e"/>
      <text x="85" y="150" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#4ade80">Anti-CD4 + Anti-CD8</text>
    </g>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>