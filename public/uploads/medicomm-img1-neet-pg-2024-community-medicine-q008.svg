<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#030712"/>
  <defs>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="popGrowthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Chart Background Grid Area: (180, 80) to (900, 520) -->
  <rect x="180" y="80" width="720" height="440" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>

  <!-- Vertical Stage Divider Guidelines -->
  <!-- Stage 1 / 2 border -->
  <line x1="324" y1="80" x2="324" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Stage 2 / 3 border -->
  <line x1="468" y1="80" x2="468" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Stage 3 / 4 border -->
  <line x1="612" y1="80" x2="612" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Stage 4 / 5 border -->
  <line x1="756" y1="80" x2="756" y2="520" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Horizontal Axis Lines & Ticks (0, 10, 20, 30, 40) -->
  <!-- 40 rate line (y = 120) -->
  <line x1="170" y1="120" x2="900" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="160" y="127" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">40</text>

  <!-- 30 rate line (y = 220) -->
  <line x1="170" y1="220" x2="900" y2="220" stroke="#334155" stroke-width="1"/>
  <text x="160" y="227" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">30</text>

  <!-- 20 rate line (y = 320) -->
  <line x1="170" y1="320" x2="900" y2="320" stroke="#334155" stroke-width="1"/>
  <text x="160" y="327" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">20</text>

  <!-- 10 rate line (y = 420) -->
  <line x1="170" y1="420" x2="900" y2="420" stroke="#334155" stroke-width="1"/>
  <text x="160" y="427" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="end">10</text>

  <!-- Baseline (y = 520) -->
  <line x1="180" y1="520" x2="900" y2="520" stroke="#64748b" stroke-width="2.5"/>

  <!-- Y-Axis Title (Neutral to avoid hints) -->
  <text transform="rotate(-90 80 300)" x="80" y="300" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Rate (per 1,000 people per year)</text>

  <!-- Natural Increase Shading between Curve A (Birth) and Curve B (Death) -->
  <!-- Curve A: (180, 120) to (468, 120) -> (756, 420) -> (900, 450) -->
  <!-- Curve B: (180, 130) to (324, 130) -> (612, 420) -> (900, 420) -->
  <path d="M 324 130 L 468 120 C 540 120, 680 300, 756 420 L 612 420 C 500 420, 380 200, 324 130 Z" fill="url(#popGrowthGrad)"/>

  <!-- Curve A (Green Line: Birth Rate) -->
  <path d="M 180 120 L 468 120 C 550 120, 680 320, 756 420 L 900 450" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  <!-- Curve B (Red Line: Death Rate - TARGET TESTED) -->
  <path d="M 180 130 L 324 130 C 400 130, 520 420, 612 420 L 900 420" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Curve C (Blue S-Curve: Total Population) -->
  <path d="M 180 440 C 260 440, 380 410, 468 310 C 550 210, 680 90, 780 90 C 840 90, 880 100, 900 115" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

  <!-- Circular Badges Marking Curves: A, B, C -->
  <!-- Badge A (pointing to Curve A) -->
  <g transform="translate(240, 120)" filter="url(#badgeGlow)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="6" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">A</text>
  </g>

  <!-- Badge B (pointing to Curve B) -->
  <g transform="translate(240, 200)" filter="url(#badgeGlow)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="6" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">B</text>
  </g>

  <!-- Badge C (pointing to Curve C) -->
  <g transform="translate(240, 440)" filter="url(#badgeGlow)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="0" y="6" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">C</text>
  </g>

  <!-- Watermark -->
  <text x="40" y="670" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>