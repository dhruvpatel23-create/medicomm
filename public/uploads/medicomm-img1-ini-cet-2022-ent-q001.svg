<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 100)">
    <!-- Axial Neck CT Cross Section Outline -->
    <ellipse cx="350" cy="350" rx="330" ry="290" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Cervical Vertebra & Spinal Canal Posteriorly -->
    <path d="M 280 540 C 310 510, 390 510, 420 540 C 440 580, 420 620, 350 630 C 280 620, 260 580, 280 540 Z" 
          fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="350" cy="565" r="22" fill="#000000"/>

    <!-- Bilateral Carotid Sheath Vessels -->
    <circle cx="170" cy="460" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="530" cy="460" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <!-- Laryngeal Airway Lumen (True Vocal Cord Level) -->
    <path d="M 350 240 L 310 370 Q 350 395 390 370 Z" fill="#000000" stroke="#475569" stroke-width="2"/>

    <!-- Normal Left Thyroid Cartilage Lamina (Hyperdense Calcified Bone Rim) -->
    <path d="M 350 170 L 220 280 L 210 390" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Right Thyroid Cartilage Lamina: FRANK NEOPLASTIC EROSION & EXTRALARYNGEAL EXTENSION -->
    <!-- Anterior Segment of Lamina -->
    <path d="M 350 170 L 400 210" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- DESTRUCTION / GAP (Eroded Cartilage) -->
    <path d="M 400 210 L 470 270" stroke="#f43f5e" stroke-width="5" stroke-dasharray="4,4" fill="none"/>
    <!-- Posterior Remnant of Lamina -->
    <path d="M 480 320 L 490 390" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Infiltrative Soft Tissue Neoplastic Mass Invading through the Cartilage Gap into Strap Muscles -->
    <path d="M 350 240 C 410 230, 490 220, 520 280 C 530 330, 480 370, 390 370 Z" 
          fill="#881337" opacity="0.85" stroke="#f43f5e" stroke-width="3"/>

    <!-- Precise Gold Arrow pointing to the Full-Thickness Cartilage Invasion -->
    <g transform="translate(560, 230)">
      <line x1="80" y1="-30" x2="10" y2="20" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>