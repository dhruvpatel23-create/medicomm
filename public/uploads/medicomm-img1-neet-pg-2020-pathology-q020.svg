<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Columnar cell gradient -->
    <linearGradient id="columnarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Squamous cell gradient -->
    <linearGradient id="squamousGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Squamous superficial flattened -->
    <linearGradient id="flatSquamousGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Goblet cell gradient -->
    <linearGradient id="gobletGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Nucleus gradient -->
    <linearGradient id="nucGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Basement membrane glow -->
    <filter id="glowBM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="650" fill="#000000"/>
  <rect width="960" height="650" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 45)">
    <rect x="-290" y="-22" width="580" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f8fafc" letter-spacing="1">RESPIRATORY EPITHELIUM: SQUAMOUS METAPLASIA</text>
  </g>

  <!-- Cigarette smoke / chronic irritation banner -->
  <g transform="translate(480, 105)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fca5a5" letter-spacing="0.5">CHRONIC IRRITATION (e.g. CIGARETTE SMOKE)</text>
  </g>

  <!-- Transition Arrow in center -->
  <g transform="translate(480, 175)">
    <path d="M -40,-5 L 20,-5 L 20,-15 L 45,0 L 20,15 L 20,5 L -40,5 Z" fill="#f59e0b"/>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="1">METAPLASTIC TRANSFORMATION</text>
  </g>

  <!-- SECTION 1: Normal Respiratory Epithelium (Left Side, x: 70 to 410) -->
  <g transform="translate(70, 170)">
    <!-- Header Box -->
    <rect x="0" y="0" width="350" height="36" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="175" y="23" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8">1. NORMAL RESPIRATORY EPITHELIUM</text>

    <!-- Subtitle -->
    <text x="175" y="54" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#94a3b8">Pseudostratified Ciliated Columnar with Goblet Cells</text>

    <!-- Cells Container (y: 80 to 280) -->
    <!-- Cilia on top edge -->
    <g transform="translate(15, 80)" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round">
      <!-- Cilia hairs waving -->
      <path d="M 5,0 Q 8,-14 12,-20 M 15,0 Q 20,-15 25,-22 M 25,0 Q 30,-14 34,-20 M 35,0 Q 40,-16 46,-22 M 45,0 Q 50,-15 55,-21 M 55,0 Q 60,-14 65,-20 M 65,0 Q 70,-16 76,-22"/>
      <path d="M 85,0 Q 88,-14 92,-20 M 95,0 Q 100,-15 105,-22 M 105,0 Q 110,-14 114,-20 M 115,0 Q 120,-16 126,-22 M 125,0 Q 130,-15 135,-21 M 135,0 Q 140,-14 145,-20 M 145,0 Q 150,-16 156,-22"/>
      <path d="M 235,0 Q 238,-14 242,-20 M 245,0 Q 250,-15 255,-22 M 255,0 Q 260,-14 264,-20 M 265,0 Q 270,-16 276,-22 M 275,0 Q 280,-15 285,-21 M 285,0 Q 290,-14 295,-20 M 295,0 Q 300,-16 306,-22"/>
    </g>

    <!-- Columnar Cells -->
    <g transform="translate(15, 80)">
      <!-- Cell 1: Columnar -->
      <path d="M 0,0 L 45,0 L 40,160 L 0,160 Z" fill="url(#columnarGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <ellipse cx="20" cy="110" rx="9" ry="16" fill="url(#nucGrad)" stroke="#6366f1" stroke-width="1"/>

      <!-- Cell 2: Columnar -->
      <path d="M 45,0 L 90,0 L 85,160 L 40,160 Z" fill="url(#columnarGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <ellipse cx="65" cy="90" rx="9" ry="16" fill="url(#nucGrad)" stroke="#6366f1" stroke-width="1"/>

      <!-- Cell 3: Goblet Cell (mucus secretor) -->
      <path d="M 90,0 L 150,0 C 145,50 140,90 125,160 L 115,160 C 100,90 95,50 90,0 Z" fill="url(#gobletGrad)" stroke="#047857" stroke-width="1.5"/>
      <!-- Mucus droplets inside goblet cell -->
      <circle cx="120" cy="30" r="7" fill="#ecfdf5" opacity="0.8"/>
      <circle cx="110" cy="45" r="8" fill="#ecfdf5" opacity="0.8"/>
      <circle cx="130" cy="48" r="7" fill="#ecfdf5" opacity="0.8"/>
      <circle cx="120" cy="65" r="9" fill="#ecfdf5" opacity="0.8"/>
      <!-- Basal compressed nucleus of goblet cell -->
      <ellipse cx="120" cy="135" rx="10" ry="6" fill="url(#nucGrad)" stroke="#10b981" stroke-width="1"/>

      <!-- Cell 4: Tall Columnar -->
      <path d="M 150,0 L 195,0 L 190,160 L 125,160 Z" fill="url(#columnarGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <ellipse cx="165" cy="105" rx="9" ry="17" fill="url(#nucGrad)" stroke="#6366f1" stroke-width="1"/>

      <!-- Cell 5: Basal round reserve cell -->
      <path d="M 190,90 C 215,90 225,115 225,160 L 175,160 C 175,115 180,90 190,90 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
      <circle cx="198" cy="132" r="10" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>

      <!-- Cell 6: Columnar overlying basal cell -->
      <path d="M 195,0 L 250,0 L 255,160 L 225,160 C 225,115 215,90 195,0 Z" fill="url(#columnarGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <ellipse cx="232" cy="75" rx="9" ry="16" fill="url(#nucGrad)" stroke="#6366f1" stroke-width="1"/>

      <!-- Cell 7: Columnar -->
      <path d="M 250,0 L 320,0 L 320,160 L 255,160 Z" fill="url(#columnarGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <ellipse cx="285" cy="100" rx="10" ry="17" fill="url(#nucGrad)" stroke="#6366f1" stroke-width="1"/>
    </g>

    <!-- Basement Membrane -->
    <rect x="10" y="240" width="330" height="7" rx="3.5" fill="#38bdf8" filter="url(#glowBM)"/>
    <!-- Lamina propria / submucosa -->
    <rect x="10" y="250" width="330" height="40" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="175" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Lamina Propria (Connective Tissue)</text>
  </g>

  <!-- SECTION 2: Squamous Metaplasia (Right Side, x: 540 to 890) -->
  <g transform="translate(540, 170)">
    <!-- Header Box -->
    <rect x="0" y="0" width="350" height="36" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
    <text x="175" y="23" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#fb923c">2. SQUAMOUS METAPLASIA</text>

    <!-- Subtitle -->
    <text x="175" y="54" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#fca5a5">Stratified Squamous Epithelium (Cilia &amp; Goblet Cells Lost)</text>

    <!-- Cells Container (y: 80 to 240) -->
    <g transform="translate(15, 80)">
      <!-- Stratum Corneum / Superficial Flattened Squamous Cells (Layers 1 & 2) -->
      <!-- Top layer -->
      <path d="M 0,15 L 320,15 L 320,40 L 0,40 Z" fill="url(#flatSquamousGrad)" stroke="#9f1239" stroke-width="1"/>
      <ellipse cx="40" cy="27" rx="18" ry="4" fill="url(#nucGrad)"/>
      <ellipse cx="110" cy="27" rx="18" ry="4" fill="url(#nucGrad)"/>
      <ellipse cx="190" cy="27" rx="18" ry="4" fill="url(#nucGrad)"/>
      <ellipse cx="270" cy="27" rx="18" ry="4" fill="url(#nucGrad)"/>

      <!-- Second layer flattened -->
      <path d="M 0,40 L 320,40 L 320,70 L 0,70 Z" fill="#f43f5e" fill-opacity="0.8" stroke="#9f1239" stroke-width="1"/>
      <ellipse cx="75" cy="55" rx="16" ry="5" fill="url(#nucGrad)"/>
      <ellipse cx="155" cy="55" rx="16" ry="5" fill="url(#nucGrad)"/>
      <ellipse cx="235" cy="55" rx="16" ry="5" fill="url(#nucGrad)"/>

      <!-- Intermediate Polygonal Cells (Layers 3 & 4) -->
      <path d="M 0,70 L 320,70 L 320,115 L 0,115 Z" fill="url(#squamousGrad)" stroke="#c2410c" stroke-width="1"/>
      <!-- Polygonal cell outlines and round nuclei -->
      <ellipse cx="35" cy="92" rx="9" ry="9" fill="url(#nucGrad)" stroke="#4338ca" stroke-width="0.8"/>
      <ellipse cx="90" cy="92" rx="9" ry="9" fill="url(#nucGrad)" stroke="#4338ca" stroke-width="0.8"/>
      <ellipse cx="145" cy="92" rx="9" ry="9" fill="url(#nucGrad)" stroke="#4338ca" stroke-width="0.8"/>
      <ellipse cx="205" cy="92" rx="9" ry="9" fill="url(#nucGrad)" stroke="#4338ca" stroke-width="0.8"/>
      <ellipse cx="265" cy="92" rx="9" ry="9" fill="url(#nucGrad)" stroke="#4338ca" stroke-width="0.8"/>

      <!-- Basal Row (Stratum basale - cuboidal / low columnar) -->
      <path d="M 0,115 L 320,115 L 320,160 L 0,160 Z" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
      <!-- Basal nuclei -->
      <circle cx="25" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="65" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="105" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="145" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="185" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="225" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="265" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>
      <circle cx="300" cy="138" r="8" fill="url(#nucGrad)" stroke="#818cf8" stroke-width="1"/>

      <!-- No cilia tag -->
      <rect x="80" y="-8" width="160" height="20" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
      <text x="160" y="6" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fef2f2">LOSS OF CILIA &amp; MUCUS</text>
    </g>

    <!-- Basement Membrane -->
    <rect x="10" y="240" width="330" height="7" rx="3.5" fill="#f97316" filter="url(#glowBM)"/>
    <!-- Lamina propria / submucosa -->
    <rect x="10" y="250" width="330" height="40" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="175" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Lamina Propria (Intact Basement Membrane)</text>
  </g>

  <!-- Educational Pathology Takeaway Cards (Bottom) -->
  <g transform="translate(70, 485)">
    <rect x="0" y="0" width="400" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">KEY PATHOLOGY CONCEPTS</text>
    <text x="20" y="48" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#facc15">Definition:</tspan> Reversible reprogramming of stem cells from</text>
    <text x="32" y="66" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">one mature differentiated cell type to another.</text>
    <text x="20" y="86" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Adaptive Benefit:</tspan> Stratified squamous cells better withstand</text>
    <text x="32" y="104" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">the noxious, toxic chemical assault of tobacco smoke.</text>
  </g>

  <g transform="translate(490, 485)">
    <rect x="0" y="0" width="400" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#fb923c">CLINICAL SIGNIFICANCE</text>
    <text x="20" y="48" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#f87171">Loss of Function:</tspan> Mucociliary escalator clearing is lost,</text>
    <text x="32" y="66" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">predisposing chronic smokers to persistent infections.</text>
    <text x="20" y="86" font-family="sans-serif" font-size="11.5" fill="#e2e8f0">• <tspan font-weight="700" fill="#ef4444">Malignant Potential:</tspan> Persistent noxious stimuli can induce</text>
    <text x="32" y="104" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">dysplasia, leading to <tspan font-weight="700" fill="#ef4444">Squamous Cell Carcinoma</tspan> of lung.</text>
  </g>

  <!-- Medulla Watermark -->
  
</svg>
