<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 80)">
    <!-- Axial CT of Orbits and Paranasal Sinuses -->
    <ellipse cx="350" cy="360" rx="330" ry="300" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Left Orbit (Normal) -->
    <ellipse cx="200" cy="250" rx="85" ry="95" fill="#000000" stroke="#64748b" stroke-width="3"/>
    <circle cx="200" cy="240" r="40" fill="#1e293b"/>
    <!-- Medial Rectus Muscle (Normal Position) -->
    <line x1="260" y1="200" x2="260" y2="320" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Ethmoid Sinus Air Cells in Midline -->
    <!-- Right Ethmoid Sinus completely opacified by inflammatory tissue -->
    <rect x="325" y="220" width="50" height="160" rx="6" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>

    <!-- Right Orbit (Proptosed Globe & Lamina Papyracea Erosion) -->
    <ellipse cx="500" cy="235" rx="85" ry="95" fill="#000000" stroke="#64748b" stroke-width="3"/>
    <circle cx="515" cy="220" r="40" fill="#1e293b"/> <!-- Proptosed Globe -->

    <!-- Lenticular Rim-Enhancing Extraconal Collection -->
    <path d="M 400 220 C 445 235, 445 305, 400 330 Z" fill="#f59e0b" opacity="0.85" stroke="#fbbf24" stroke-width="3.5"/>
    
    <!-- Medial Rectus Muscle Displaced Laterally by the Lenticular Collection -->
    <path d="M 445 210 C 465 250, 465 305, 445 345" stroke="#f43f5e" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Gold Arrow pointing to the Lenticular Extraconal Collection -->
    <g transform="translate(340, 130)">
      <line x1="-30" y1="-20" x2="65" y2="120" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>