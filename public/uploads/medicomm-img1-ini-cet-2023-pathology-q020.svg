<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="brightfieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4e6"/><stop offset="85%" stop-color="#fecdd3"/><stop offset="100%" stop-color="#fda4af"/>
    </radialGradient>
    <radialGradient id="amyloidSalmon" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f87171"/><stop offset="60%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="polarField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/><stop offset="60%" stop-color="#022c22"/><stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="appleGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635"/><stop offset="50%" stop-color="#4ade80"/><stop offset="85%" stop-color="#16a34a"/><stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  
  <g transform="translate(480, 48)">
    <rect x="-370" y="-24" width="740" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">SPECIAL STAIN: CONGO RED EVALUATION &amp; POLARIZATION</text>
  </g>
  <!-- Left Panel -->
  <g transform="translate(240, 360)">
    <circle cx="0" cy="0" r="190" fill="url(#brightfieldGrad)" stroke="#64748b" stroke-width="5"/>
    <clipPath id="lc"><circle cx="0" cy="0" r="187"/></clipPath>
    <g clip-path="url(#lc)">
      <circle cx="0" cy="0" r="110" fill="url(#amyloidSalmon)" stroke="#b91c1c" stroke-width="4"/>
      <ellipse cx="5" cy="-5" rx="42" ry="36" fill="#ffe4e6" stroke="#991b1b" stroke-width="3.5"/>
    </g>
    <!-- Big Bold Label -->
    <rect x="-140" y="140" width="280" height="42" rx="21" fill="#030712" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="0" y="167" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#fecdd3">Brightfield: Salmon-Pink</text>
  </g>

  <!-- Right Panel -->
  <g transform="translate(720, 360)">
    <circle cx="0" cy="0" r="190" fill="url(#polarField)" stroke="#64748b" stroke-width="5"/>
    <clipPath id="rc"><circle cx="0" cy="0" r="187"/></clipPath>
    <g clip-path="url(#rc)">
      <circle cx="0" cy="0" r="110" fill="url(#appleGreen)" stroke="#86efac" stroke-width="4"/>
      <ellipse cx="5" cy="-5" rx="42" ry="36" fill="#022c22" stroke="#14532d" stroke-width="3.5"/>
    </g>
    <!-- Big Bold Label -->
    <rect x="-140" y="140" width="280" height="42" rx="21" fill="#030712" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="167" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#4ade80">Polarized: Apple-Green</text>
  </g>

  <!-- Restyled Dual Pointer Badge -->
  <g transform="translate(480, 230)">
    <rect x="-140" y="-26" width="280" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a">Amorphous Deposits</text>
    <path d="M -130,0 L -165,40" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-168" cy="42" r="5" fill="#fde047"/>
    <path d="M 130,0 L 165,40" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="168" cy="42" r="5" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>