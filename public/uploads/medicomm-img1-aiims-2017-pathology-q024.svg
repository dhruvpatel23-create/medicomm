    <clipPath id="c24"><circle cx="0" cy="0" r="276"/></clipPath>
    <g clip-path="url(#c24)">
      <!-- Mott Cell / Plasma cell engorged with Russell bodies -->
      <ellipse cx="0" cy="0" rx="140" ry="120" fill="#a5b4fc" stroke="#4338ca" stroke-width="3.5"/>
      <!-- Eccentric plasma cell nucleus -->
      <ellipse cx="-80" cy="-50" rx="34" ry="28" fill="#1e1b4b"/>
      
      <!-- Large, Homogeneous Glassy Eosinophilic Russell Bodies -->
      <circle cx="-10" cy="-30" r="32" fill="url(#russellGrad)" stroke="#881337" stroke-width="2.5"/>
      <circle cx="55" cy="-20" r="30" fill="url(#russellGrad)" stroke="#881337" stroke-width="2.5"/>
      <circle cx="-35" cy="40" r="34" fill="url(#russellGrad)" stroke="#881337" stroke-width="2.5"/>
      <circle cx="35" cy="45" r="32" fill="url(#russellGrad)" stroke="#881337" stroke-width="2.5"/>
    </g>
  </g>
  
  <g transform="translate(740, 260)">
    <rect x="-155" y="-26" width="310" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Glassy Russell Body</text>
    <path d="M -143,0 L -210,60" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-210" cy="60" r="6" fill="#fde047"/>
