<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="85%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <radialGradient id="russellGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/><stop offset="70%" stop-color="#e11d48"/><stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  
  <g transform="translate(480, 48)">
    <rect x="-370" y="-24" width="740" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">BONE MARROW / LESION: PLASMA CELL CYTOMORPHOLOGY</text>
  </g>
  <g transform="translate(480, 360)">
