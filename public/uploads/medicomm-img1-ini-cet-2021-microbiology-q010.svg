<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="80" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">NEUROMUSCULAR CLINICAL PRESENTATION</text>
  <text x="500" y="115" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">Severe Involuntary Generalized Axial Muscular Spasm</text>

  <!-- Examination Bed / Table -->
  <rect x="80" y="650" width="840" height="18" rx="4" fill="#334155"/>
  <rect x="120" y="668" width="24" height="160" rx="3" fill="#1e293b"/>
  <rect x="856" y="668" width="24" height="160" rx="3" fill="#1e293b"/>
  <line x1="80" y1="650" x2="920" y2="650" stroke="#475569" stroke-width="2"/>

  <!-- Opisthotonic Mannequin Body Vector -->
  <!-- Arched back bridging from head to heels -->
  <g filter="url(#glow)">
    <!-- Support point 1: Head / Occiput resting on bed at left -->
    <!-- Head -->
    <ellipse cx="210" cy="585" rx="45" ry="40" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3.5"/>
    <!-- Hyperextended neck -->
    <path d="M 235 615 C 260 600 280 570 300 520 C 330 440 400 330 500 320 C 600 310 670 420 720 520 C 740 560 760 610 780 635" fill="none" stroke="#38bdf8" stroke-width="6"/>

    <!-- Anatomical Silhouette Contour -->
    <!-- Torso arched upward -->
    <path d="M 200 625 
             C 170 590 190 540 230 540 
             C 260 540 280 510 320 440 
             C 370 350 440 270 510 270 
             C 580 270 650 340 700 440 
             C 740 520 770 590 810 635 
             C 830 645 810 650 780 650 
             C 740 650 710 600 670 520 
             C 630 440 570 360 510 360 
             C 450 360 390 430 350 510 
             C 320 570 290 630 250 645 
             Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="3"/>

    <!-- Flexed arms (risus/trismus and forearm flexion) -->
    <path d="M 330 450 C 370 420 400 430 430 400 C 450 380 440 360 420 370" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="415" cy="370" r="10" fill="#38bdf8"/>

    <!-- Rigid extended legs down to heels -->
    <path d="M 720 520 L 800 640" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 790 645 L 830 645" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Contact Point Indicators -->
  <!-- Point 1: Occiput -->
  <circle cx="210" cy="650" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <line x1="210" y1="650" x2="210" y2="730" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3"/>
  <rect x="130" y="730" width="160" height="40" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="210" y="755" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">CONTACT: OCCIPUT</text>

  <!-- Point 2: Heels -->
  <circle cx="800" cy="650" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <line x1="800" y1="650" x2="800" y2="730" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3"/>
  <rect x="720" y="730" width="160" height="40" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="800" y="755" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">CONTACT: HEELS</text>

  <!-- Arch Vector Highlight -->
  <path d="M 330 620 C 400 480 600 480 680 620" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="420" y="520" width="180" height="40" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="510" y="545" text-anchor="middle" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">HYPEREXTENSION ARCH</text>

  <!-- Subtle medicomm watermark -->
  <text x="40" y="970" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>