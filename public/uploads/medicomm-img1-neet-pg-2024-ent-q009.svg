<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(320, 100)">
    <!-- Basal Worm's Eye View of Nasal Base & Columella -->
    <!-- Triangular Nasal Base Contour -->
    <path d="M 250 50 
             C 340 100, 420 240, 395 380 
             C 375 460, 320 480, 250 460 
             C 180 480, 125 460, 105 380 
             C 80 240, 160 100, 250 50 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="4"/>

    <!-- Bilateral Nostril Apertures (Piriform / Oval) -->
    <ellipse cx="175" cy="320" rx="38" ry="65" fill="#020617" stroke="#334155" stroke-width="3" transform="rotate(-30 175 320)"/>
    <ellipse cx="325" cy="320" rx="38" ry="65" fill="#020617" stroke="#334155" stroke-width="3" transform="rotate(30 325 320)"/>

    <!-- Columellar Pillar in Midline between Nostrils -->
    <rect x="225" y="240" width="50" height="210" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>

    <!-- INVERTED-V / CHEVRON TRANSCOLUMELLAR INCISION LINE -->
    <!-- Inverted V at mid-columella -->
    <path d="M 223 340 L 250 320 L 277 340" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Bilateral Infracartilaginous / Marginal Incision Extensions along Nostril Rims -->
    <path d="M 223 340 C 205 310, 185 270, 175 240" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M 277 340 C 295 310, 315 270, 325 240" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>

    <!-- Gold Arrow pointing to the Inverted-V Chevron Incision -->
    <g transform="translate(380, 290)">
      <line x1="80" y1="-30" x2="10" y2="25" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>