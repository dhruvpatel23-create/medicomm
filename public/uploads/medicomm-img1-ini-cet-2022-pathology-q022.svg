<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-250" y="-18" width="500" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">SKIN BIOPSY: UMBILICATED PAPULE LESION</text>
  </g>

  <!-- Histology Field -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="-372" y="-232" width="744" height="464" rx="16" fill="url(#fieldGrad)"/>

    <g clip-path="url(#molluscClip)">
      <clipPath id="molluscClip">
        <rect x="-372" y="-232" width="744" height="464" rx="16"/>
      </clipPath>

      <!-- Epidermis dipping downward in a crater-like, cup-shaped lobule -->
      <path d="M -380,-140 Q -150,-140 -120,-40 Q -100,160 0,180 Q 100,160 120,-40 Q 150,-140 380,-140 L 380,240 L -380,240 Z"
            fill="#f472b6" opacity="0.65" stroke="#be185d" stroke-width="3"/>

      <!-- Large Ovoid Intracytoplasmic Inclusion Bodies (Henderson-Patterson / Molluscum Bodies) -->
      <!-- Bottom/stratum spinosum: pink eosinophilic bodies -->
      <g>
        <ellipse cx="-80" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-50" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-20" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="10" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="40" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="70" cy="80" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-80" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-50" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-20" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="10" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="40" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="70" cy="108" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-80" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-50" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="-20" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="10" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="40" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/><ellipse cx="70" cy="136" rx="14" ry="10" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>
      </g>

      <!-- Upper stratum granulosum/corneum: large dark purplish-basophilic molluscum bodies filling crater -->
      <g>
        <ellipse cx="-90" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-55" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-20" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="15" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="85" cy="-30" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-90" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-55" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-20" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="15" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="85" cy="-6" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-90" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-55" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-20" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="15" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="85" cy="18" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-90" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-55" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-20" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="15" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="85" cy="42" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-90" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-55" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="-20" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="15" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="50" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/><ellipse cx="85" cy="66" rx="16" ry="11" fill="#6b21a8" stroke="#4c1d95" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Marker Arrow to Henderson-Patterson Molluscum Bodies -->
    <g transform="translate(160, -90)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing to the purple inclusion bodies -->
      <line x1="-16" y1="12" x2="-90" y2="70" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="-100,76 -87,68 -93,58" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>