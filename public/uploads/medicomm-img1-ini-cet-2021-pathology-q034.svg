      <text x="42" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">500 nm</text>
    </g>

    <!-- Numbered Question Badges: 1, 2, 3, 4 -->
