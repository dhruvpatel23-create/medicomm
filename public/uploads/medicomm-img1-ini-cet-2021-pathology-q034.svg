      <line x1="18" y1="0" x2="135" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="145,0 132,-5 132,5" fill="#f59e0b"/>
    </g>

    <!-- Label 2: Myelin Sheath Lamellae (Tested target) -->
    <g transform="translate(-240, -40)">
