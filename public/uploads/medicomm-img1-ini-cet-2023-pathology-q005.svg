      <text x="0" y="48" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#f8fafc">II-6</text>
