      <text x="0" y="48" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#f8fafc">III-3</text>
    </g>
    <g transform="translate(680, 460)">
