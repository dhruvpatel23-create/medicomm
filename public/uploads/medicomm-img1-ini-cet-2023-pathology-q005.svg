    <circle cx="630" cy="38" r="15" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="655" y="44" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="16" font-weight="800" fill="#cbd5e1">Unaffected Female</text>
