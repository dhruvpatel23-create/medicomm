    </g>

    <!-- Proband Arrow -->
    <g transform="translate(540, 520)">
      <path d="M 0,0 L -25,-30" stroke="#f59e0b" stroke-width="4.5" fill="none"/>
      <polygon points="-25,-30 -38,-20 -20,-16" fill="#f59e0b"/>
      <text x="12" y="8" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="18" font-weight="900" fill="#f59e0b">P (Proband)</text>
