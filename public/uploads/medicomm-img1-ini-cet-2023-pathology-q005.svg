  <!-- Legend Box: Crisp High-Contrast -->
  <g transform="translate(100, 560)">
    <rect x="0" y="0" width="760" height="76" rx="14" fill="#030712" stroke="#475569" stroke-width="2.5"/>
    
    <rect x="25" y="24" width="28" height="28" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="65" y="44" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="16" font-weight="800" fill="#ffffff">Affected Male</text>

    <circle cx="230" cy="38" r="15" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="255" y="44" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="16" font-weight="800" fill="#ffffff">Affected Female</text>

    <rect x="425" y="24" width="28" height="28" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
