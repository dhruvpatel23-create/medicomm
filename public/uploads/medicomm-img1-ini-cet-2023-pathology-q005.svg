    </g>

    <!-- Generation II -->
    <line x1="220" y1="200" x2="740" y2="200" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="220" y1="200" x2="220" y2="265" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="390" y1="200" x2="390" y2="265" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="570" y1="200" x2="570" y2="265" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="740" y1="200" x2="740" y2="265" stroke="#94a3b8" stroke-width="3.5"/>

