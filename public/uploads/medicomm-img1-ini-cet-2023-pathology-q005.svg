    <text x="60" y="465" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="28" font-weight="900" fill="#ffffff">III</text>

    <!-- Generation I -->
    <line x1="430" y1="140" x2="530" y2="140" stroke="#94a3b8" stroke-width="3.5"/>
    <line x1="480" y1="140" x2="480" y2="200" stroke="#94a3b8" stroke-width="3.5"/>

