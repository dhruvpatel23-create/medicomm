<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(280, 80)">
    <!-- Medial Orbital Rim & Naso-Orbital Regional Anatomy -->
    <ellipse cx="320" cy="350" rx="260" ry="280" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Medial Canthus of Eye -->
    <path d="M 380 340 C 350 320, 280 330, 240 345 C 280 360, 350 370, 380 340 Z" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <circle cx="310" cy="345" r="14" fill="#020617"/>

    <!-- Medial Orbital Wall (Lamina Papyracea & Frontal Process of Maxilla) -->
    <path d="M 210 200 L 210 500" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Anterior Ethmoidal Foramen (Entry of Nasociliary / Anterior Ethmoidal Nerve) -->
    <circle cx="210" cy="280" r="10" fill="#000000" stroke="#f59e0b" stroke-width="3"/>

    <!-- Anesthetic Injection Needle Trajectory -->
    <!-- Needle Hub & Barrel entering above medial canthus -->
    <g transform="translate(100, 240)">
      <rect x="-80" y="-12" width="70" height="24" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
      <!-- Metallic Needle Shaft Trajectory directly toward foramen -->
      <line x1="-10" y1="0" x2="100" y2="35" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
      <line x1="-10" y1="0" x2="100" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Target Nerve Path (Nasociliary / Anterior Ethmoidal) -->
    <path d="M 210 280 C 180 280, 160 250, 140 210" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4,4" fill="none"/>

    <!-- Gold Arrow pointing to the needle insertion site above medial canthus -->
    <g transform="translate(140, 170)">
      <line x1="0" y1="0" x2="45" y2="55" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>