<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">SKULL RADIOGRAPHY: PEDIATRIC BONE DEFECT</text>
  </g>

  <!-- Skull X-Ray Canvas -->
  <g transform="translate(480, 350)" filter="url(#shadow)">
    <rect x="-380" y="-240" width="760" height="480" rx="16" fill="#020617" stroke="#334155" stroke-width="2.5"/>

    <!-- Calvarial Vault Contour (Curved radiopaque bone profile) -->
    <path d="M -300,160 C -320,-80 -180,-200 60,-190 C 220,-180 320,-60 300,160"
          fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round"/>

    <!-- Well-defined, non-sclerotic "Punched-Out" Lytic Skull Lesion (Beveled edges) -->
    <g transform="translate(-40, -110)">
      <!-- Outer calvarial table hole -->
      <ellipse cx="0" cy="0" rx="55" ry="38" fill="#000000" stroke="#94a3b8" stroke-width="3"/>
      <!-- Inner table hole producing characteristic "beveled edge" shadow -->
      <ellipse cx="-6" cy="4" rx="42" ry="28" fill="#020617" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- Marker Arrow to Punched-out Defect -->
    <g transform="translate(-180, -180)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing to punched out lesion -->
      <line x1="16" y1="12" x2="85" y2="45" stroke="#f59e0b" stroke-width="3"/>
      <polygon points="95,50 81,42 86,33" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  
</svg>