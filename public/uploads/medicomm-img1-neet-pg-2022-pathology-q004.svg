      <!-- Fragmented Red Blood Cells / Schistocytes (Helmet cells, triangular jagged cells) -->
      <!-- Schistocyte 1: Helmet cell (center-left) -->
      <g transform="translate(-40, -10)">
        <path d="M -24,-15 C 0,-25 24,-15 22,12 C 10,6 -10,6 -22,12 Z"
              fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      </g>

      <!-- Schistocyte 2: Triangular fragmented cell (right) -->
      <g transform="translate(70, 30)">
        <polygon points="-16,-18 20,-10 0,18" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
      </g>

      <!-- Microspherocyte -->
      <g transform="translate(-60, 90)">
        <circle cx="0" cy="0" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Marker Arrow to Helmet Cell -->
    <g transform="translate(-160, -80)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">!</text>
      <!-- Arrow pointing to helmet cell -->
