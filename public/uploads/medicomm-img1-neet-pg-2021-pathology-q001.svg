        <path d="M -40,-10 Q 0,-30 40,-10 T 30,25 Q -10,35 -35,15 Z" fill="#09090b"/>
        <circle cx="-15" cy="5" r="12" fill="#000000"/>
        <circle cx="20" cy="-5" r="11" fill="#000000"/>
