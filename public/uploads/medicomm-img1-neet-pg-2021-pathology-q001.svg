        <ellipse cx="0" cy="0" rx="90" ry="65" fill="#f472b6" opacity="0.4"/>
        <!-- Coarse jet-black carbon clumps -->
        <path d="M -50,-20 Q -20,-45 20,-30 T 60,10 Q 30,45 -20,35 Z" fill="#09090b" stroke="#18181b" stroke-width="3"/>
        <circle cx="-35" cy="15" r="16" fill="#000000"/>
        <circle cx="25" cy="-10" r="18" fill="#000000"/>
        <circle cx="10" cy="25" r="14" fill="#09090b"/>
