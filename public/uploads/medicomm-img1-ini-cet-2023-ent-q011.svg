<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(300, 100)">
    <!-- High-Magnification Histopathology Circular Photomicrograph Field -->
    <circle cx="300" cy="350" r="320" fill="url(#heMatox)" stroke="#475569" stroke-width="6"/>

    <!-- Prominent Giant Mature Thick-Walled Sporangia (200-300 µm scale) -->
    <!-- Sporangium 1 -->
    <g transform="translate(260, 300)">
      <circle cx="0" cy="0" r="140" fill="#3b0764" stroke="#f472b6" stroke-width="8"/>
      <!-- Thick inner chitinous wall rim -->
      <circle cx="0" cy="0" r="130" fill="#4c0519" stroke="#fda4af" stroke-width="4"/>
      
      <!-- Internal Endospores (Densely Packed Globular Spheres) -->
      <g fill="#f43f5e">
        <circle cx="-50" cy="-60" r="9"/><circle cx="0" cy="-70" r="9.5"/><circle cx="50" cy="-55" r="9"/>
        <circle cx="-80" cy="-20" r="9"/><circle cx="-30" cy="-25" r="9.5"/><circle cx="20" cy="-20" r="9.5"/><circle cx="70" cy="-15" r="9"/>
        <circle cx="-60" cy="30" r="9"/><circle cx="-10" cy="25" r="9.5"/><circle cx="40" cy="30" r="9"/><circle cx="85" cy="25" r="8.5"/>
        <circle cx="-35" cy="75" r="9"/><circle cx="15" cy="70" r="9.5"/><circle cx="60" cy="75" r="9"/>
        <circle cx="-10" cy="105" r="8.5"/><circle cx="-75" cy="65" r="8.5"/><circle cx="0" cy="-105" r="8.5"/>
      </g>
    </g>

    <!-- Adjacent Immature Smaller Sporangia -->
    <circle cx="120" cy="180" r="55" fill="#581c87" stroke="#e879f9" stroke-width="5"/>
    <circle cx="480" cy="460" r="65" fill="#581c87" stroke="#e879f9" stroke-width="5"/>
    
    <!-- Scale Bar -->
    <line x1="480" y1="630" x2="560" y2="630" stroke="#f8fafc" stroke-width="4"/>
    <text x="520" y="655" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">100 µm</text>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>