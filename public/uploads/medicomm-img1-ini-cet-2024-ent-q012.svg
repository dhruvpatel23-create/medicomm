<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(280, 80)">
    <!-- Nasal Septum Skeletal Anatomy -->
    <!-- Perpendicular Plate of Ethmoid (Postero-Superior Bone) -->
    <polygon points="260,100 520,130 460,330 260,260" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <text x="380" y="200" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Perpendicular Plate</text>

    <!-- Vomer (Postero-Inferior Bone) -->
    <polygon points="260,260 460,330 470,490 260,490" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <text x="360" y="420" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Vomer</text>

    <!-- Quadrangular Septal Cartilage (Anterior Cartilaginous Septum) -->
    <polygon points="70,220 260,100 260,490 130,490" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
    <text x="160" y="350" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Septal Cartilage</text>

    <!-- Anterior Nasal Spine at Base -->
    <polygon points="120,490 135,510 105,510" fill="#f8fafc"/>
    <text x="120" y="535" fill="#f8fafc" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Spine</text>

    <!-- VERTICAL FRACTURE LINE (Running from Spine Vertically to Dorsum) -->
    <line x1="128" y1="490" x2="160" y2="170" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <line x1="128" y1="490" x2="160" y2="170" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,6"/>

    <!-- Upward Impact Vector Arrow from Below -->
    <g transform="translate(125, 600)">
      <line x1="0" y1="50" x2="0" y2="-40" stroke="#38bdf8" stroke-width="5" marker-end="url(#cyanArrow)"/>
      <text x="25" y="-10" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Upward Blow From Below</text>
    </g>

    <!-- Gold Arrow pointing to the Vertical Fracture Line -->
    <g transform="translate(40, 270)">
      <line x1="-30" y1="0" x2="100" y2="30" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>