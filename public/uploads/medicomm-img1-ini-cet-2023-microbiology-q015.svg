<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="65" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">BACTERIAL EXOTOXIN MECHANISM</text>
  <text x="500" y="98" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">A-B Exotoxin Inhibition of Eukaryotic Protein Synthesis</text>

  <!-- Step 1: Intact A-B Toxin Structure (Top Left) -->
  <g transform="translate(120, 160)">
    <rect x="0" y="0" width="340" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="170" y="35" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">A-B TOXIN COMPLEX</text>
    
    <!-- Subunit B (Binding & Translocation) -->
    <rect x="40" y="60" width="110" height="65" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="95" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">B</text>
    <text x="95" y="115" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Binding</text>

    <!-- Disulfide Bond -->
    <line x1="150" y1="92" x2="190" y2="92" stroke="#facc15" stroke-width="3" stroke-dasharray="4 2"/>
    <text x="170" y="82" text-anchor="middle" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">S-S</text>

    <!-- Subunit A (Catalytic Active Fragment) -->
    <rect x="190" y="60" width="110" height="65" rx="8" fill="#be123c" stroke="#f43f5e" stroke-width="2"/>
    <text x="245" y="95" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">A</text>
    <text x="245" y="115" text-anchor="middle" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Active Enzyme</text>
  </g>

  <!-- Receptor Binding Arrow -->
  <line x1="460" y1="240" x2="560" y2="240" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Receptor Binding & Endocytosis (Top Right) -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="320" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="160" y="35" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">CELL ENTRY &amp; CLEAVAGE</text>
    <text x="160" y="70" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Receptor: <tspan fill="#facc15" font-weight="700">HB-EGF</tspan></text>
    <text x="160" y="100" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Receptor-mediated endocytosis</text>
    <text x="160" y="125" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Endosomal acidification &#8594; S-S reduction</text>
    <text x="160" y="148" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Fragment A released into cytosol</text>
  </g>

  <!-- Arrow down to Cytosolic Enzymatic Reaction -->
  <line x1="500" y1="330" x2="500" y2="400" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Cytosolic Biochemical Reaction (Central Flowchart) -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="800" height="340" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2.5"/>
    <text x="400" y="45" text-anchor="middle" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">CYTOSOLIC ADP-RIBOSYLATION REACTION</text>

    <!-- Substrates and Catalyst -->
    <g transform="translate(50, 90)">
      <!-- Substrates: NAD+ and EF-2 -->
      <rect x="0" y="0" width="160" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="42" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">NAD<tspan dy="-6" font-size="14">+</tspan></text>

      <text x="195" y="45" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">+</text>

      <rect x="230" y="0" width="180" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="320" y="42" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">Active EF-2</text>
    </g>

    <!-- Reaction Arrow with Catalyst -->
    <g transform="translate(500, 125)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#f43f5e" stroke-width="4" marker-end="url(#arrowRed)"/>
      <rect x="-30" y="-45" width="140" height="30" rx="6" fill="#be123c"/>
      <text x="40" y="-25" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">TOXIN FRAGMENT A</text>
    </g>

    <!-- Inactive Products -->
    <g transform="translate(610, 80)">
      <rect x="0" y="0" width="160" height="90" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2.5"/>
      <text x="80" y="38" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">ADP-Ribosyl-</text>
      <text x="80" y="62" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">EF-2</text>
      <text x="80" y="80" text-anchor="middle" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">(INACTIVE)</text>
    </g>

    <line x1="40" y1="200" x2="760" y2="200" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Downstream Lethal Consequence -->
    <g transform="translate(50, 225)">
      <rect x="0" y="0" width="700" height="90" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <text x="350" y="35" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">CONSEQUENCE: CESSATION OF PEPTIDYL-tRNA TRANSLOCATION</text>
      <text x="350" y="68" text-anchor="middle" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Immediate Arrest of Eukaryotic Protein Translation &#8594; Cellular Apoptosis / Necrosis</text>
    </g>
  </g>

  <!-- Summary Box (Bottom) -->
  <rect x="180" y="810" width="640" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="848" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Identical mechanism shared with: <tspan fill="#38bdf8" font-weight="700">Pseudomonas Exotoxin A</tspan></text>

  <!-- Subtle medicomm watermark -->
  <text x="40" y="970" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>