<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(380, 80)">
    <!-- Pharmaceutical Glass Injection Vial Specimen -->
    <!-- Glass Bottle Body -->
    <rect x="60" y="240" width="320" height="460" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    
    <!-- Molded Glass Bottom Rim -->
    <rect x="75" y="670" width="290" height="25" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- Lyophilized Cake / Powder at Bottom of Vial -->
    <rect x="75" y="550" width="290" height="120" rx="10" fill="#312e81" opacity="0.85" stroke="#6366f1" stroke-width="2"/>
    <text x="220" y="615" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lyophilized Sterile Powder</text>

    <!-- Vial Shoulder & Neck -->
    <path d="M 60 240 C 60 190, 160 180, 160 140 L 280 140 C 280 180, 380 190, 380 240 Z" 
          fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    
    <!-- Aluminum Crimp Collar -->
    <rect x="150" y="80" width="140" height="60" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Plastic Flip-Off Cap (Purple/Royal Blue) -->
    <rect x="140" y="45" width="160" height="35" rx="8" fill="#7c3aed" stroke="#a78bfa" stroke-width="3"/>

    <!-- Pharmaceutical Specimen Label -->
    <rect x="80" y="270" width="280" height="260" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Label Typography (Factual, Educational, Zero Spoiler) -->
    <rect x="80" y="270" width="280" height="36" fill="#0369a1"/>
    <text x="220" y="295" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">STERILE PHARMACEUTICAL VIAL</text>
    
    <text x="220" y="340" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">5 mg / VIAL</text>
    <text x="220" y="375" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Alkylating Antineoplastic Agent</text>
    <text x="220" y="405" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">For Topical Reconstitution</text>
    
    <!-- Warning Box -->
    <rect x="100" y="430" width="240" height="45" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="220" y="458" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">POTENT FIBROBLAST INHIBITOR</text>
    
    <text x="220" y="505" fill="#64748b" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Rx Only • Single-Dose Vial</text>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>