<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="rbcGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-270" y="-18" width="540" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">ELECTRON MICROSCOPY: PULMONARY BLOOD-AIR BARRIER</text>
  </g>

  <!-- TEM Canvas Window -->
  <g transform="translate(480, 345)" filter="url(#shadow)">
    <rect x="-400" y="-240" width="800" height="480" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <rect x="-392" y="-232" width="784" height="464" rx="12" fill="#1e293b"/>

    <g clip-path="url(#barrierClip)">
      <clipPath id="barrierClip">
        <rect x="-392" y="-232" width="784" height="464" rx="12"/>
      </clipPath>

      <!-- Alveolar Lumen (Upper Air Space, D) -->
      <rect x="-400" y="-240" width="800" height="150" fill="#090d16" opacity="0.6"/>

      <!-- Layer B: Alveolar Epithelial Layer (Type 1 Pneumocyte, top cellular sheet) -->
      <path d="M -400,-70 Q -200,-50 0,-70 T 400,-60 L 400,-95 Q 200,-105 0,-95 T -400,-100 Z"
            fill="#64748b" opacity="0.8" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Layer C: Fused Basal Lamina / Interstitium (Middle thin continuous basement membrane) -->
      <path d="M -400,-50 Q -200,-35 0,-50 T 400,-45 L 400,-70 Q 200,-60 0,-70 T -400,-70 Z"
            fill="#334155" stroke="#475569" stroke-width="1.5"/>

      <!-- Layer A: Capillary Endothelium (Lower cellular sheet with pinocytotic vesicles) -->
      <path d="M -400,10 Q -200,20 0,5 T 400,15 L 400,-50 Q 200,-45 0,-50 T -400,-50 Z"
            fill="#475569" opacity="0.85" stroke="#64748b" stroke-width="2"/>

      <!-- Capillary Lumen (Bottom space containing RBC) -->
      <!-- Large Red Blood Cell Profile in Capillary -->
      <path d="M -280,240 C -260,110 60,60 260,140 C 350,180 380,240 380,240 Z"
            fill="url(#rbcGrad)" stroke="#ef4444" stroke-width="2.5"/>
    </g>

    <!-- RBC Identification Badge -->
    <g transform="translate(-180, 160)">
      <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#fca5a5">RBC</text>
    </g>

    <!-- Marker Badges: A, B, C, D -->
    <!-- Marker A: Capillary Endothelium (adjacent to capillary & RBC) -->
    <g transform="translate(-240, -10)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">A</text>
      <!-- Arrow pointing to endothelium -->
      <line x1="18" y1="0" x2="65" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="75,0 62,-5 62,5" fill="#f59e0b"/>
    </g>

    <!-- Marker B: Alveolar Epithelium -->
    <g transform="translate(100, -160)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">B</text>
      <line x1="0" y1="18" x2="0" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="0,75 -5,62 5,62" fill="#f59e0b"/>
    </g>

    <!-- Marker C: Basement Membrane / Interstitium -->
    <g transform="translate(-320, -140)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">C</text>
      <line x1="12" y1="12" x2="55" y2="55" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="63,63 50,56 56,50" fill="#f59e0b"/>
    </g>

    <!-- Marker D: Alveolar Lumen -->
    <g transform="translate(260, -160)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">D</text>
      <line x1="0" y1="18" x2="0" y2="50" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="0,60 -5,48 5,48" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Watermark -->
  <text x="32" y="678" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">medicomm</text>
</svg>