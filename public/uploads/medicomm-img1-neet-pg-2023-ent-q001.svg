<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(300, 100)">
    <!-- Transnasal Endoscopic View of Lateral Nasopharynx -->
    <circle cx="300" cy="350" r="320" fill="#020617" stroke="#475569" stroke-width="6"/>

    <!-- Soft Palate & Posterior Pharyngeal Wall Contour -->
    <path d="M 80 540 C 200 620, 400 610, 520 500" stroke="#881337" stroke-width="16" fill="none"/>

    <!-- Tubal Elevation -->
    <path d="M 230 180 C 310 180, 320 360, 250 430 C 210 370, 200 250, 230 180 Z" 
          fill="#9f1239" stroke="#e11d48" stroke-width="4"/>

    <!-- Pharyngeal Orifice of Eustachian Tube -->
    <ellipse cx="190" cy="330" rx="30" ry="55" fill="#020617" stroke="#fb7185" stroke-width="3.5"/>
    <text x="140" y="335" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ET Orifice</text>

    <!-- Deep Lateral Pharyngeal Recess Behind Tubal Elevation (Target Structure) -->
    <path d="M 330 220 C 410 230, 440 370, 360 440 C 320 410, 320 270, 330 220 Z" 
          fill="#4c0519" stroke="#f59e0b" stroke-width="4"/>

    <!-- Gold Arrow pointing to the Marked Recess (Structure X) -->
    <g transform="translate(440, 280)">
      <line x1="90" y1="40" x2="10" y2="40" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
      <rect x="95" y="16" width="130" height="48" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
      <text x="160" y="48" fill="#f59e0b" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Structure X</text>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>