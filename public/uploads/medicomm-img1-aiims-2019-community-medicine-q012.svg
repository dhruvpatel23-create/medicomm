<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 750" width="950" height="750">
  <rect width="950" height="750" fill="#030712"/>
  <defs>
    <filter id="glowLine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
    <marker id="axisArrow2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="475" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0.5">BIVARIATE LINEAR REGRESSION GRAPH</text>
  <text x="475" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">Scatter Plot with Fitted Regression Line</text>

  <!-- Card Container -->
  <rect x="70" y="110" width="810" height="570" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Coordinates setup:
       Origin: X=200, Y=600 (X=0, Y=0)
       X scale: 1 unit = 75px. (X=0: 200, X=2: 350, X=4: 500, X=6: 650, X=8: 800)
       Y scale: 5 units = 90px (18px per unit). (Y=0: 600, Y=5: 510, Y=10: 420, Y=15: 330, Y=20: 240, Y=25: 150)
  -->

  <!-- Horizontal Gridlines & Y-axis ticks -->
  <line x1="200" y1="150" x2="820" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">25</text>

  <line x1="200" y1="240" x2="820" y2="240" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="246" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">20</text>

  <line x1="200" y1="330" x2="820" y2="330" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="336" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">15</text>

  <line x1="200" y1="420" x2="820" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="426" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">10</text>

  <line x1="200" y1="510" x2="820" y2="510" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="180" y="516" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">5</text>

  <text x="180" y="605" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="end">0</text>

  <!-- Vertical Gridlines & X-axis ticks -->
  <line x1="350" y1="150" x2="350" y2="600" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="350" y="628" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2</text>

  <line x1="500" y1="150" x2="500" y2="600" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="500" y="628" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">4</text>

  <line x1="650" y1="150" x2="650" y2="600" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="650" y="628" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">6</text>

  <line x1="800" y1="150" x2="800" y2="600" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="800" y="628" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">8</text>

  <text x="200" y="628" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">0</text>

  <!-- Y-axis -->
  <line x1="200" y1="600" x2="200" y2="135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#axisArrow2)"/>
  <text x="135" y="360" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Y</text>

  <!-- X-axis -->
  <line x1="200" y1="600" x2="840" y2="600" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#axisArrow2)"/>
  <text x="515" y="665" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">X</text>

  <!-- Fitted Linear Regression Line: Passing through (0.5, 12) -> (237.5, 384) to (6.2, 23.4) -> (665, 178.8) -->
  <line x1="237.5" y1="384" x2="665" y2="178.8" stroke="#06b6d4" stroke-width="3.5" filter="url(#glowLine)"/>

  <!-- Plotted Data Points -->
  <!-- Point 1: (0.6, 13) -> X = 200 + 0.6*75 = 245, Y = 600 - 13*18 = 366 -->
  <circle cx="245" cy="366" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Point 2: (1.2, 13) -> X = 200 + 1.2*75 = 290, Y = 600 - 13*18 = 366 -->
  <circle cx="290" cy="366" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Point 3: (2.0, 15) -> X = 200 + 2.0*75 = 350, Y = 600 - 15*18 = 330 -->
  <circle cx="350" cy="330" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Point 4: (4.0, 19) -> X = 200 + 4.0*75 = 500, Y = 600 - 19*18 = 258 -->
  <circle cx="500" cy="258" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Point 5: (6.0, 23) -> X = 200 + 6.0*75 = 650, Y = 600 - 23*18 = 186 -->
  <circle cx="650" cy="186" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Watermark -->
  <text x="40" y="725" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">medicomm</text>
</svg>