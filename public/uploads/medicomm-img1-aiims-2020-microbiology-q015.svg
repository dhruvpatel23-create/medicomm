<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#000000"/>
  <rect width="960" height="720" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">COMPOUND OPTICAL MICROSCOPE ANATOMY</text>
  </g>

  <!-- Microscope Body (Centered at x=480) -->
  <g transform="translate(480, 90)" filter="url(#shadow)">
    <!-- Base (Foot) -->
    <path d="M -160 520 L 160 520 L 140 480 L -140 480 Z" fill="url(#bodyGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect x="-140" y="520" width="280" height="15" rx="5" fill="#0f172a"/>

    <!-- Light Source / Illuminator D (Integrated into Base) -->
    <g transform="translate(0, 475)">
      <rect x="-42" y="-10" width="84" height="20" rx="4" fill="url(#metalGrad)" stroke="#334155"/>
      <ellipse cx="0" cy="-10" rx="30" ry="10" fill="#38bdf8" opacity="0.8"/>
      <ellipse cx="0" cy="-10" rx="18" ry="6" fill="#ffffff" opacity="0.9"/>
      <!-- Light beam upward cone -->
      <polygon points="-24,-10 24,-10 38,-150 -38,-150" fill="#38bdf8" opacity="0.12"/>
    </g>

    <!-- Substage Condenser B & Iris Diaphragm (Below Stage) -->
    <g transform="translate(0, 375)">
      <!-- Condenser bracket -->
      <rect x="-35" y="-15" width="70" height="30" rx="6" fill="url(#metalGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Condenser Top Lens Cylinder -->
      <cylinder cx="0" cy="-22" r="22"/>
      <rect x="-25" y="-28" width="50" height="14" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <ellipse cx="0" cy="-28" rx="22" ry="7" fill="#bae6fd" opacity="0.85"/>
      <!-- Diaphragm Lever -->
      <line x1="28" y1="-5" x2="48" y2="-5" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="48" cy="-5" r="4" fill="#38bdf8"/>
    </g>

    <!-- Mechanical Stage (Horizontal Platform) -->
    <g transform="translate(0, 320)">
      <rect x="-110" y="-10" width="220" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <!-- Slide holder clips -->
      <rect x="-60" y="-14" width="120" height="5" fill="#94a3b8" rx="2"/>
      <!-- Glass slide with specimen dot -->
      <rect x="-35" y="-18" width="70" height="6" fill="#cbd5e1" opacity="0.6" rx="1"/>
      <circle cx="0" cy="-15" r="3" fill="#ec4899"/>
    </g>

    <!-- Curved Arm (Backbone) -->
    <path d="M 60 480 C 130 450 160 380 150 260 C 140 160 80 120 0 120 L 0 160 C 50 160 90 190 95 260 C 100 340 75 420 40 480 Z" fill="url(#bodyGrad)" stroke="#1e293b" stroke-width="2"/>

    <!-- Adjustment Knobs A (Coarse & Fine on the Arm/Base) -->
    <g transform="translate(90, 410)">
      <!-- Coarse Knob (Large outer wheel) -->
      <circle cx="0" cy="0" r="32" fill="url(#metalGrad)" stroke="#334155" stroke-width="2"/>
      <!-- Ridges on knob -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Fine Knob (Small inner concentric wheel) -->
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Revolving Nosepiece & Objective Lenses C -->
    <g transform="translate(0, 240)">
      <!-- Nosepiece turret disk -->
      <path d="M -45 -10 L 45 -10 L 35 15 L -35 15 Z" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Central active objective lens pointing down to stage -->
      <rect x="-12" y="15" width="24" height="48" rx="3" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Color band on objective (e.g. blue for 40x / yellow for 10x) -->
      <rect x="-12" y="42" width="24" height="6" fill="#3b82f6"/>
      <rect x="-8" y="63" width="16" height="8" rx="2" fill="#0f172a"/>
      <!-- Inactive tilted objectives -->
      <g transform="translate(-25, 12) rotate(32)">
        <rect x="-9" y="0" width="18" height="38" rx="3" fill="url(#metalGrad)" stroke="#334155"/>
        <rect x="-9" y="24" width="18" height="5" fill="#eab308"/>
      </g>
      <g transform="translate(25, 12) rotate(-32)">
        <rect x="-9" y="0" width="18" height="42" rx="3" fill="url(#metalGrad)" stroke="#334155"/>
        <rect x="-9" y="26" width="18" height="5" fill="#ef4444"/>
      </g>
    </g>

    <!-- Head / Observation Tube & Eyepiece -->
    <g transform="translate(0, 120)">
      <!-- Inclined Binocular/Monocular Tube -->
      <path d="M -20 0 L -60 -70 L -40 -75 L 0 -5 Z" fill="url(#bodyGrad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Eyepiece / Ocular Lens -->
      <g transform="translate(-50, -72) rotate(30)">
        <rect x="-12" y="-35" width="24" height="35" rx="3" fill="url(#metalGrad)" stroke="#1e293b"/>
        <rect x="-14" y="-45" width="28" height="12" rx="3" fill="#0f172a"/>
        <ellipse cx="0" cy="-45" rx="12" ry="5" fill="#38bdf8" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- ================= LABELS & POINTERS ================= -->

  <!-- Label C: Objective Lens (x=480, y=340) -->
  <g transform="translate(210, 310)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">C</text>
    <line x1="28" y1="0" x2="250" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="260,21 245,16 247,26" fill="#ffffff"/>
  </g>

  <!-- Label B: Substage Condenser (TARGET, y=465 in canvas) -->
  <g transform="translate(210, 465)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">B</text>
    <line x1="28" y1="0" x2="225" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="235,0 221,-5 221,5" fill="#ffffff"/>
  </g>

  <!-- Label A: Coarse Focus Knob (y=500 in canvas) -->
  <g transform="translate(740, 500)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">A</text>
    <line x1="-28" y1="0" x2="-130" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-140,0 -126,-5 -126,5" fill="#ffffff"/>
  </g>

  <!-- Label D: Illuminator / Light Source (y=580 in canvas) -->
  <g transform="translate(210, 570)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">D</text>
    <line x1="28" y1="0" x2="215" y2="-5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="225,-5 211,-10 211,0" fill="#ffffff"/>
  </g>

  <!-- Watermark -->
  
</svg>