<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#bgGrad)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-340" y="-24" width="680" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">CYTOGENETICS: CHROMOSOME 15 IDEOGRAM COMPARISON</text>
  </g>
  <!-- Maternal Chromosome 15 (Normal) -->
  <g transform="translate(280, 140)">
    <rect x="-100" y="-35" width="200" height="38" rx="19" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#f472b6">Maternal Chr 15</text>
    <!-- p arm -->
    <rect x="-30" y="15" width="60" height="60" rx="15" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Centromere -->
    <ellipse cx="0" cy="85" rx="18" ry="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- q arm -->
    <rect x="-32" y="97" width="64" height="330" rx="18" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
    <!-- 15q11-q12 Region (Intact - Pink) -->
    <rect x="-32" y="125" width="64" height="50" fill="#f43f5e"/>
    <text x="0" y="156" text-anchor="middle" font-family="monospace" font-size="14" font-weight="900" fill="#ffffff">q11-q12</text>
    <rect x="-32" y="210" width="64" height="35" fill="#0284c7"/>
    <rect x="-32" y="280" width="64" height="40" fill="#0284c7"/>
    <rect x="-32" y="360" width="64" height="35" fill="#0284c7"/>
  </g>
  <!-- Paternal Chromosome 15 (Deleted 15q11-q12) -->
  <g transform="translate(560, 140)">
    <rect x="-100" y="-35" width="200" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8">Paternal Chr 15</text>
    <rect x="-30" y="15" width="60" height="60" rx="15" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
    <ellipse cx="0" cy="85" rx="18" ry="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="-32" y="97" width="64" height="280" rx="18" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Deletion gap at 15q11-q12 marked by big red dashed box -->
    <rect x="-38" y="122" width="76" height="44" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="-35" y1="124" x2="35" y2="164" stroke="#ef4444" stroke-width="3"/>
    <rect x="-32" y="175" width="64" height="35" fill="#0284c7"/>
    <rect x="-32" y="245" width="64" height="40" fill="#0284c7"/>
    <rect x="-32" y="325" width="64" height="35" fill="#0284c7"/>
  </g>
  
  <g transform="translate(740, 280)">
    <rect x="-115" y="-26" width="230" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">15q11-q12 Deletion</text>
    <path d="M -103,0 L -150,15" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-150" cy="15" r="6" fill="#fde047"/>
  </g>
  <text x="40" y="675" font-family="monospace" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">medicomm</text>
</svg>