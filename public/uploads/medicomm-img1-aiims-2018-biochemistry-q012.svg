<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background and Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Operon Bar Gradient -->
    <linearGradient id="operonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3447" />
      <stop offset="100%" stop-color="#161c28" />
    </linearGradient>

    <!-- Inactive Enzyme (Yellow Oval) -->
    <linearGradient id="inactiveBetaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="100%" stop-color="#d4b414" />
    </linearGradient>

    <!-- Alpha Fragment (Coral/Pink) -->
    <linearGradient id="alphaFragGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b90" />
      <stop offset="100%" stop-color="#d93856" />
    </linearGradient>

    <!-- Plasmid Arc (Cyan) -->
    <linearGradient id="plasmidArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Repressor Complex -->
    <linearGradient id="repressorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="iptgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#e2e8f0" />
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
    .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 600; fill: #f1f5f9; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 500; fill: #94a3b8; }
    .italic-gene { font-family: system-ui, -apple-system, sans-serif; font-style: italic; font-weight: 700; }
    .watermark { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #64748b; letter-spacing: 0.5px; }
    .border-card { stroke: #334155; stroke-width: 1.5; fill: #0b0f19; rx: 12; }
  </style>

  <!-- Pure Black Background -->
  <rect width="1200" height="900" fill="#000000" />

  <!-- Outer Framing Container Card -->
  <rect x="50" y="40" width="1100" height="800" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- ==================== TOP: LAC OPERON DNA ==================== -->
  <!-- DNA Backbone Line -->
  <line x1="90" y1="170" x2="1110" y2="170" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Promoter 1 -->
  <rect x="120" y="140" width="45" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="142" y="167" text-anchor="middle" class="title-text" font-size="20">P</text>

  <!-- lacI Gene -->
  <rect x="180" y="140" width="180" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="270" y="167" text-anchor="middle" class="title-text italic-gene" font-size="22">lacI</text>

  <!-- Promoter 2 -->
  <rect x="420" y="140" width="45" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="442" y="167" text-anchor="middle" class="title-text" font-size="20">P</text>

  <!-- Operator O -->
  <rect x="480" y="140" width="45" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="502" y="167" text-anchor="middle" class="title-text" font-size="20">O</text>

  <!-- lacZ Gene Segment 1 (before deletion) -->
  <rect x="545" y="140" width="60" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />

  <!-- lacZ Gene Segment 2 (after deletion) -->
  <rect x="625" y="140" width="450" height="40" rx="4" fill="url(#operonGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="850" y="167" text-anchor="middle" class="title-text italic-gene" font-size="22">lacZ</text>

  <!-- Deletion Pointer & Label -->
  <line x1="615" y1="125" x2="615" y2="148" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowWhite)" />
  <text x="615" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f87171">aa 11–41</text>
  <text x="615" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fca5a5">deleted</text>

  <!-- Transcription Arrows -->
  <line x1="180" y1="195" x2="330" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowWhite)" />
  <line x1="420" y1="195" x2="1040" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowWhite)" />

  <!-- ==================== LEFT: REPRESSOR & PLASMID ==================== -->
  <!-- Inactive Lac Repressor bound with IPTG -->
  <g transform="translate(190, 240)">
    <!-- Repressor body -->
    <path d="M 40 40 C 20 40, 10 20, 30 5 C 50 -10, 90 -10, 110 5 C 130 20, 120 40, 100 40 Z" fill="url(#repressorGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- IPTG ligand (diamond) -->
    <polygon points="70,18 85,32 70,46 55,32" fill="url(#iptgGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#glow)" />
    <text x="70" y="70" text-anchor="middle" class="label-text" font-size="17">Inactive</text>
    <text x="70" y="92" text-anchor="middle" class="label-text" font-size="17">Lac repressor</text>
    <text x="70" y="114" text-anchor="middle" class="sub-text" font-size="15">bound with</text>
    <text x="70" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#4ade80">IPTG</text>
  </g>

  <!-- Arrow pointing away from operator (dissociated) -->
  <path d="M 320, 255 Q 360, 240 375, 220" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowWhite)" />

  <!-- Circular Plasmid Vector with lacZ' -->
  <g transform="translate(240, 520)">
    <!-- Main Plasmid Backbone (Double ring) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#475569" stroke-width="3" />
    <circle cx="0" cy="0" r="69" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Inserted / Recombinant lacZ' Segment (Thick cyan arc) -->
    <path d="M -53,-53 A 75 75 0 0 1 53,-53" fill="none" stroke="url(#plasmidArcGrad)" stroke-width="14" stroke-linecap="round" />
    <text x="0" y="-30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" font-style="italic" fill="#38bdf8">lacZ'</text>

    <text x="0" y="105" text-anchor="middle" class="sub-text" font-size="16">Plasmid Vector</text>

    <!-- Arrow from lacZ' on plasmid to fragment peptide -->
    <line x1="55" y1="-30" x2="115" y2="-5" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />
  </g>

  <!-- LacZ Alpha-Fragment (Pink Sphere) -->
  <g transform="translate(420, 520)">
    <circle cx="0" cy="0" r="26" fill="url(#alphaFragGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" />
    <!-- 3D highlight on sphere -->
    <circle cx="-7" cy="-7" r="7" fill="#ffffff" opacity="0.35" />
    <text x="0" y="48" text-anchor="middle" class="label-text italic-gene" font-size="18">LacZ</text>
    <text x="0" y="70" text-anchor="middle" class="label-text" font-size="17">Fragment (α)</text>
  </g>

  <!-- ==================== RIGHT: ENZYMES & COMPLEMENTATION ==================== -->
  <!-- Top Right: Inactive Beta-Galactosidase (Omega peptide, Yellow Pill) -->
  <g transform="translate(850, 270)">
    <!-- Downward arrow from lacZ gene to inactive enzyme -->
    <line x1="0" y1="-70" x2="0" y2="-30" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowWhite)" />

    <!-- Yellow Inactive Enzyme Shape (indented for complementation) -->
    <path d="M -80,0 C -80,-25, 80,-25, 80,0 C 80,25, -80,25, -80,0 Z" fill="url(#inactiveBetaGrad)" stroke="#eab308" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Inactive</text>
    <text x="0" y="45" text-anchor="middle" class="label-text" font-size="19">β-galactosidase (ω)</text>

    <!-- Downward arrow towards complementation -->
    <line x1="0" y1="70" x2="0" y2="170" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrowWhite)" />
  </g>

  <!-- Complementation Arrow (Horizontal from alpha fragment to active complex) -->
  <g transform="translate(480, 520)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowWhite)" />
    <text x="125" y="-14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#fb7185">α-complementation</text>
  </g>

  <!-- Bottom Right: Active Beta-Galactosidase Complex -->
  <g transform="translate(850, 520)">
    <!-- Base Inactive Enzyme (Yellow pill) -->
    <path d="M -80,0 C -80,-25, 45,-25, 55,-5 C 65,15, -80,25, -80,0 Z" fill="url(#inactiveBetaGrad)" stroke="#eab308" stroke-width="2" />
    <!-- Assembled Alpha Fragment (Pink Sphere) perfectly docked -->
    <circle cx="55" cy="5" r="26" fill="url(#alphaFragGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" />
    <circle cx="48" cy="-2" r="7" fill="#ffffff" opacity="0.4" />

    <text x="0" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#4ade80">Active</text>
    <text x="0" y="76" text-anchor="middle" class="label-text" font-size="19">β-galactosidase</text>

    <!-- Downward reaction arrow -->
    <line x1="0" y1="100" x2="0" y2="165" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)" />
  </g>

  <!-- Bottom Reaction: X-gal to Blue Product -->
  <g transform="translate(740, 715)">
    <rect x="-10" y="-22" width="90" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="35" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">X-gal</text>

    <line x1="100" y1="0" x2="190" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)" />

    <rect x="205" y="-24" width="165" height="46" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
    <text x="287" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#60a5fa">Blue Product</text>
  </g>

  <!-- Watermark in bottom-left corner -->
  
</svg>
