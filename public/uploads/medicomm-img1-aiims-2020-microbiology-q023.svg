<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#000000"/>
  <rect width="960" height="720" fill="url(#bgGrad)"/>

  <!-- Title Badge -->
  <g transform="translate(480, 42)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">CONGENITAL VECTOR-BORNE PATHOGENESIS</text>
  </g>

  <!-- Panel 1: Vector (Aedes mosquito) - Left (x=160, y=360) -->
  <g transform="translate(150, 360)">
    <rect x="-115" y="-230" width="230" height="460" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="-95" y="-210" width="190" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="0" y="-189" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">1. MOSQUITO VECTOR</text>

    <!-- Stylized Aedes mosquito vector with striped legs -->
    <g transform="translate(0, -60)">
      <!-- Thorax & Abdomen -->
      <ellipse cx="0" cy="-10" rx="12" ry="18" fill="#334155"/>
      <ellipse cx="0" cy="25" rx="9" ry="26" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Abdomen black/white bands -->
      <line x1="-7" y1="12" x2="7" y2="12" stroke="#f8fafc" stroke-width="2"/>
      <line x1="-8" y1="22" x2="8" y2="22" stroke="#f8fafc" stroke-width="2"/>
      <line x1="-7" y1="32" x2="7" y2="32" stroke="#f8fafc" stroke-width="2"/>
      <line x1="-5" y1="42" x2="5" y2="42" stroke="#f8fafc" stroke-width="2"/>
      <!-- Head & Proboscis -->
      <circle cx="0" cy="-32" r="8" fill="#1e293b"/>
      <line x1="0" y1="-38" x2="0" y2="-62" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Wings -->
      <ellipse cx="-26" cy="-15" rx="10" ry="32" fill="#94a3b8" opacity="0.35" transform="rotate(-30 -26 -15)"/>
      <ellipse cx="26" cy="-15" rx="10" ry="32" fill="#94a3b8" opacity="0.35" transform="rotate(30 26 -15)"/>
      <!-- Long Striped Legs -->
      <path d="M -12 -18 L -45 -40 L -60 -10 M -12 -8 L -55 -15 L -70 25 M -10 5 L -45 35 L -55 80" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
      <path d="M 12 -18 L 45 -40 L 60 -10 M 12 -8 L 55 -15 L 70 25 M 10 5 L 45 35 L 55 80" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
    </g>

    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Daytime-Biting Vector</text>
    <text x="0" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">(Aedes aegypti / albopictus)</text>

    <!-- Transmit indicator -->
    <rect x="-90" y="125" width="180" height="60" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="0" y="148" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fb7185">Inoculation into</text>
    <text x="0" y="166" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Maternal Bloodstream</text>
  </g>

  <!-- Vector to Placenta Arrow -->
  <path d="M 265 360 L 340 360" stroke="#f43f5e" stroke-width="3.5" marker-end="url(#arrowRed)"/>

  <!-- Panel 2: Placental Barrier Crossing - Center (x=480, y=360) -->
  <g transform="translate(480, 360)">
    <rect x="-120" y="-230" width="240" height="460" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="-100" y="-210" width="200" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="0" y="-189" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">2. PLACENTAL CROSSING</text>

    <!-- Placental Architecture Schematic -->
    <g transform="translate(0, -50)">
      <!-- Maternal Blood Space (Intervillous space) -->
      <rect x="-90" y="-70" width="180" height="35" rx="6" fill="#881337" opacity="0.6"/>
      <text x="0" y="-48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Maternal Intervillous Blood</text>

      <!-- Syncytiotrophoblast / Cytotrophoblast Barrier Layer -->
      <path d="M -90 -30 Q -60 -20 -30 -30 Q 0 -40 30 -30 Q 60 -20 90 -30 L 90 20 L -90 20 Z" fill="#9d174d" opacity="0.8"/>
      <!-- Trophoblast cell nuclei dots -->
      <circle cx="-60" cy="-5" r="4" fill="#fda4af"/>
      <circle cx="-20" cy="-10" r="4" fill="#fda4af"/>
      <circle cx="20" cy="-10" r="4" fill="#fda4af"/>
      <circle cx="60" cy="-5" r="4" fill="#fda4af"/>
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffe4e6">Chorionic Villi &amp; Trophoblasts</text>

      <!-- Viral particles crossing downward -->
      <g transform="translate(0, 35)">
        <circle cx="-25" cy="0" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="0" cy="8" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="25" cy="0" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- Fetal Capillary -->
      <rect x="-90" y="55" width="180" height="32" rx="6" fill="#1e3a8a" opacity="0.6"/>
      <text x="0" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Fetal Capillary System</text>
    </g>

    <!-- Transplacental transmission banner -->
    <rect x="-95" y="90" width="190" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="112" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">TRANSPLACENTAL</text>
    <text x="0" y="128" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">PASSAGE</text>
    <text x="0" y="148" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Infection of Hofbauer cells</text>
    <text x="0" y="163" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">&amp; fetal endothelial cells</text>
  </g>

  <!-- Placenta to Fetus Arrow -->
  <path d="M 600 360 L 675 360" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrowCyan)"/>

  <!-- Panel 3: Fetal Neurodevelopmental Outcome - Right (x=800, y=360) -->
  <g transform="translate(800, 360)">
    <rect x="-120" y="-230" width="240" height="460" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="-100" y="-210" width="200" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="0" y="-189" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">3. CONGENITAL ANOMALY</text>

    <!-- Fetal Microcephaly Silhouette Comparison -->
    <g transform="translate(0, -60)">
      <!-- Normal Head Outline (Dashed Gray) -->
      <ellipse cx="0" cy="-15" rx="55" ry="60" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="0" y="-80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">Normal cranial contour</text>

      <!-- Microcephalic Fetal Head Profile (Solid Pink-Coral) -->
      <path d="M -35 25 C -45 5 -40 -35 -15 -50 C 15 -50 35 -30 35 25 Z" fill="#475569" stroke="#f43f5e" stroke-width="2.5"/>
      <!-- Brain tissue with diminished cortical gyration -->
      <ellipse cx="-2" cy="-12" rx="24" ry="25" fill="#e11d48" opacity="0.6"/>
      <!-- Intracranial calcification specks -->
      <circle cx="-12" cy="-18" r="3" fill="#ffffff"/>
      <circle cx="8" cy="-10" r="2.5" fill="#ffffff"/>
      <circle cx="-4" cy="-3" r="3" fill="#ffffff"/>
      <circle cx="10" cy="-24" r="2" fill="#ffffff"/>
    </g>

    <!-- Result Banner -->
    <rect x="-100" y="50" width="200" height="135" rx="8" fill="#3f121d" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="0" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fecdd3">SEVERE MICROCEPHALY</text>
    <text x="0" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#fda4af">Target: Neural Progenitor Cells</text>
    <text x="0" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#fda4af">Cerebral Cortical Thinning</text>
    <text x="0" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#fda4af">Intracranial Calcifications</text>
    <text x="0" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#fda4af">Ventriculomegaly</text>
    <text x="0" y="172" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">(Congenital Syndrome)</text>
  </g>

  <!-- Watermark -->
  
</svg>