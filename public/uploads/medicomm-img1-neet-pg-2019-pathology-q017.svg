<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%">
  <defs>
    <radialGradient id="xrayBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="80%" stop-color="#090d16"/><stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="960" height="700" fill="#000000"/>
  <rect width="960" height="700" fill="url(#xrayBg)"/>
  
  <g transform="translate(480, 48)">
    <rect x="-360" y="-24" width="720" height="48" rx="24" fill="#030712" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#ffffff" text-rendering="geometricPrecision">LATERAL SKULL RADIOGRAPH: CALVARIAL LESION</text>
  </g>
  <!-- Skull Calvarium Arc -->
  <g transform="translate(420, 420)">
    <path d="M -260,-40 C -220,-240 60,-280 200,-160 C 260,-100 280,40 240,140 L 160,160 C 140,80 120,-80 -40,-120 C -160,-120 -200,40 -260,-40 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Punched-Out Lytic Lesion with Beveled Edges (Asymmetric Inner/Outer Table Erosion) -->
    <g transform="translate(40, -180)">
      <ellipse cx="0" cy="0" rx="48" ry="34" fill="#020617" stroke="#64748b" stroke-width="3"/>
      <!-- Inner table beveled contour -->
      <ellipse cx="-4" cy="-3" rx="34" ry="24" fill="#000000" stroke="#94a3b8" stroke-width="2.5"/>
    </g>
  </g>
  
  <g transform="translate(740, 220)">
    <rect x="-170" y="-26" width="340" height="52" rx="26" fill="#030712" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="0" y="8" text-anchor="middle" font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="22" font-weight="900" fill="#fef08a" text-rendering="geometricPrecision">Punched-Out Beveled Defect</text>
    <path d="M -158,0 L -260,20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-260" cy="20" r="6" fill="#fde047"/>
  </g>
  
</svg>