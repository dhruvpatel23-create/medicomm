<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850">
  <rect width="1000" height="850" fill="#030712"/>
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="blisterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pinkPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="whitePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Upper Half: Carton Box Packaging -->
  <!-- 3D Perspective Box -->
  <g transform="translate(180, 50)" filter="url(#boxShadow)">
    <!-- Top Face -->
    <polygon points="40,60 110,15 670,15 600,60" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Left Side Face -->
    <polygon points="40,60 110,15 110,215 40,260" fill="#0f766e" stroke="#115e59" stroke-width="1.5"/>
    <!-- Front Face -->
    <polygon points="40,60 600,60 600,260 40,260" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

    <!-- Geometric Branding Graphics on Front Face -->
    <polygon points="40,60 180,60 100,160 40,160" fill="#0f766e" opacity="0.9"/>
    <polygon points="100,160 180,60 230,160" fill="#14b8a6" opacity="0.8"/>
    <polygon points="120,160 210,260 40,260" fill="#134e4a"/>
    <polygon points="120,160 210,260 280,180" fill="#2dd4bf" opacity="0.85"/>
    <polygon points="210,260 340,260 280,180" fill="#0f766e"/>

    <!-- Pharmaceutical Title on Box -->
    <text x="320" y="115" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Artesunate, Sulfadoxine &amp;</text>
    <text x="320" y="145" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Pyrimethamine Combikit</text>

    <rect x="320" y="165" width="220" height="2" fill="#0d9488"/>
    <text x="320" y="190" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">3 Artesunate Tablets (100 mg) +</text>
    <text x="320" y="210" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">1 SP Tablet (500 mg / 25 mg)</text>
  </g>

  <!-- Lower Half: Blister Pack Strip -->
  <g transform="translate(180, 370)" filter="url(#boxShadow)">
    <!-- Metallic Blister Background Foil -->
    <rect x="30" y="30" width="600" height="340" rx="20" fill="url(#blisterGrad)" stroke="#64748b" stroke-width="3"/>
    <!-- Dimpled aluminum pattern effect -->
    <circle cx="50" cy="50" r="2" fill="#94a3b8" opacity="0.4"/>
    <circle cx="610" cy="50" r="2" fill="#94a3b8" opacity="0.4"/>
    <circle cx="50" cy="350" r="2" fill="#94a3b8" opacity="0.4"/>
    <circle cx="610" cy="350" r="2" fill="#94a3b8" opacity="0.4"/>

    <!-- Perforation Dividers -->
    <line x1="180" y1="40" x2="180" y2="360" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="330" y1="40" x2="330" y2="360" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="480" y1="40" x2="480" y2="360" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Left Column: 3 White Tablets (Sulfadoxine + Pyrimethamine / Day 1) -->
    <g transform="translate(105, 90)">
      <circle cx="0" cy="0" r="30" fill="url(#whitePill)" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <g transform="translate(105, 200)">
      <circle cx="0" cy="0" r="30" fill="url(#whitePill)" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <g transform="translate(105, 310)">
      <circle cx="0" cy="0" r="30" fill="url(#whitePill)" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>

    <!-- Column 2: Day 1 (Pink Artesunate pair) -->
    <g transform="translate(255, 100)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <!-- Day 1 Label Badge -->
    <rect x="220" y="180" width="70" height="34" rx="6" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <text x="255" y="203" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Day 1</text>
    <g transform="translate(255, 300)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <!-- Connectors -->
    <line x1="255" y1="130" x2="255" y2="180" stroke="#000000" stroke-width="2.5"/>
    <line x1="255" y1="214" x2="255" y2="274" stroke="#000000" stroke-width="2.5"/>

    <!-- Column 3: Day 2 (Pink Artesunate pair) -->
    <g transform="translate(405, 100)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <!-- Day 2 Label Badge -->
    <rect x="370" y="180" width="70" height="34" rx="6" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <text x="405" y="203" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Day 2</text>
    <g transform="translate(405, 300)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <line x1="405" y1="130" x2="405" y2="180" stroke="#000000" stroke-width="2.5"/>
    <line x1="405" y1="214" x2="405" y2="274" stroke="#000000" stroke-width="2.5"/>

    <!-- Column 4: Day 3 (Pink Artesunate pair) -->
    <g transform="translate(555, 100)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <!-- Day 3 Label Badge -->
    <rect x="520" y="180" width="70" height="34" rx="6" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <text x="555" y="203" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Day 3</text>
    <g transform="translate(555, 300)">
      <circle cx="0" cy="0" r="26" fill="url(#pinkPill)" stroke="#be185d" stroke-width="2"/>
    </g>
    <line x1="555" y1="130" x2="555" y2="180" stroke="#000000" stroke-width="2.5"/>
    <line x1="555" y1="214" x2="555" y2="274" stroke="#000000" stroke-width="2.5"/>
  </g>

  <!-- Watermark -->
  <text x="40" y="810" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>