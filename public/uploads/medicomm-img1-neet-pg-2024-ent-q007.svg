<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Solid pure black #000000 background edge to edge -->
  <rect width="1200" height="900" fill="#000000"/>
  
  <defs>
    <!-- Medical Cel Shading & Soft Gradients -->
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heMatox" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="70%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Thin Gold Arrowhead for precise question markers -->
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#f59e0b"/>
    </marker>
    <marker id="cyanArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,1.5 8,4.5 0,7.5 2,4.5" fill="#38bdf8"/>
    </marker>
  </defs>


  <g transform="translate(250, 80)">
    <!-- Coronal PNS Computed Tomography Outline -->
    <ellipse cx="350" cy="360" rx="330" ry="300" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Left Antral Cavity (Clear, Aerated, Hypodense Black) -->
    <rect x="100" y="260" width="150" height="180" rx="16" fill="#000000" stroke="#64748b" stroke-width="3"/>

    <!-- Nasal Cavity & Midline Septum -->
    <line x1="350" y1="180" x2="350" y2="480" stroke="#cbd5e1" stroke-width="5"/>

    <!-- Right Antral Cavity with Expansile Polypoid Soft Tissue Mass (Target) -->
    <rect x="450" y="260" width="150" height="180" rx="16" fill="#000000" stroke="#64748b" stroke-width="3"/>
    <path d="M 460 420 C 450 300, 490 270, 585 310 C 600 380, 560 435, 460 420 Z" 
          fill="#be123c" opacity="0.9" stroke="#f43f5e" stroke-width="4"/>
    
    <!-- Mass Protruding through Widened Natural Ostium into Nasal Cavity -->
    <path d="M 475 310 C 430 300, 380 310, 365 350" stroke="#be123c" stroke-width="20" stroke-linecap="round" fill="none"/>

    <!-- Gold Arrow pointing to the Antral Soft Tissue Mass -->
    <g transform="translate(660, 360)">
      <line x1="60" y1="0" x2="10" y2="0" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)"/>
    </g>
  </g>


  <!-- Small exact lowercase 'medicomm' watermark in light gray at bottom-left with safe margin -->
  
</svg>