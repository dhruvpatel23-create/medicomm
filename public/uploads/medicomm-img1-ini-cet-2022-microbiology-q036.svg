<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#000000"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">NEMATODE MORPHOLOGY IDENTIFICATION</text>
  <text x="500" y="92" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Adult Nematode (A) and Associated Diagnostic Egg (B)</text>

  <!-- Panel A: Adult Worm with Cephalic Alae -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="410" height="780" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <text x="205" y="40" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">IMAGE A: ADULT NEMATODE</text>

    <!-- Pinworm Illustration -->
    <g transform="translate(205, 100)">
      <!-- Anterior cephalic alae (wing-like expansions) -->
      <path d="M -40 25 C -55 35 -55 70 -35 85 L -20 85 L -20 25 Z" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 40 25 C 55 35 55 70 35 85 L 20 85 L 20 25 Z" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="15" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Cephalic Alae</text>
      <line x1="-35" y1="20" x2="-45" y2="40" stroke="#7dd3fc" stroke-width="1.5"/>
      <line x1="35" y1="20" x2="45" y2="40" stroke="#7dd3fc" stroke-width="1.5"/>

      <!-- Esophagus with double bulb -->
      <ellipse cx="0" cy="50" rx="18" ry="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="110" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="0" y="115" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">BULB</text>

      <!-- Elongated tapering cylindrical body -->
      <path d="M -22 132 C -35 220 -40 320 -30 420 C -20 500 -10 560 0 630 C 10 560 20 500 30 420 C 40 320 35 220 22 132 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Pointed straight pin-like tail (Female pinworm) -->
      <path d="M 0 630 L 0 670" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="672" r="3" fill="#38bdf8"/>
      <text x="0" y="660" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" dx="70">Pointed tail</text>
      <line x1="25" y1="655" x2="5" y2="655" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Column B: 4 Candidate Eggs -->
  <g transform="translate(510, 120)">
    <rect x="0" y="0" width="430" height="780" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <text x="215" y="40" text-anchor="middle" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">COLUMN B: CANDIDATE EGGS</text>

    <!-- Egg 1: Ascaris lumbricoides -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(70, 75)">
        <ellipse cx="0" cy="0" rx="42" ry="34" fill="#78350f" stroke="#ca8a04" stroke-width="5" stroke-dasharray="8 4"/>
        <ellipse cx="0" cy="0" rx="28" ry="22" fill="#451a03"/>
      </g>
      <g transform="translate(280, 75)" filter="url(#glow)">
        <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">1</text>
      </g>
    </g>

    <!-- Egg 2: Trichuris trichiura (Barrel-shaped with bipolar plugs) -->
    <g transform="translate(40, 235)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(70, 75)">
        <path d="M -25 -28 C -38 -15 -38 15 -25 28 L 25 28 C 38 15 38 -15 25 -28 Z" fill="#78350f" stroke="#ca8a04" stroke-width="3"/>
        <!-- Bipolar mucoid plugs -->
        <ellipse cx="-28" cy="0" rx="8" ry="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <ellipse cx="28" cy="0" rx="8" ry="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      </g>
      <g transform="translate(280, 75)" filter="url(#glow)">
        <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">2</text>
      </g>
    </g>

    <!-- Egg 3: Enterobius vermicularis (Planoconvex D-shaped, folded larva) -->
    <g transform="translate(40, 405)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(70, 75)">
        <!-- D-shaped egg: one side flattened, one side convex -->
        <path d="M -25 -42 C 22 -42 42 -20 42 0 C 42 20 22 42 -25 42 L -25 -42 Z" fill="#020617" stroke="#e2e8f0" stroke-width="3.5"/>
        <!-- Folded tadpole-like / vermiform larva inside -->
        <path d="M -15 -24 C 15 -24 25 -10 25 0 C 25 10 15 24 -15 24 C -20 15 -18 -10 -15 -24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-15" cy="-24" r="3.5" fill="#facc15"/>
      </g>
      <g transform="translate(280, 75)" filter="url(#glow)">
        <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">3</text>
      </g>
    </g>

    <!-- Egg 4: Hookworm (Ancylostoma / Necator) -->
    <g transform="translate(40, 575)">
      <rect x="0" y="0" width="350" height="150" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(70, 75)">
        <ellipse cx="0" cy="0" rx="42" ry="28" fill="#020617" stroke="#e2e8f0" stroke-width="2"/>
        <!-- 4-8 cell blastomeres -->
        <circle cx="-14" cy="-8" r="9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="14" cy="-8" r="9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="-14" cy="8" r="9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="14" cy="8" r="9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      </g>
      <g transform="translate(280, 75)" filter="url(#glow)">
        <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">4</text>
      </g>
    </g>
  </g>

  <!-- Subtle medicomm watermark -->
  <text x="40" y="970" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="1">medicomm</text>
</svg>